  repairRuntimeData();
  const jobs=[
    ['狀態',renderHero],['任務',renderTasks],['副本',renderDungeon],
    ['商店',renderShop],['抽獎',renderLottery],['背包',renderBag],['家長後台',renderGM]
  ];
  for(const [name,fn] of jobs){
    try{fn();}
    catch(e){
      console.error(`Render ${name} failed`,e);
      const panelMap={'狀態':'hero','任務':'tasks','副本':'dungeon','商店':'shop','抽獎':'lottery','背包':'bag','家長後台':'gm'};
      const el=document.getElementById('panel-'+panelMap[name]);
      if(el)el.innerHTML=`<div class="card bad"><strong>⚠️ ${name}載入失敗</strong><div class="small">${String(e?.message||e)}</div></div>`;
    }
  }
  startLiveTimer();startStatusClock();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTasks();startLiveTimer();}});
function ensureHolidayTower(){
  if(!gameData.holidayTower)gameData.holidayTower={date:today(),runsUsed:0,bestFloor:0};
  if(gameData.holidayTower.date!==today())gameData.holidayTower={date:today(),runsUsed:0,bestFloor:gameData.holidayTower.bestFloor||0};
}
function towerRunsLeft(){ensureHolidayTower();return Math.max(0,(gameData.settings?.holidayTower?.dailyLimit||3)-gameData.holidayTower.runsUsed);}

function boot(){
  if(!gameData.hero.name){
    document.getElementById('heroSetup').style.display='block';
    document.getElementById('mainUI').style.display='none';
  }else{
    document.getElementById('heroSetup').style.display='none';
    document.getElementById('mainUI').style.display='block';
    ensureDailyDungeon();renderAll();setTimeout(()=>{refreshAutoRewardPreview();toggleRewardMode();updateTimerModeLabels();},0);
  }
}
boot();
</script>

<script type="module">
let fb=null,auth=null,db=null,currentUser=null,saving=false;

async function initFirebase(){
  const c=gameData.settings?.cloud;
  if(!c?.enabled)return false;
  try{
    const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const fsMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    fb={appMod,authMod,fsMod};
    const app=appMod.initializeApp({
      apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,
      storageBucket:c.storageBucket,messagingSenderId:c.messagingSenderId,appId:c.appId
    });
    auth=authMod.getAuth(app); db=fsMod.getFirestore(app);
    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      if(user){
        const s=document.getElementById('cloudStatus');
        if(s)s.textContent='☁️ 已登入：'+(user.email||'匿名使用者');
        await pullCloud();
      }
    });
    return true;
  }catch(e){console.error(e);alert('Firebase 初始化失敗：'+e.message);return false;}
}
async function pullCloud(){
  if(!currentUser||!db)return;
  const {doc,getDoc}=fb.fsMod;
  const ref=doc(db,'users',currentUser.uid,'seasons',CURRENT_SEASON_ID);
  const snap=await getDoc(ref);
  if(snap.exists()){
    const payload=snap.data();
    const localCfg=gameData.settings?.cloud;
    if(payload?.familyData?.profiles?.length){
      familyData=payload.familyData;
      activeProfileId=familyData.profiles.some(p=>p.id===activeProfileId)?activeProfileId:(familyData.activeProfileId||familyData.profiles[0].id);
      gameData=getActiveProfile().data;migrateProfileData(gameData);
    }else if(payload?.gameData){
      gameData=payload.gameData;migrateProfileData(gameData);
      familyData={version:8,activeProfileId:'hero_1',profiles:[{id:'hero_1',label:gameData.hero.name||'勇者 1',data:gameData}]};
      activeProfileId='hero_1';
    }
    if(payload?.familyData||payload?.gameData){
      if(!gameData.settings)gameData.settings={parentPinHash:'',cloud:{}};
      gameData.settings.cloud=localCfg||gameData.settings.cloud||{};
      persistFamily();boot();
    }
  }else await pushCloud();
}
async function pushCloud(){
  if(!currentUser||!db||saving)return;
  saving=true;
  try{
    const {doc,setDoc,serverTimestamp}=fb.fsMod;
    persistFamily();
    const clone=JSON.parse(JSON.stringify(familyData));
    await setDoc(doc(db,'users',currentUser.uid,'seasons',CURRENT_SEASON_ID),{familyData:clone,updatedAt:serverTimestamp()},{merge:true});
  }catch(e){console.error(e);}
  finally{saving=false;}
}
window.cloudSaveGame=()=>{if(currentUser)pushCloud();};
window.firebaseAnonymousLogin=async()=>{
  if(!fb){const ok=await initFirebase();if(!ok)return;}
  try{
    if(auth.currentUser)return;
    await fb.authMod.signInAnonymously(auth);
    alert('已建立匿名雲端身份，可以直接開始使用。');
  }catch(e){alert('匿名登入失敗：'+e.message);}
};
window.firebaseGoogleLogin=async()=>{
  if(!fb){const ok=await initFirebase();if(!ok)return;}
  try{
    const provider=new fb.authMod.GoogleAuthProvider();
    const result=await fb.authMod.signInWithPopup(auth,provider);
    const user=result.user;
    const access=ensureFamilyAccessModel();
    if(!access.ownerUid){
      access.ownerUid=user.uid;
      access.members[user.uid]={role:'owner',email:user.email||'',displayName:user.displayName||'家長'};
      persistFamily();
    }else if(!access.members[user.uid]){
      // 未被邀請者不自動取得管理權；先保留登入身份。
      access.members[user.uid]={role:'viewer',email:user.email||'',displayName:user.displayName||'家長'};
      persistFamily();
    }
    alert('Google 登入成功');
    renderAll();
  }catch(e){alert('Google 登入失敗：'+e.message);}
};
window.cloudSaveGame=()=>{if(currentUser)pushCloud();};
if(gameData.settings?.cloud?.enabled)initFirebase();</script>
