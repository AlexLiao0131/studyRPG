<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小學勇者大冒險 V10.2</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--card:#21262d;--border:#30363d;
  --gold:#f0883e;--blue:#58a6ff;--green:#3fb950;--purple:#bc8cff;
  --pink:#ff7b72;--text:#c9d1d9;--bright:#f0f6fc;--muted:#8b949e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;padding:12px}
.app{max-width:920px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 10px 32px #0008}
h1,h2,h3{color:var(--gold);margin:8px 0 14px}
h1{text-align:center;font-size:24px}
h2{font-size:18px}
h3{font-size:15px}
.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 18px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 6px;border-radius:8px;font-weight:700;cursor:pointer}
.tab.active{background:var(--gold);color:#111}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0d1117;border-left:4px solid var(--blue);padding:9px;border-radius:7px}
button{border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn{background:#238636;color:#fff}.btn.blue{background:#1f6feb}.btn.red{background:#da3633}.btn.gray{background:#30363d;color:#fff}.btn.gold{background:var(--gold);color:#111}.btn.purple{background:#8957e5;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:#0d1117;color:var(--bright);border:1px solid var(--border);border-radius:7px;padding:10px;margin:5px 0 10px}
label{font-size:12px;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:var(--muted)}
.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--pink)}.purple{color:var(--purple)}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#0d1117;border:1px solid var(--border);font-size:11px;margin:2px}
.progress{height:10px;background:#0d1117;border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.progress>div{height:100%;background:var(--green)}
.boss{border:2px solid var(--pink);box-shadow:0 0 20px #ff7b7233}
.dragon{border:2px solid var(--purple);box-shadow:0 0 24px #bc8cff33}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

.hero-scene{
  position:relative;
  height:260px;
  overflow:hidden;
  border:2px solid #3d444d;
  border-radius:12px;
  background:#101826;
  image-rendering:pixelated;
}
.sky-layer{
  position:absolute;inset:0;
  background:
    linear-gradient(#20304a 0 48%,#354b3e 48% 65%,#253226 65% 100%);
}
.mountain-layer{
  position:absolute;left:0;right:0;bottom:74px;height:92px;
  opacity:.9;
  background:
    linear-gradient(135deg,transparent 0 34%,#314154 34% 51%,transparent 51% 100%) 0 0/180px 90px repeat-x,
    linear-gradient(45deg,transparent 0 35%,#263747 35% 53%,transparent 53% 100%) 80px 16px/220px 80px repeat-x;
  animation:scrollMountains 18s linear infinite;
}
.ground-layer{
  position:absolute;left:0;right:0;bottom:0;height:78px;
  background:
    repeating-linear-gradient(90deg,#24351f 0 18px,#2e4427 18px 34px,#20301d 34px 52px);
  border-top:6px solid #47663b;
  animation:scrollGround 2.6s linear infinite;
}
.pixel-cloud{
  position:absolute;width:84px;height:18px;background:#d8e5e8;opacity:.8;
  box-shadow:16px -10px 0 #d8e5e8,36px -5px 0 #d8e5e8;
  animation:cloudMove 24s linear infinite;
}
.pixel-cloud.c1{top:38px;left:-100px}
.pixel-cloud.c2{top:72px;left:-240px;animation-duration:31s;transform:scale(.7)}
@keyframes scrollMountains{from{background-position:0 0,80px 16px}to{background-position:-360px 0,-360px 16px}}
@keyframes scrollGround{from{background-position:0 0}to{background-position:-104px 0}}
@keyframes cloudMove{from{transform:translateX(0)}to{transform:translateX(1100px)}}
.warrior-wrap{
  position:absolute;left:50%;bottom:42px;transform:translateX(-50%);
  animation:warriorBob .58s steps(2,end) infinite;
  filter:drop-shadow(0 8px 0 rgba(0,0,0,.28));
}
@keyframes warriorBob{
  0%,100%{margin-bottom:0}
  50%{margin-bottom:5px}
}
.pixel-warrior{
  position:relative;width:96px;height:142px;
  image-rendering:pixelated;
}

.hero-sprite{
  display:block;
  width:160px;
  height:160px;
  object-fit:contain;
  image-rendering:pixelated;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
.px{position:absolute;background:#999}
.helm{left:30px;top:6px;width:42px;height:12px;background:#aeb6bf;box-shadow:6px -6px 0 #c6ced7,-6px 6px 0 #818b96,36px 8px 0 #707a86}
.face{left:34px;top:24px;width:34px;height:28px;background:#d8a16f;box-shadow:0 10px 0 #c98d5e}
.eye{left:56px;top:32px;width:6px;height:6px;background:#18202b}
.body{left:30px;top:54px;width:42px;height:48px;background:#596877;box-shadow:6px 8px 0 #6f7f90,-6px 8px 0 #445260}
.belt{left:28px;top:94px;width:48px;height:8px;background:#6b4a2c}
.arm-l{left:18px;top:58px;width:12px;height:44px;background:#596877;transform:rotate(8deg)}
.arm-r{left:72px;top:58px;width:12px;height:44px;background:#596877;transform:rotate(-8deg)}
.hand-l{left:14px;top:94px;width:12px;height:12px;background:#d8a16f}
.hand-r{left:80px;top:94px;width:12px;height:12px;background:#d8a16f}
.leg-l{left:32px;top:102px;width:14px;height:34px;background:#303b48;transform:rotate(3deg)}
.leg-r{left:56px;top:102px;width:14px;height:34px;background:#303b48;transform:rotate(-3deg)}
.boot-l{left:26px;top:132px;width:24px;height:10px;background:#171d24}
.boot-r{left:54px;top:132px;width:24px;height:10px;background:#171d24}
.sword{left:4px;top:62px;width:8px;height:54px;background:#cdd8e2;transform:rotate(-16deg);box-shadow:0 -10px 0 #ecf4f8}
.guard{left:0;top:105px;width:24px;height:6px;background:#b88635;transform:rotate(-16deg)}
.scene-hud{
  position:absolute;left:10px;right:10px;top:10px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.hud-chip{
  background:rgba(8,12,18,.78);border:1px solid #56606b;border-radius:8px;
  padding:6px 9px;color:#fff;font-weight:800;font-size:13px;
}
.xp-wrap{margin-top:10px}
.xp-label{display:flex;justify-content:space-between;font-size:12px;color:#d7dde5;margin-bottom:5px}
.xp-bar{
  height:18px;background:#15191f;border:2px solid #59616d;border-radius:4px;
  box-shadow:inset 0 0 0 2px #07090c;overflow:hidden;
}
.xp-fill{
  height:100%;
  background:linear-gradient(#8f46db,#6a2cb7);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18);
  transition:width .3s ease;
}
.kid-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px
}
.kid-box{
  background:#11161d;border:1px solid #30363d;border-radius:9px;padding:10px;text-align:center;
  font-size:14px;font-weight:800
}



.balance-box{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;margin:10px 0}
.balance-good{border-left:5px solid #3fb950}
.balance-warn{border-left:5px solid #d29922}
.balance-bad{border-left:5px solid #f85149}

.balance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}
.balance-cell{background:#161b22;border-radius:7px;padding:8px;font-size:12px}
.gm-money-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gm-money-row button{min-height:44px}

}

.stat-rise{color:#3fb950;font-size:13px;min-width:34px;text-align:right}

  display:inline-block;font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px;

}
.quantity-box{
  display:flex;gap:8px;align-items:center;margin-top:10px
}
.quantity-box input{margin:0;min-width:0}
.gm-type-settings{padding:10px;background:#0d1117;border-radius:9px;margin:8px 0 12px}

.parent-lock{max-width:420px;margin:18px auto;padding:18px;background:#11161d;border:2px solid #3d444d;border-radius:12px;text-align:center}
.parent-lock input{font-size:22px;text-align:center;letter-spacing:5px}
.timeline{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px 2px 4px}
.timeline-node{min-width:92px;text-align:center;padding:8px;border-radius:9px;background:#11161d;border:1px solid #30363d}
.timeline-node.current{border-color:#f0883e;box-shadow:0 0 0 2px #f0883e33}
.timeline-node .icon{font-size:28px}.timeline-node .date{font-size:11px;color:#8b949e}
.timeline-line{height:3px;min-width:24px;background:#39414b;border-radius:999px}
.cloud-status{padding:8px;border-radius:8px;background:#0d1117;border:1px solid #30363d;font-size:12px}
.battle-stage{
  display:grid;
  grid-template-columns:1fr 86px 1fr;
  align-items:center;
  gap:10px;
  margin:12px 0;
}
.fighter-card{
  background:#11161d;
  border:2px solid #30363d;
  border-radius:12px;
  padding:12px 8px;
  text-align:center;
  min-width:0;
}
.fighter-icon{
  height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:68px;
  line-height:1;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));
}
.fighter-name{
  font-size:14px;
  font-weight:900;
  margin-top:4px;
  color:#f0f6fc;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.power-number{
  font-size:30px;
  font-weight:1000;
  margin-top:6px;
  letter-spacing:1px;
}
.vs-center{
  text-align:center;
  min-width:0;
}
.cross-swords{
  position:relative;
  width:64px;height:64px;
  margin:auto;
}
.cross-swords:before,
.cross-swords:after{
  content:"";
  position:absolute;
  left:29px;top:4px;
  width:7px;height:54px;
  border-radius:3px;
  background:linear-gradient(#e9f1f7 0 72%,#b88635 72% 82%,#5f3b20 82% 100%);
  transform-origin:center;
  box-shadow:0 0 0 1px #0008;
}
.cross-swords:before{transform:rotate(45deg)}
.cross-swords:after{transform:rotate(-45deg)}
.vs-text{
  font-size:12px;
  font-weight:900;
  color:#8b949e;
  margin-top:2px;
}
.battle-message{
  text-align:center;
  font-size:22px;
  font-weight:1000;
  margin:10px 0 4px;
}
.big-battle-btn{
  width:100%;
  min-height:56px;
  font-size:20px;
  margin-top:12px;
}

/* V6.1 正式草原橫向捲動背景 */
.adventure-stage{
  position:relative;
  overflow:hidden;
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScroll 30s linear infinite !important;
}
@keyframes grasslandScroll{
  from{background-position:0 center;}
  to{background-position:-1536px center;}
}


.scene{
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScroll 30s linear infinite !important;
}

.hero-scene{
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScroll 30s linear infinite !important;
}


/* V6.2 修正：舊 CSS 山景圖層會蓋住 PNG 背景，因此停用舊圖層 */
.hero-scene{
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScrollV62 28s linear infinite !important;
}

/* 這四層原本是用 CSS 畫的天空、山、草地與雲，會整片蓋住新背景 */
.hero-scene > .sky-layer,
.hero-scene > .mountain-layer,
.hero-scene > .ground-layer,
.hero-scene > .pixel-cloud{
  display:none !important;
}

@keyframes grasslandScrollV62{
  from{background-position:0 center;}
  to{background-position:-2048px center;}
}

/* 圖片載入失敗時至少保留深色底，不會整塊透明 */
.hero-scene{
  background-color:#203b52;
}


/* V6.3：改用真正的 <img> 圖層，不再依賴 CSS background-image */
.hero-scene{
  background:#203b52 !important;
  animation:none !important;
}
.scene-bg-scroll{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
}
.scene-bg-track{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  display:flex;
  width:max-content;
  animation:sceneBgMove 24s linear infinite;
  will-change:transform;
}
.scene-bg-track img{
  display:block;
  height:100%;
  width:auto;
  max-width:none;
  flex:none;
  image-rendering:pixelated;
}
@keyframes sceneBgMove{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}
.hero-scene .scene-hud,
.hero-scene .warrior-wrap{
  z-index:2;
}
.hero-scene > .sky-layer,
.hero-scene > .mountain-layer,
.hero-scene > .ground-layer,
.hero-scene > .pixel-cloud{
  display:none !important;
}


/* V6.4：人物落地修正 */
.hero-scene .warrior-wrap{
  bottom:-28px !important;
}

/* 手機窄螢幕稍微往上，避免人物被裁掉 */

.hero-scene .warrior-wrap{bottom:-60px !important;}
.battle-overlay{position:fixed;inset:0;z-index:12000;background:rgba(4,8,14,.94);display:flex;align-items:center;justify-content:center;padding:12px}
.battle-window{width:min(900px,100%);max-height:96vh;overflow:auto;background:#10151c;border:3px solid #59616d;border-radius:14px;padding:12px}
.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.battle-unit{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px}
.battle-unit.enemy{text-align:right}.battle-name{font-weight:1000;font-size:17px;color:#f0f6fc;margin-bottom:5px}
.hp-bar{height:18px;border:2px solid #59616d;background:#0b0f14;border-radius:4px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(#45c968,#238636);transition:width .35s ease}
.hp-fill.low{background:linear-gradient(#ffb347,#d29922)}.hp-fill.critical{background:linear-gradient(#ff7b72,#da3633)}
.hp-text{margin-top:4px;font-size:12px;color:#8b949e}
.battle-arena{position:relative;height:300px;overflow:hidden;border:2px solid #30363d;border-radius:10px;background:#203b52}
.battle-bg{position:absolute;inset:0;background:url("images/grassland_bg.png?v=7") center/cover no-repeat;filter:saturate(.95) brightness(.86)}
.battle-floor{position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(transparent,#102018aa)}
.battle-hero,.battle-enemy{position:absolute;bottom:18px;width:190px;height:190px;display:flex;align-items:flex-end;justify-content:center;transition:transform .22s ease,filter .18s ease}
.battle-hero{left:8%}.battle-enemy{right:8%}.battle-hero img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
.enemy-glyph{font-size:118px;line-height:1;filter:drop-shadow(0 8px 0 #0005)}
.battle-hero.attack{transform:translateX(80px) scale(1.04)}.battle-enemy.attack{transform:translateX(-80px) scale(1.05)}
.battle-hero.hurt,.battle-enemy.hurt{animation:battleShake .22s linear 2;filter:brightness(1.8) saturate(.6)}
.battle-hero.dodge{transform:translateX(-45px)}.battle-enemy.dodge{transform:translateX(45px)}
.battle-hero.parry,.battle-enemy.parry{filter:drop-shadow(0 0 12px #e6edf3)}
.battle-hero.block,.battle-enemy.block{filter:drop-shadow(0 0 14px #58a6ff)}
@keyframes battleShake{0%{margin-left:0}25%{margin-left:-8px}50%{margin-left:8px}75%{margin-left:-5px}100%{margin-left:0}}
.damage-float{position:absolute;z-index:5;font-size:30px;font-weight:1000;text-shadow:2px 2px #000;animation:floatDamage .8s ease forwards;pointer-events:none}
.damage-float.hero-side{left:26%;top:38%}.damage-float.enemy-side{right:26%;top:38%}
@keyframes floatDamage{0%{opacity:0;transform:translateY(12px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-42px) scale(1)}}
.battle-event-word{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:6;font-size:34px;font-weight:1000;color:#f0f6fc;text-shadow:3px 3px #000;white-space:nowrap;animation:eventPop .75s ease forwards}
@keyframes eventPop{0%{opacity:0;transform:translateX(-50%) scale(.6)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.battle-log{margin-top:10px;min-height:94px;background:#070b10;border:2px solid #30363d;border-radius:9px;padding:10px 12px;font-size:17px;font-weight:800;line-height:1.55}
.battle-result{margin-top:10px;text-align:center;background:#161b22;border:2px solid #30363d;border-radius:10px;padding:14px}
.battle-result-icon{font-size:54px}.battle-close{width:100%;min-height:54px;font-size:19px;margin-top:10px}
@media(max-width:600px){.battle-window{padding:8px}.battle-arena{height:260px}.battle-hero,.battle-enemy{width:145px;height:145px;bottom:14px}.battle-hero{left:1%}.battle-enemy{right:1%}.enemy-glyph{font-size:92px}.battle-log{font-size:15px}.battle-event-word{font-size:28px}}


/* V8 家庭/角色/自動養成 */

<body>

<script>
const STORAGE_KEY='heroRPG_V2';

function uid(){return 'id_'+Math.random().toString(36).slice(2)+Date.now().toString(36);}
function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowLocalTime(){
  return new Date().toLocaleTimeString('zh-TW',{hour12:false});
}
function defaultData(){
  return {
    hero:{
      name:'',gender:'male',heroClass:'見習勇者',jobAwakened:false,jobScores:{},skills:[],level:1,exp:0,maxExp:100,gold:0,lotteryCoins:0,virtue:0,
      stats:{str:10,agi:10,int:10,will:10}
    },
    semester:{
      startDate:'2026-08-31',
      endDate:'2027-01-20',
      schoolWeekdays:[1,2,3,4,5],
      events:[
        {id:uid(),date:'2026-11-05',type:'midterm',name:'期中考 Day 1'},
        {id:uid(),date:'2026-11-06',type:'midterm',name:'期中考 Day 2'},
        {id:uid(),date:'2027-01-13',type:'final',name:'期末考 Day 1'},
        {id:uid(),date:'2027-01-14',type:'final',name:'期末考 Day 2'}
      ],
      worldState:'normal'
    },
    tasks:[
      {
        id:uid(),name:'國語生字練習',description:'完成今日生字練習',
        subject:'國語',progressType:'生字練習',progressValue:'第1課',
        goldReward:20,expReward:10,dailyLimit:1,active:true,
        statRules:[{maxMinutes:30,stat:'agi',value:5},{maxMinutes:60,stat:'agi',value:1}]
      },
      {
        id:uid(),name:'數學複習',description:'完成今天的數學複習',
        subject:'數學',progressType:'複習進度',progressValue:'第一單元',
        goldReward:20,expReward:12,dailyLimit:1,active:true,
        statRules:[{maxMinutes:45,stat:'int',value:3},{maxMinutes:90,stat:'int',value:1}]
      }
    ],
    activeTasks:{},
    taskRecords:[],
    learningProgress:[],
    shopItems:[
      {id:uid(),name:'NS 30分鐘兌換券',price:100,description:'Nintendo Switch 30 分鐘',dailyLimit:1,active:true},
      {id:uid(),name:'電視 30分鐘兌換券',price:80,description:'看電視 30 分鐘',dailyLimit:1,active:true}
    ],
    inventory:[],
    couponRequests:[],
    monsters:[
      {id:uid(),name:'哥布林隊長',power:65,rewardGold:15,rewardExp:15,active:true},
      {id:uid(),name:'獸人戰士',power:80,rewardGold:20,rewardExp:20,active:true},
      {id:uid(),name:'黑暗騎士',power:100,rewardGold:25,rewardExp:25,active:true}
    ],
    dailyDungeon:{date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''},
    battleRecords:[],
    events:[
      {id:uid(),date:'2026-08-31',type:'start',name:'第一學期冒險開始',power:0,rewardGold:0,rewardExp:0,active:true},
      {id:uid(),date:'2026-11-05',type:'midterm',name:'第一次定期評量・大魔王 I',power:220,rewardGold:100,rewardExp:120,active:true},
      {id:uid(),date:'2026-11-06',type:'midterm',name:'第一次定期評量・大魔王 II',power:235,rewardGold:120,rewardExp:140,active:true},
      {id:uid(),date:'2026-12-19',type:'special',name:'校慶特別活動',power:120,rewardGold:80,rewardExp:80,active:true},
      {id:uid(),date:'2027-01-13',type:'final',name:'期末惡龍・第一戰',power:320,rewardGold:180,rewardExp:200,active:true},
      {id:uid(),date:'2027-01-14',type:'final',name:'期末惡龍・最終戰',power:350,rewardGold:220,rewardExp:240,active:true},
      {id:uid(),date:'2027-01-20',type:'end',name:'第一學期結算',power:0,rewardGold:0,rewardExp:0,active:true},
      {id:uid(),date:'2027-02-11',type:'start',name:'第二學期開始',power:0,rewardGold:0,rewardExp:0,active:true}
    ],
    settings:{
      parentPinHash:'',
      cloud:{
        enabled:false,apiKey:'',authDomain:'',projectId:'',
        storageBucket:'',messagingSenderId:'',appId:'',email:''
      }
    },
    lotteryPool:[
      {id:uid(),type:'gold',label:'金幣 +30',value:30,weight:50},
      {id:uid(),type:'gold',label:'金幣 +60',value:60,weight:25},
      {id:uid(),type:'shop',label:'隨機商店兌換券',value:'random',weight:20},
      {id:uid(),type:'gold',label:'金幣 +150',value:150,weight:5}
    ]
  };
}
const FAMILY_KEY='heroRPG_FAMILY_V8';
let familyData=loadFamilyData();
let activeProfileId=sessionStorage.getItem('activeHeroProfile')||familyData.activeProfileId||familyData.profiles[0].id;
let gameData=getActiveProfile().data;

function loadFamilyData(){
  try{
    const saved=JSON.parse(localStorage.getItem(FAMILY_KEY));
    if(saved?.profiles?.length)return saved;
  }catch(e){}
  // 自動把舊版單一角色存檔搬進 V8，不清除舊資料
  const legacy=loadGame();
  return {version:8,activeProfileId:'hero_1',profiles:[{id:'hero_1',label:legacy.hero?.name||'勇者 1',data:legacy}]};
}
function getActiveProfile(){
  let p=familyData.profiles.find(x=>x.id===activeProfileId);
  if(!p){p=familyData.profiles[0];activeProfileId=p.id;}
  return p;
}
function persistFamily(){
  familyData.activeProfileId=activeProfileId;
  const p=getActiveProfile(); p.data=gameData; p.label=gameData.hero?.name||p.label;
  localStorage.setItem(FAMILY_KEY,JSON.stringify(familyData));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(gameData)); // 保留舊版相容備份
}
function switchProfile(id){
  const p=familyData.profiles.find(x=>x.id===id); if(!p)return;
  persistFamily(); activeProfileId=id; sessionStorage.setItem('activeHeroProfile',id);
  gameData=p.data; migrateProfileData(gameData);
  document.getElementById('profileOverlay')?.remove();
  boot();
}
function addHeroProfile(){
  persistFamily();
  const id='hero_'+uid();
  const d=defaultData();
  familyData.profiles.push({id,label:'新勇者',data:d});
  activeProfileId=id; sessionStorage.setItem('activeHeroProfile',id); gameData=d;
  localStorage.setItem(FAMILY_KEY,JSON.stringify(familyData));
  document.getElementById('profileOverlay')?.remove(); boot();
}
function showProfileSwitcher(){
  persistFamily();
  document.getElementById('profileOverlay')?.remove();
  const o=document.createElement('div');o.id='profileOverlay';o.className='profile-overlay';
  o.innerHTML=`<div class="profile-box"><h2>今天是誰要冒險？</h2>
    ${familyData.profiles.map(p=>`<div class="profile-card"><div><strong>${p.data.hero?.gender==='female'?'👧':'👦'} ${p.data.hero?.name||'尚未建立'}</strong><div class="small">Lv.${p.data.hero?.level||1}｜${p.data.hero?.jobAwakened?p.data.hero.heroClass:'見習勇者'}</div></div><button class="btn ${p.id===activeProfileId?'gold':'blue'}" onclick="switchProfile('${p.id}')">${p.id===activeProfileId?'使用中':'切換'}</button></div>`).join('')}
    <button class="btn purple" style="width:100%;margin-top:8px" onclick="addHeroProfile()">＋ 新增孩子角色</button>
    <button class="btn gray" style="width:100%;margin-top:8px" onclick="document.getElementById('profileOverlay').remove()">關閉</button>
  </div>`;
  document.body.appendChild(o);
}
let timerInterval=null;
let clockInterval=null;
let heroIdleInterval=null;
const HERO_IDLE_FRAMES=[1,2,3,4].map(n=>`images/hero_idle_${n}.png`);

function heroIdleFrame(n=1){
  // 女勇者素材日後放入 images/hero_female_idle_1~4.png 即可切換。
  // 目前未提供女勇者圖檔時沿用現有勇者素材，避免破圖。
  return `images/hero_idle_${n}.png`;
}

function startHeroIdleAnimation(){
  if(heroIdleInterval) clearInterval(heroIdleInterval);
  let frame=0;
  const img=document.getElementById('heroSprite');
  if(!img)return;

  // 預載四張圖，避免 Safari 第一次切換時閃爍
  HERO_IDLE_FRAMES.forEach(src=>{
    const preload=new Image();
    preload.src=src;
  });

  img.src=HERO_IDLE_FRAMES[0];
  heroIdleInterval=setInterval(()=>{
    const current=document.getElementById('heroSprite');
    if(!current){
      clearInterval(heroIdleInterval);
      heroIdleInterval=null;
      return;
    }
    frame=(frame+1)%HERO_IDLE_FRAMES.length;
    current.src=HERO_IDLE_FRAMES[frame];
  },300);
}

// V8 相容舊存檔
function migrateProfileData(d){
  if(d.hero?.stats && d.hero.stats.vit!==undefined){
    const oldVit=Number(d.hero.stats.vit)||0;
    d.hero.legacyVit=oldVit;
    d.hero.stats.will=(Number(d.hero.stats.will)||10)+Math.max(0,oldVit-10);
    delete d.hero.stats.vit;
  }
  if(!d.hero.gender)d.hero.gender='male';
  if(d.hero.virtue==null)d.hero.virtue=0;
  if(!d.hero.heroClass)d.hero.heroClass='見習勇者';
  if(d.hero.jobAwakened==null)d.hero.jobAwakened=!['','見習勇者','戰士','法師','遊俠'].includes(d.hero.heroClass)?true:false;
  if(!d.hero.jobScores)d.hero.jobScores={};
  if(!d.hero.skills)d.hero.skills=[];
  if(d.hero.pendingGoldDebt==null)d.hero.pendingGoldDebt=0;
  if(!d.semester)d.semester={startDate:'2026-08-31',endDate:'2027-01-20',schoolWeekdays:[1,2,3,4,5],events:[],worldState:'normal'};
  if(!d.semester.schoolWeekdays)d.semester.schoolWeekdays=[1,2,3,4,5];
  if(!d.semester.events)d.semester.events=[];
  if(!d.semester.worldState)d.semester.worldState='normal';
  if(!d.hero.lastStatGains)d.hero.lastStatGains={};
  (d.tasks||[]).forEach(t=>{
    if(!t.taskType)t.taskType='timer';
    if(t.quantityTarget==null)t.quantityTarget=1;
    if(!t.quantityUnit)t.quantityUnit='次';
    if(!t.fixedStat)t.fixedStat='will';
    if(t.fixedStat==='vit')t.fixedStat='will';
    (t.statRules||[]).forEach(r=>{if(r.stat==='vit')r.stat='will';});
    if(t.fixedStatValue==null)t.fixedStatValue=1;
    if(!t.rewardMode)t.rewardMode='manual'; // 舊任務維持原獎勵，不偷偷改數值
    if(!t.category)t.category='custom';
    if(t.category==='reading')t.category='extra_reading';
    if(!t.difficulty)t.difficulty='normal';
    if(!t.weekdays)t.weekdays=[1,2,3,4,5,6,0];
    if(!t.activeFrom)t.activeFrom=d.semester?.startDate||today();
    if(t.activeUntil===undefined)t.activeUntil='';
    if(t.countForBossOnNonSchoolDay===undefined)t.countForBossOnNonSchoolDay=false;
    
  });
  (d.taskRecords||[]).forEach(r=>{if(!r.approvalStatus)r.approvalStatus='approved';});
  (d.monsters||[]).forEach(m=>{if(!m.difficulty)m.difficulty='normal';});

const AUTO_TASK_RULES={
  study:{label:'📚 功課／預習複習',weights:{int:.67,will:.33}},
  sport:{label:'⚽ 運動',weights:{str:.55,agi:.45}},

  custom:{label:'⚙️ 自訂',weights:{will:1}}
};
const DIFFICULTY_POINTS={easy:1,normal:3,hard:4,challenge:5};
function autoTaskRewards(category,difficulty,taskType){
  const rule=AUTO_TASK_RULES[category]||AUTO_TASK_RULES.custom;
  const budget=DIFFICULTY_POINTS[difficulty]||3;
  const entries=Object.entries(rule.weights).sort((a,b)=>b[1]-a[1]);
  const rewards={}; let used=0;
  entries.forEach(([k,w],i)=>{
    let v=i===entries.length-1?budget-used:Math.max(0,Math.round(budget*w));
    used+=v;if(v)rewards[k]=(rewards[k]||0)+v;
  });
  return rewards;
}
function applyRewardMap(map){
  const gains={};
  Object.entries(map||{}).forEach(([k,v])=>{
    v=Number(v)||0;if(!v)return;
    if(k==='virtue')gameData.hero.virtue=(gameData.hero.virtue||0)+v;
    else gameData.hero.stats[k]=(gameData.hero.stats[k]||0)+v;
    gains[k]=(gains[k]||0)+v;
  });
  gameData.hero.lastStatGains=gains;
  return gains;
}
function rewardText(map){

function timerRewardTier(t,minutes){
  const a=Number(t.fastMinutes)||30;
  const b=Number(t.standardMinutes)||60;
  const fast=Math.min(a,b),standard=Math.max(a,b);
  if(minutes<=fast){
    return {key:'excellent',label:'🌟 優秀完成',goldMultiplier:1.5,expMultiplier:1.5,agiBonus:2};
  }
  if(minutes<=standard){
    return {key:'good',label:'✨ 快速完成',goldMultiplier:1.2,expMultiplier:1.2,agiBonus:1};
  }
  return {key:'normal',label:'✅ 完成',goldMultiplier:1,expMultiplier:1,agiBonus:0};
}
function calculateTimedRewards(t,minutes){
  const tier=timerRewardTier(t,minutes);
  return {
    tier,
    gold:Math.round((Number(t.goldReward)||0)*tier.goldMultiplier),
    exp:Math.round((Number(t.expReward)||0)*tier.expMultiplier)
  };
}

function taskAutoRewardMap(t,minutes=null){
  const base=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType);
  // 有計時的任務才產生效率敏捷補正；不計時的足球/鋼琴不受影響
  if(t.taskType==='timer' && minutes!=null){
    const tier=timerRewardTier(t,minutes);
    if(tier.agiBonus)base.agi=(base.agi||0)+tier.agiBonus;
  }
  return base;
}

async function sha256Text(s){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function daysBetween(a,b){
  const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');

}

function taskDailyPotential(t){
  const limit=Math.max(1,Number(t.dailyLimit)||1);
  const stat = t.taskType==='timer'
    ? Math.max(0,...(t.statRules||[]).map(r=>Number(r.value)||0))
    : Number(t.fixedStatValue)||0;
  return {
    exp:(Number(t.expReward)||0)*limit,
    gold:(Number(t.goldReward)||0)*limit,
    stat:stat*limit
  };
}
function dailyPotential(){
  return (gameData.tasks||[]).filter(t=>t.active).reduce((a,t)=>{
    const p=taskDailyPotential(t);
    a.exp+=p.exp;a.gold+=p.gold;a.stat+=p.stat;return a;
  },{exp:0,gold:0,stat:0});

function estimatePowerAt(date,rate=BALANCE_CONFIG.expectedCompletion){
  const days=daysBetween(today(),date);
  const active=(gameData.tasks||[]).filter(t=>t.active);
  let power=combatPower();
  active.forEach(t=>{
    const limit=Math.max(1,Number(t.dailyLimit)||1);
    let statKey='will',statVal=0;
    if((t.taskType||'timer')==='timer'){
      const rules=[...(t.statRules||[])].sort((a,b)=>(Number(a.maxMinutes)||0)-(Number(b.maxMinutes)||0));
      const r=rules[Math.min(1,rules.length-1)]||rules[0];
      if(r){statKey=r.stat;statVal=Number(r.value)||0;}
    }else{
      statKey=t.fixedStat||'will';statVal=Number(t.fixedStatValue)||0;
    }
    const weight=BALANCE_CONFIG.combatWeights[statKey]||1.5;
    power += days*rate*limit*statVal*weight;
  });
  return Math.round(power);
}

function addExp(v){
  gameData.hero.exp+=v;
  while(gameData.hero.exp>=gameData.hero.maxExp){
    gameData.hero.exp-=gameData.hero.maxExp;
    gameData.hero.level++;
    gameData.hero.maxExp=Math.floor(gameData.hero.maxExp*1.2);
    Object.keys(gameData.hero.stats).forEach(k=>gameData.hero.stats[k]+=1);

  }

function completedCount(taskId){
  return gameData.taskRecords.filter(r=>r.taskId===taskId&&r.date===today()&&r.status==='completed').length;
}
function startTask(taskId){
  if(gameData.activeTasks[taskId]){alert('這個任務已經在計時');return;}
  const t=gameData.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(completedCount(taskId)>=t.dailyLimit){alert('今天已達完成上限');return;}
  gameData.activeTasks[taskId]=Date.now();
  saveGame();renderTasks();startLiveTimer();
}
function finishTask(taskId){
  const start=gameData.activeTasks[taskId];
  if(!start){alert('請先開始任務');return;}
  const t=gameData.tasks.find(x=>x.id===taskId);
  const minutes=(Date.now()-start)/60000;
  delete gameData.activeTasks[taskId];

  let statGain=null;
  const timedReward=calculateTimedRewards(t,minutes);
  applyGoldWithDebt(timedReward.gold);
  addExp(timedReward.exp);
  if(t.rewardMode==='auto'){
    const gains=applyRewardMap(taskAutoRewardMap(t,minutes));
    statGain={multi:true,gains};
  }else{
    for(const r of [...(t.statRules||[])].sort((a,b)=>a.maxMinutes-b.maxMinutes)){
      if(minutes<=r.maxMinutes){statGain=r;break;}
    }
    if(statGain){
      const val=Number(statGain.value)||0;
      if(statGain.stat==='virtue')gameData.hero.virtue=(gameData.hero.virtue||0)+val;
      else gameData.hero.stats[statGain.stat]=(gameData.hero.stats[statGain.stat]||0)+val;
      gameData.hero.lastStatGains={[statGain.stat]:val};
    }else gameData.hero.lastStatGains={};
  }

  const record={
    id:uid(),taskId:t.id,date:today(),status:'completed',
    startedAt:new Date(start).toISOString(),completedAt:new Date().toISOString(),
    durationMinutes:minutes,
    rewards:{gold:timedReward.gold,exp:timedReward.exp,baseGold:Number(t.goldReward)||0,baseExp:Number(t.expReward)||0,timerTier:timedReward.tier.key,statGain},
    approvalStatus:'pending',
    rollback:{gold:timedReward.gold,exp:timedReward.exp,statGain:statGain?.multi?statGain.gains:(statGain?{[statGain.stat]:Number(statGain.value)||0}:{})}
  };
  gameData.taskRecords.push(record);

  if(t.subject||t.progressType||t.progressValue){
    gameData.learningProgress.push({
      id:uid(),date:today(),
      subject:t.subject||'',
      item:t.progressType||t.name,
      progress:t.progressValue||'完成'
    });
  }
  evaluateHiddenJob(true);saveGame();
  const bonusText=timedReward.tier.key==='normal'?'':`\n${timedReward.tier.label}！獎勵 ×${timedReward.tier.goldMultiplier}`;
  alert(`完成【${t.name}】\n耗時 ${minutes.toFixed(1)} 分鐘${bonusText}\n💰 金幣 +${timedReward.gold}\n⭐ EXP +${timedReward.exp}`+(statGain?.multi?`\n${rewardText(statGain.gains)}`:statGain?`\n${statName(statGain.stat)} +${statGain.value}`:''));
  renderAll();
}

function reverseExp(amount){
  let remain=Number(amount)||0;
  gameData.hero.exp-=remain;
  while(gameData.hero.exp<0 && gameData.hero.level>1){
    gameData.hero.level--;
    gameData.hero.maxExp=Math.max(100,Math.floor(gameData.hero.maxExp/1.2));
    gameData.hero.exp+=gameData.hero.maxExp;
  }
  if(gameData.hero.exp<0)gameData.hero.exp=0;
}
function reviewTaskRecord(recordId,approved){
  const r=(gameData.taskRecords||[]).find(x=>x.id===recordId);
  if(!r||r.approvalStatus!=='pending')return;
  if(approved){r.approvalStatus='approved';saveGame();renderGM();return;}
  const rb=r.rollback||{};
  const statMap=rb.statGain||{};
  Object.entries(statMap).forEach(([k,v])=>{
    if(k==='virtue')gameData.hero.virtue=Math.max(0,(gameData.hero.virtue||0)-(Number(v)||0));
    else gameData.hero.stats[k]=Math.max(0,(gameData.hero.stats[k]||0)-(Number(v)||0));
  });
  reverseExp(rb.exp||0);
  let need=Math.max(0,Number(rb.gold)||0);
  const take=Math.min(gameData.hero.gold,need);
  gameData.hero.gold-=take;need-=take;
  if(need>0)gameData.hero.pendingGoldDebt=(gameData.hero.pendingGoldDebt||0)+need;
  r.approvalStatus='rejected';r.rejectedAt=new Date().toISOString();
  saveGame();renderAll();
}
function applyGoldWithDebt(amount){
  amount=Number(amount)||0;
  const debt=gameData.hero.pendingGoldDebt||0;
  const paid=Math.min(amount,debt);
  gameData.hero.pendingGoldDebt=debt-paid;
  gameData.hero.gold+=amount-paid;
  return {gross:amount,paid,net:amount-paid};
}

function weightedPick(items){
  const total=items.reduce((s,x)=>s+Math.max(0,Number(x.weight)||0),0);
  if(total<=0)return null;
  let r=Math.random()*total;
  for(const item of items){
    r-=Math.max(0,Number(item.weight)||0);
    if(r<=0)return item;
  }
  return items[items.length-1];
}
function rollDungeonDrop(rating=1){
  const pools={
    3:[{type:'coupon',weight:45},{type:'lottery',weight:35},{type:'gold',weight:20}],
    2:[{type:'coupon',weight:25},{type:'lottery',weight:25},{type:'gold',weight:50}],
    1:[{type:'lottery',weight:12},{type:'gold',weight:88}]
  };
  const p=weightedPick(pools[rating]||pools[1]);
  if(!p)return null;
  if(p.type==='gold'){
    const base=rating===3?35:rating===2?25:15;
    const amount=base+Math.floor(Math.random()*(rating===3?41:21));
    gameData.hero.gold+=amount;
    return {type:'gold',label:`金幣 +${amount} G`,value:amount};
  }
  if(p.type==='coupon'){
    const available=gameData.shopItems.filter(x=>x.active);
    if(!available.length){gameData.hero.gold+=30;return {type:'gold',label:'金幣 +30 G',value:30};}
    const item=available[Math.floor(Math.random()*available.length)];
    gameData.inventory.push({id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'dungeon'});
    return {type:'coupon',label:item.name,value:item.id};
  }
  gameData.hero.lotteryCoins+=1;
  return {type:'lottery',label:'抽獎金幣 ×1',value:1};
}
function calculateBattleRating(win,heroHp,heroMaxHp,rounds){
  if(!win)return 0;
  const hpPct=heroHp/Math.max(1,heroMaxHp);
  if(hpPct>=.70 && rounds<=12)return 3;
  if(hpPct>=.40)return 2;
  return 1;
}


/* =========================
   V8.1 學期每日怪物成長引擎
   核心：怪物依「學期預期成長」而非玩家即時戰力生成。
   75% 正常任務完成率為預設平衡點。
   ========================= */

function weekdayNumberFor(dateStr=today()){
  return new Date(dateStr+'T12:00:00').getDay();
}
function isTaskScheduledToday(t,dateStr=today()){
  const wd=weekdayNumberFor(dateStr);
  const arr=t.weekdays||[1,2,3,4,5,6,0];
  return arr.includes(wd);
}
function effectiveSchoolDaysUntil(dateStr){
  const sem=gameData.semester||{}, start=new Date((sem.startDate||today())+'T12:00:00'), end=new Date(dateStr+'T12:00:00');
  const allowed=new Set(sem.schoolWeekdays||[1,2,3,4,5]);
  let count=0, d=new Date(start);
  while(d<=end){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const special=(sem.events||[]).find(e=>e.date===ds);
    if(allowed.has(d.getDay()) && special?.type!=='holiday')count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
function semesterWeekIndex(){
  const start=new Date((gameData.semester?.startDate||today())+'T12:00:00');
  const now=new Date(today()+'T12:00:00');
  return Math.max(1,Math.floor((now-start)/604800000)+1);
}

function taskIsEffectiveOn(t,dateStr){

  const from=t.activeFrom||t.createdDate||gameData.semester?.startDate||dateStr;

function taskCountsTowardBossOn(t,dateStr){
  if(!isBossLearningCategory(t))return false;
  if(!taskIsEffectiveOn(t,dateStr))return false;
  if(!isTaskScheduledToday(t,dateStr))return false;
  if(isNoStudyCalendarDay(dateStr))return false;
  if(isConfiguredSchoolDay(dateStr))return true;
  return t.countForBossOnNonSchoolDay===true;
}

function theoreticalLearningRequirement(kind='midterm'){
  const sem=gameData.semester||{};
  const events=(sem.events||[]).filter(e=>e.type===kind).sort((a,b)=>a.date.localeCompare(b.date));
  const cutoff=events[0]?.date || (kind==='final'?sem.endDate:today());
  const start=sem.startDate||today();
  let expected=0,scheduledCount=0,excludedDays=0;
  const d0=new Date(start+'T12:00:00'),d1=new Date(cutoff+'T12:00:00');
  for(let d=new Date(d0);d<=d1;d.setDate(d.getDate()+1)){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(isNoStudyCalendarDay(ds)){excludedDays++;continue;}
    (gameData.tasks||[]).forEach(t=>{
      if(!taskCountsTowardBossOn(t,ds))return;
      expected+=(DIFFICULTY_POINTS[t.difficulty]||3);
      scheduledCount++;
    });
  }
  return {expected,scheduledCount,excludedDays,start,cutoff};
}

function learningCompletionRatio(kind='midterm'){
  const req=theoreticalLearningRequirement(kind);
  const records=(gameData.taskRecords||[]).filter(r=>{
    if(r.date<req.start||r.date>req.cutoff||r.approvalStatus!=='approved')return false;
    const t=(gameData.tasks||[]).find(x=>x.id===r.taskId);
    return !!t && taskCountsTowardBossOn(t,r.date);
  });
  const approvedPoints=records.reduce((sum,r)=>{
    const t=(gameData.tasks||[]).find(x=>x.id===r.taskId);
    return sum+(DIFFICULTY_POINTS[t?.difficulty]||3);
  },0);
  return req.expected>0?Math.min(1.2,approvedPoints/req.expected):1;
}

function bossLearningReport(kind='midterm'){
  const req=theoreticalLearningRequirement(kind);
  let approved=0;
  (gameData.taskRecords||[]).forEach(r=>{
    if(r.date<req.start||r.date>req.cutoff||r.approvalStatus!=='approved')return;
    const t=(gameData.tasks||[]).find(x=>x.id===r.taskId);
    if(t&&taskCountsTowardBossOn(t,r.date))approved+=(DIFFICULTY_POINTS[t.difficulty]||3);
  });
  const ratio=req.expected?approved/req.expected:1;
  return {required:req.expected,approved,ratio,excludedDays:req.excludedDays,cutoff:req.cutoff};
}

function bossDifficultyMultiplier(kind){
  const ratio=learningCompletionRatio(kind);
  if(ratio>=.9)return .88;
  if(ratio>=.75)return .97;
  if(ratio>=.60)return 1.06;
  if(ratio>=.50)return 1.14;
  if(ratio>=.35)return 1.28;
  return 1.45;
}

function currentWorldBackground(){

const SEMESTER_BALANCE = {
  targetCompletion: .75,
  dailyVariance: .035,
  difficultyMultipliers: {easy:.88, normal:.94, hard:1.02, elite:1.08},
  eventMultipliers: {daily:1.00, midterm:1.08, final:1.12},
  minPower: 70
};

function dateOnlyBattle(s){ return s ? new Date(s+'T00:00:00') : null; }
function daysBetweenBattle(a,b){
  if(!a||!b)return 0;
  return Math.max(0,Math.floor((b-a)/86400000));
}
function semesterProgressInfo(){
  const sem=gameData.semester||{};
  const start=dateOnlyBattle(sem.startDate), end=dateOnlyBattle(sem.endDate), now=dateOnlyBattle(today());
  if(!start||!end||end<=start) return {valid:false,day:1,totalDays:120,progress:0};
  const total=Math.max(1,daysBetweenBattle(start,end)+1);
  const day=Math.min(total,Math.max(1,daysBetweenBattle(start,now)+1));
  return {valid:true,day,totalDays:total,progress:(day-1)/Math.max(1,total-1)};
}

function expectedDailyStatBudget(){
  // 只採「系統自動換算」任務建立基準；手動任務不拿來把世界難度灌爆。
  const active=(gameData.tasks||[]).filter(t=>t.active!==false && t.rewardMode==='auto');
  if(!active.length) return 3.0;
  let sum=0;
  active.forEach(t=>{
    const map=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType||'simple');
    sum += Object.values(map).reduce((a,b)=>a+(Number(b)||0),0);
  });
  // dailyLimit 避免重複任務造成怪物無限膨脹；以每天每類正常完成一次估算。
  return clampBattle(sum,2,18);
}

function expectedSemesterPower(){
  const info=semesterProgressInfo();
  const baseStats={str:10,agi:10,int:10,will:10};
  const budget=expectedDailyStatBudget()*SEMESTER_BALANCE.targetCompletion;
  // 依目前家庭任務結構估計五戰鬥能力的平均成長。
  const active=(gameData.tasks||[]).filter(t=>t.active!==false && t.rewardMode==='auto');
  let weights={str:0,agi:0,int:0,will:0}, total=0;
  active.forEach(t=>{
    const map=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType||'simple');
    Object.entries(map).forEach(([k,v])=>{
      if(k!=='virtue'){weights[k]=(weights[k]||0)+(Number(v)||0); total+=Number(v)||0;}
    });
  });
  if(total<=0){weights={str:.25,agi:.25,int:.25,will:.25};total=1;}
  const elapsed=Math.max(0,info.day-1);
  Object.keys(baseStats).forEach(k=>{
    baseStats[k]+=elapsed*budget*((weights[k]||0)/total);
  });
  // 與 combatPower() 同尺度的簡化預期值。
  return Math.round(
    baseStats.str*2.2 + baseStats.agi*2.0 + baseStats.int*1.8 +
    baseStats.will*1.9
  );
}

function deterministicDailyVariance(){
  const s=today().replaceAll('-','');
  let n=0; for(const ch of s)n=(n*31+ch.charCodeAt(0))%997;
  return ((n/996)*2-1)*SEMESTER_BALANCE.dailyVariance;
}

function generatedMonsterPower(kind='daily',difficulty='normal'){
  const expected=Math.max(SEMESTER_BALANCE.minPower,expectedSemesterPower());
  const diff=SEMESTER_BALANCE.difficultyMultipliers[difficulty]||SEMESTER_BALANCE.difficultyMultipliers.normal;
  const evt=SEMESTER_BALANCE.eventMultipliers[kind]||1;
  return Math.max(SEMESTER_BALANCE.minPower,Math.round(expected*diff*evt*(1+deterministicDailyVariance())));
}

function actualVsExpectedStatus(monsterPower){
  const ratio=combatPower()/Math.max(1,monsterPower);
  if(ratio>=1.15)return {label:'🟢 優勢戰',cls:'good'};
  if(ratio>=1.00)return {label:'🟢 正常戰',cls:'good'};
  if(ratio>=.90)return {label:'🟡 苦戰',cls:'warn'};
  if(ratio>=.80)return {label:'🟠 強敵',cls:'warn'};
  return {label:'🔴 危險',cls:'bad'};
}

function resolvedDungeonPower(evt,monster){
  if(evt && Number(evt.power)>0 && evt.manualPower===true) return Number(evt.power);
  if(evt?.type==='midterm'){
    return Math.round(generatedMonsterPower('midterm','normal')*bossDifficultyMultiplier('midterm'));
  }
  if(evt?.type==='final'){
    return Math.round(generatedMonsterPower('final','normal')*bossDifficultyMultiplier('final'));
  }
  const difficulty=monster?.difficulty||'normal';
  return generatedMonsterPower('daily',difficulty);
}

};

   description:'受到傷害 -35%、格擋率 +15%，持續2回合。',
   effect:{effectType:'buff',turns:2,mods:{damageTaken:-.35,block:.15}}}
];

function clampBattle(v,min,max){return Math.max(min,Math.min(max,v));}
function battleSleep(ms){return new Promise(r=>setTimeout(r,ms));}
function effectiveStat(raw){
  raw=Math.max(0,Number(raw)||0);
  return BATTLE_CONFIG.statScale*(1-Math.exp(-raw/BATTLE_CONFIG.statScale));
}
function normalizeHeroStats(){
  const s=gameData.hero.stats||{};
  return {
    str:effectiveStat(s.str),
    int:effectiveStat(s.int),
    agi:effectiveStat(s.agi),
    will:effectiveStat(s.will),
    virtue:effectiveStat(gameData.hero.virtue||0)
  };
}
function makeHeroBattleStats(){
  const e=normalizeHeroStats(),lv=Number(gameData.hero.level)||1;
  const maxHp=Math.round(100+lv*10+e.will*3+e.str);
  const maxEnergy=Math.round(50+e.int*.5+e.will*.3);
  return {
    side:'hero',name:gameData.hero.name,
    ...e,
    maxHp,maxEnergy,
    attack:10+e.str*1.25,
    magicAttack:8+e.int*1.25,
    defense:10+e.will*.8,
    speed:e.agi,
    crit:clampBattle(.05+.25*(e.agi/(e.agi+100)),.05,.30),
    evade:clampBattle(.02+.20*(e.agi/(e.agi+100)),.02,.22),
    parry:clampBattle(.03+.08*(e.will/(e.will+100)),.03,.11),
    block:clampBattle(.05+.14*(e.will/(e.will+100)),.05,.19),
    statusRes:clampBattle(.05+.25*(e.will/(e.will+100)),.05,.30),
    elementalBaseRes:clampBattle(.15*(e.will/(e.will+100)),0,.15),
    resist:{fire:0,ice:0,lightning:0,wind:0,poison:0,curse:0},
    statuses:[],guarding:false
  };
}
function deriveEnemyStats(power,name='怪物',eventType='daily'){
  const boss=eventType==='midterm'||eventType==='final';
  const rawBase=Math.max(8,Number(power||70)/5);
  const variance=(label)=>{
    if(name.includes('史萊姆'))return label==='will'?.85:label==='agi'?.8:1;
    if(name.includes('哥布林'))return label==='agi'?1.25:label==='will'?.8:1;
    if(name.includes('獸人'))return label==='str'?1.3:label==='agi'?.8:1;
    if(name.includes('骷髏'))return label==='int'?1.25:label==='str'?.85:1;
    if(name.includes('騎士'))return label==='will'?1.3:label==='agi'?.8:1;
    return 1;
  };
  const e={
    str:effectiveStat(rawBase*variance('str')),
    int:effectiveStat(rawBase*.9*variance('int')),
    agi:effectiveStat(rawBase*.9*variance('agi')),
    will:effectiveStat(rawBase*variance('will')),
    virtue:0
  };
  const maxHp=Math.round((boss?150:80)+(boss?5.2:3.2)*e.will+1.0*e.str);
  const maxEnergy=Math.round(45+e.int*.45+e.will*.25);
  const resist={fire:0,ice:0,lightning:0,wind:0,poison:0,curse:0};
  if(name.includes('史萊姆')){resist.fire=-.15;resist.ice=.10;}
  if(name.includes('獸人')){resist.fire=.15;resist.ice=-.20;}
  if(name.includes('骷髏')){resist.poison=.85;resist.curse=.25;resist.fire=-.10;}
  if(name.includes('騎士')){resist.fire=.10;resist.ice=.10;resist.lightning=.10;resist.wind=.10;}
  return {
    side:'enemy',name,...e,maxHp,maxEnergy,
    attack:9+e.str*1.15,
    magicAttack:7+e.int*1.15,
    defense:8+e.will*.75,
    speed:e.agi,
    crit:clampBattle(.04+.20*(e.agi/(e.agi+100)),.04,.24),
    evade:clampBattle(.02+.16*(e.agi/(e.agi+100)),.02,.18),
    parry:clampBattle(.02+.07*(e.will/(e.will+100)),.02,.09),
    block:clampBattle(.04+.12*(e.will/(e.will+100)),.04,.16),
    statusRes:clampBattle(.04+.22*(e.will/(e.will+100)),.04,.26),
    elementalBaseRes:clampBattle(.12*(e.will/(e.will+100)),0,.12),
    resist,statuses:[],guarding:false,boss
  };
}
function defenseReduction(def){
  return def/(def+100);
}
function totalElementRes(defender,type){
  const special=Number(defender.resist?.[type]||0);
  const base=type==='poison'||type==='curse'?0:(defender.elementalBaseRes||0);
  return clampBattle(base+special,-.50,.75);
}
function statusChance(base,defender,statusType){
  const special=Number(defender.resist?.[statusType]||0);
  return clampBattle(base*(1-(defender.statusRes||0))*(1-special),0,.95);
}
function addStatus(target,status){
  const existing=target.statuses.find(s=>s.type===status.type);
  if(existing){
    existing.turns=Math.max(existing.turns,status.turns);
    existing.power=Math.max(existing.power||0,status.power||0);
  }else target.statuses.push({...status});
}
function statusLabel(s){
  if(s.effectType==='buff')return '🔵 '+(s.name||'強化');
  if(s.effectType==='debuff')return '🟣 '+(s.name||'弱化');
  return {poison:'☠️ 中毒',burn:'🔥 燃燒',bleed:'🩸 流血',curse:'🌀 詛咒',
    paralysis:'⚡ 麻痺',freeze:'❄️ 冰凍',stun:'😵 暈眩'}[s.type]||s.type;
}
function effectMod(unit,key){return (unit.statuses||[]).reduce((a,s)=>a+Number(s.mods?.[key]||0),0);}
function effectiveBattleValue(unit,key){return Math.max(0,Number(unit[key]||0)+effectMod(unit,key));}
function addTimedEffect(target,effect){target.statuses.push({type:'effect_'+Date.now()+'_'+Math.random(),name:effect.name||'效果',effectType:effect.effectType||'buff',turns:Number(effect.turns)||1,mods:{...(effect.mods||{})}});}
function updateBattleStatuses(){
  if(!battleStateV10)return;
  const paint=(side,unit)=>{
    const el=document.getElementById('battleStatus_'+side);
    if(el)el.innerHTML=unit.statuses.map(s=>`<span class="status-token ${s.effectType==='buff'?'effect-buff':s.effectType==='debuff'?'effect-debuff':''}">${statusLabel(s)} ${s.turns}</span>`).join('');
  };
  paint('hero',battleStateV10.hero);
  paint('enemy',battleStateV10.enemy);
}
function updateBattleResource(side,val,max){
  const pct=Math.max(0,Math.round(val/max*100));
  const fill=document.getElementById('battleEnergy_'+side);
  const txt=document.getElementById('battleEnergyText_'+side);
  if(fill)fill.style.width=pct+'%';
  if(txt)txt.textContent=`⚡ ${Math.max(0,Math.round(val))} / ${max}`;
}
function hpClassBattle(pct){return pct<=25?'critical':pct<=50?'low':'';}
function updateBattleHp(side,hp,maxHp){
  const pct=Math.max(0,Math.round(hp/maxHp*100));
  const fill=document.getElementById('battleHp_'+side);
  const txt=document.getElementById('battleHpText_'+side);
  if(fill){fill.style.width=pct+'%';fill.className='hp-fill '+hpClassBattle(pct);}
  if(txt)txt.textContent=`❤️ ${Math.max(0,Math.round(hp))} / ${maxHp}`;
}
function addBattleLog(msg){
  const log=document.getElementById('battleLog');if(!log)return;
  const d=document.createElement('div');d.textContent=msg;log.appendChild(d);
  log.scrollTop=log.scrollHeight;

function showBattleWord(text,extraClass=''){

function showDamage(side,text,extraClass=''){

  e.textContent=text;arena.appendChild(e);setTimeout(()=>e.remove(),820);

async function animateBattleAction(attackerSide,result){
  const attacker=document.getElementById('battleChar_'+attackerSide);
  const defenderSide=attackerSide==='hero'?'enemy':'hero';
  const defender=document.getElementById('battleChar_'+defenderSide);
  attacker?.classList.add('attack');await battleSleep(150);attacker?.classList.remove('attack');
  if(result.type==='miss')showBattleWord('MISS!');
  else if(result.type==='dodge'){defender?.classList.add('dodge');showBattleWord('💨 閃避！');}
  else if(result.type==='parry'){defender?.classList.add('parry');showBattleWord('⚔️ 招架！');}
  else if(result.type==='block'){defender?.classList.add('block');showBattleWord('🛡️ 格擋！');showDamage(defenderSide,'-'+result.damage);}
  else{
    defender?.classList.add('hurt');
    if(result.crit)showBattleWord('💥 致命一擊！');
    if(result.weak)showBattleWord('WEAK!','weak-float');
    showDamage(defenderSide,'-'+result.damage,result.crit?'crit-float':result.damageType==='holy'?'holy-float':'');
  }
  await battleSleep(260);
  defender?.classList.remove('dodge','parry','block','hurt','guard','status-hit');
}
function resolveAttack(attacker,defender,action={type:'physical',multiplier:1}){
  const damageType=action.type||'physical';
  const isPhysical=damageType==='physical';
  const canDodge=action.canDodge!==false;
  const hit=clampBattle(BATTLE_CONFIG.baseHit+(attacker.speed-defender.speed)*.001,.82,.99);
  if(Math.random()>hit)return {type:'miss',damage:0,damageType};
  if(canDodge && Math.random()<effectiveBattleValue(defender,'evade'))return {type:'dodge',damage:0,damageType};
  if(isPhysical && action.canParry!==false && Math.random()<effectiveBattleValue(defender,'parry'))return {type:'parry',damage:0,damageType};

  const crit=Math.random()<effectiveBattleValue(attacker,'crit');
  const variance=.90+Math.random()*.20;
  let raw=(isPhysical?effectiveBattleValue(attacker,'attack'):effectiveBattleValue(attacker,'magicAttack'))*(action.multiplier||1)*variance;
  let weak=false,resisted=false;

  if(damageType==='holy'){
    // 神聖傷害：不吃 DEF / 元素抗性
  }else if(isPhysical){
    raw*=1-defenseReduction(effectiveBattleValue(defender,'defense'));
  }else{
    const res=totalElementRes(defender,damageType);
    raw*=1-res;
    weak=res<-.05;resisted=res>.10;
  }

  raw*=Math.max(.10,1+effectMod(defender,'damageTaken'));
  let blocked=false;
  if(isPhysical && action.canBlock!==false && Math.random()<effectiveBattleValue(defender,'block')){
    raw*=BATTLE_CONFIG.blockReduction;blocked=true;
  }
  if(crit)raw*=BATTLE_CONFIG.critDamage;

  const damage=Math.max(1,Math.round(raw));
  return {type:blocked?'block':'hit',damage,damageType,crit,weak,resisted};
}
function getUnitHp(side){return side==='hero'?battleStateV10.heroHp:battleStateV10.enemyHp;}
function setUnitHp(side,val){
  if(side==='hero')battleStateV10.heroHp=Math.max(0,val);
  else battleStateV10.enemyHp=Math.max(0,val);
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  updateBattleHp(side,getUnitHp(side),unit.maxHp);
}
function getUnitEnergy(side){return side==='hero'?battleStateV10.heroEnergy:battleStateV10.enemyEnergy;}
function setUnitEnergy(side,val){
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  val=clampBattle(val,0,unit.maxEnergy);
  if(side==='hero')battleStateV10.heroEnergy=val;else battleStateV10.enemyEnergy=val;
  updateBattleResource(side,val,unit.maxEnergy);
}
async function processStatusTick(side){
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  let hp=getUnitHp(side),skip=false;
  for(const s of [...unit.statuses]){
    if(s.type==='poison'){
      const dmg=Math.max(1,Math.round(s.power||6));hp-=dmg;
      addBattleLog(`☠️ ${unit.name}受到 ${dmg} 點毒素傷害。`);showDamage(side,'-'+dmg);
    }else if(s.type==='burn'){
      const dmg=Math.max(1,Math.round(s.power||5));hp-=dmg;
      addBattleLog(`🔥 ${unit.name}受到 ${dmg} 點燃燒傷害。`);showDamage(side,'-'+dmg);
    }else if(s.type==='bleed'){
      const dmg=Math.max(1,Math.round(s.power||5));hp-=dmg;
      addBattleLog(`🩸 ${unit.name}流血，受到 ${dmg} 點傷害。`);showDamage(side,'-'+dmg);
    }else if(s.type==='curse' && s.mode==='delayed'){
      s.countdown=(s.countdown??s.turns)-1;
      if(s.countdown<=0){
        const dmg=Math.max(1,Math.round(s.power||25));hp-=dmg;
        addBattleLog(`💀 死亡印記爆發！${unit.name}受到 ${dmg} 點詛咒傷害！`);
        showDamage(side,'-'+dmg,'holy-float');s.turns=0;
      }else addBattleLog(`🌀 ${unit.name}的死亡印記：${s.countdown}`);
    }else if(['stun','freeze'].includes(s.type)){
      if(Math.random()<.85){skip=true;addBattleLog(`${statusLabel(s)}！${unit.name}無法行動。`);}
    }else if(s.type==='paralysis'){
      if(Math.random()<.35){skip=true;addBattleLog(`⚡ 麻痺發作！${unit.name}無法行動。`);}
    }
    s.turns--;
  }
  unit.statuses=unit.statuses.filter(s=>s.turns>0);
  setUnitHp(side,hp);updateBattleStatuses();
  await battleSleep(250);
  return skip;
}
function maybeApplyEnemyStatus(attacker,defender,result){
  if(result.damage<=0)return;
  const name=attacker.name||'';
  if(name.includes('骷髏法師') && Math.random()<statusChance(.28,defender,'curse')){
    addStatus(defender,{type:'curse',mode:'delayed',turns:4,countdown:3,power:Math.max(18,attacker.magicAttack*.8)});
    addBattleLog(`🌀 ${defender.name}中了「死亡印記」！`);
  }else if((name.includes('魔獸')||name.includes('暗影豹')) && Math.random()<statusChance(.22,defender,'poison')){
    addStatus(defender,{type:'poison',turns:3,power:Math.max(4,attacker.attack*.15)});
    addBattleLog(`☠️ ${defender.name}中毒了！`);
  }
}
function actionSummary(result,targetName){
  if(result.type==='miss')return '💨 攻擊落空！';
  if(result.type==='dodge')return `💨 ${targetName}閃避成功！`;
  if(result.type==='parry')return `⚔️ ${targetName}招架成功！`;
  if(result.type==='block')return `🛡️ ${targetName}格擋，只受到 ${result.damage} 點傷害。`;
  let tags='';
  if(result.crit)tags+='💥 致命一擊！';
  if(result.weak)tags+=' WEAK！';
  if(result.resisted)tags+=' 抵抗！';
  return `${tags} ${targetName}受到 ${result.damage} 點傷害！`;
}
async function executeAttack(attackerSide,action){
  const defenderSide=attackerSide==='hero'?'enemy':'hero';
  const attacker=attackerSide==='hero'?battleStateV10.hero:battleStateV10.enemy;
  const defender=defenderSide==='hero'?battleStateV10.hero:battleStateV10.enemy;
  const result=resolveAttack(attacker,defender,action);
  await animateBattleAction(attackerSide,result);
  if(result.damage)setUnitHp(defenderSide,getUnitHp(defenderSide)-result.damage);
  addBattleLog(actionSummary(result,defender.name));
  if(attackerSide==='enemy')maybeApplyEnemyStatus(attacker,defender,result);
  updateBattleStatuses();
  return result;
}
function enemyChooseAction(){
  const e=battleStateV10.enemy;
  const energy=battleStateV10.enemyEnergy;
  if(energy>=30 && e.int>e.str*.9 && Math.random()<.35){
    return {kind:'skill',name:'暗影彈',cost:30,type:'wind',multiplier:1.15};
  }
  if(getUnitHp('enemy')/e.maxHp<.35 && Math.random()<.22)return {kind:'defend',name:'防禦'};
  return {kind:'attack',name:'攻擊',type:'physical',multiplier:1};
}
function applyEnergyForAction(side,action){
  let energy=getUnitEnergy(side);
  if(action.kind==='attack')energy+=10;
  if(action.kind==='defend')energy+=20;
  if(action.kind==='skill')energy-=Number(action.cost)||0;
  setUnitEnergy(side,energy);
}
async function performAction(side,action){
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  unit.guarding=false;
  if(action.kind==='defend'){
    unit.guarding=true;
    document.getElementById('battleChar_'+side)?.classList.add('guard');
    addBattleLog(`🛡️ ${unit.name}採取防禦姿態！本回合傷害降低。`);
    applyEnergyForAction(side,action);await battleSleep(300);return;
  }
  if(action.kind==='skill'){
    if(getUnitEnergy(side)<action.cost){addBattleLog(`⚡ ${unit.name}能量不足！`);return;}
    addBattleLog(`${action.icon||'✨'} ${unit.name}使用「${action.name}」！`);
    applyEnergyForAction(side,action);
    if(action.effect){
      addTimedEffect(unit,{...action.effect,name:action.name});
      addBattleLog(`${action.icon||'✨'} ${action.name}生效，持續 ${action.effect.turns} 回合。`);
      updateBattleStatuses();await battleSleep(300);return;
    }
    const res=await executeAttack(side,action);
    if(side==='hero' && action.id==='ember' && res.damage>0 && Math.random()<statusChance(.25,battleStateV10.enemy,'burn')){
      addStatus(battleStateV10.enemy,{type:'burn',turns:3,power:Math.max(4,battleStateV10.hero.magicAttack*.12)});
      addBattleLog(`🔥 ${battleStateV10.enemy.name}燃燒了！`);
    }
    return;
  }
  addBattleLog(`⚔️ ${unit.name}攻擊！`);
  applyEnergyForAction(side,action);
  await executeAttack(side,action);
}
function setBattleControls(enabled){
  document.querySelectorAll('.battle-action-btn,.battle-choice').forEach(b=>b.disabled=!enabled);
}
async function battlePlayerAction(action){
  if(!battleStateV10||battleStateV10.busy||battleStateV10.ended)return;
  if(action.kind==='skill' && battleStateV10.heroEnergy<action.cost){
    addBattleLog('⚡ 能量不足！');return;
  }
  battleStateV10.busy=true;setBattleControls(false);hideBattleSubmenu();
  battleStateV10.round++;
  const banner=document.getElementById('battleRoundBanner');
  if(banner)banner.textContent=`ROUND ${battleStateV10.round}`;

  // 每回合先處理雙方異常狀態
  const heroSkip=await processStatusTick('hero');
  if(await checkBattleEnd())return;
  const enemySkip=await processStatusTick('enemy');
  if(await checkBattleEnd())return;

  const enemyAction=enemyChooseAction();
  const order=(battleStateV10.hero.speed>=battleStateV10.enemy.speed)
    ?[['hero',action,heroSkip],['enemy',enemyAction,enemySkip]]
    :[['enemy',enemyAction,enemySkip],['hero',action,heroSkip]];

  for(const [side,act,skip] of order){
    if(skip)continue;
    await performAction(side,act);
    if(await checkBattleEnd())return;
    await battleSleep(BATTLE_CONFIG.delay);
  }
  battleStateV10.hero.guarding=false;battleStateV10.enemy.guarding=false;
  battleStateV10.busy=false;setBattleControls(true);
}

async function battleUsePoison(){
  if(!battleStateV10||battleStateV10.busy)return;
  battleStateV10.busy=true;setBattleControls(false);hideBattleSubmenu();
  battleStateV10.round++;
  const chance=statusChance(.75,battleStateV10.enemy,'poison');
  if(Math.random()<chance){
    addStatus(battleStateV10.enemy,{type:'poison',turns:3,power:Math.max(5,battleStateV10.hero.int*.12)});
    addBattleLog(`🧪 毒藥生效！${battleStateV10.enemy.name}中毒了。`);
  }else addBattleLog(`🧪 ${battleStateV10.enemy.name}抵抗了毒藥！`);
  updateBattleStatuses();
  await battleSleep(300);
  const enemySkip=await processStatusTick('enemy');
  if(await checkBattleEnd())return;
  if(!enemySkip)await performAction('enemy',enemyChooseAction());
  if(await checkBattleEnd())return;
  battleStateV10.busy=false;setBattleControls(true);
}
function createBattleOverlay(enemyName,enemyIcon,heroStats,enemyStats){

async function checkBattleEnd(){
  if(!battleStateV10)return false;
  const heroDead=battleStateV10.heroHp<=0,enemyDead=battleStateV10.enemyHp<=0;
  if(!heroDead&&!enemyDead&&battleStateV10.round<BATTLE_CONFIG.maxRounds)return false;
  battleStateV10.ended=true;battleStateV10.busy=true;setBattleControls(false);
  const win=enemyDead&&!heroDead;
  await finishBattleV10(win);
  return true;
}
async function finishBattleV10(win){
  const s=battleStateV10;
  const rating=calculateBattleRating(win,s.heroHp,s.hero.maxHp,s.round);
  let drop=null;
  if(win){gameData.hero.gold+=s.baseGold;addExp(s.baseExp);drop=rollDungeonDrop(rating);}
  if(s.eventType==='midterm')setWorldAfterMidterm(win);
  gameData.dailyDungeon.challenged=true;
  gameData.dailyDungeon.result=win?'win':'lose';
  gameData.dailyDungeon.drop=drop;
  gameData.battleRecords.push({
    id:uid(),date:today(),enemyName:s.enemyName,power:combatPower(),enemyPower:s.enemyPower,
    result:win?'win':'lose',eventType:s.eventType,drop,rounds:s.round,rating,
    battleV10:{heroHp:Math.max(0,s.heroHp),heroMaxHp:s.hero.maxHp,enemyHp:Math.max(0,s.enemyHp),enemyMaxHp:s.enemy.maxHp}
  });
  saveGame();showBattleWord(win?'🏆 勝利！':'💀 戰敗');
  document.getElementById('battleActions').style.display='none';
  document.getElementById('battleSubmenu').style.display='none';
  document.getElementById('battleResult').innerHTML=`<div class="battle-result">
    <div class="battle-result-icon">${win?'🏆':'💀'}</div>
    <h2>${win?'勝利！':'戰敗！'}</h2>
    ${win?`<div class="rating-stars">${'⭐'.repeat(rating)}</div>
      <div>${rating===3?'完美勝利':rating===2?'漂亮勝利':'苦戰勝利'}</div>
      <div>⭐ EXP +${s.baseExp}　💰 +${s.baseGold} G</div>
      <div style="margin-top:8px">🎁 ${drop?.label||'沒有額外掉落'}</div>`
      :`<div class="small">💀 戰敗：沒有掉落，但不扣 EXP、金幣或能力值。</div>`}
    <button class="btn ${win?'gold':'gray'} battle-close" onclick="closeBattleOverlay()">返回副本</button>
  </div>`;
}
function runBattleSequence(enemyName,enemyIcon,enemyPower,baseGold,baseExp,eventType){
  const hero=makeHeroBattleStats(),enemy=deriveEnemyStats(enemyPower,enemyName,eventType);
  battleStateV10={
    hero,enemy,enemyName,enemyPower,baseGold,baseExp,eventType,
    heroHp:hero.maxHp,enemyHp:enemy.maxHp,
    heroEnergy:Math.round(hero.maxEnergy*.50),
    enemyEnergy:Math.round(enemy.maxEnergy*.50),
    round:0,busy:false,ended:false
  };
  createBattleOverlay(enemyName,enemyIcon,hero,enemy);
  updateBattleHp('hero',battleStateV10.heroHp,hero.maxHp);
  updateBattleHp('enemy',battleStateV10.enemyHp,enemy.maxHp);
  updateBattleResource('hero',battleStateV10.heroEnergy,hero.maxEnergy);
  updateBattleResource('enemy',battleStateV10.enemyEnergy,enemy.maxEnergy);
  updateBattleStatuses();
  const battleState=actualVsExpectedStatus(enemyPower);
  addBattleLog(`${battleState.label}｜你的戰力 ${combatPower()} / 怪物 ${enemyPower}`);
  addBattleLog(`⚡ 速度：${Math.round(hero.speed)} vs ${Math.round(enemy.speed)}｜較快者本回合先行動。`);
}
function closeBattleOverlay(){
  battleStateV10=null;

function battleIconForEnemy(evt,monster){
  if(evt?.type==='final')return '🐉';
  if(evt?.type==='midterm')return '👿';
  const n=(monster?.name||'').toLowerCase();
  if(n.includes('史萊姆'))return '🟢';
  if(n.includes('哥布林'))return '👺';
  if(n.includes('獸人'))return '👹';
  if(n.includes('骷髏'))return '💀';
  if(n.includes('狼')||n.includes('魔獸')||n.includes('豹'))return '🐺';
  if(n.includes('騎士'))return '🛡️';
  return '👹';
}

function challengeDungeon(){
  try{
    ensureDailyDungeon();
    if(gameData.dailyDungeon.challenged){alert('今天已挑戰過副本');return;}
    const evt=gameData.dailyDungeon.eventId?gameData.events.find(e=>e.id===gameData.dailyDungeon.eventId):null;
    const monster=evt?null:(gameData.dailyDungeon.monsterId==='AUTO'
      ?{name:gameData.dailyDungeon.generatedName||generatedMonsterName(),difficulty:'normal',rewardGold:15,rewardExp:15}
      :gameData.monsters.find(x=>x.id===gameData.dailyDungeon.monsterId));
    const enemyPower=resolvedDungeonPower(evt,monster);
    const enemyName=evt?evt.name:monster?.name;
    if(!enemyName){alert('今天沒有敵人');return;}
    const baseGold=evt?Number(evt.rewardGold||0):Number(monster?.rewardGold||0);
    const baseExp=evt?Number(evt.rewardExp||0):Number(monster?.rewardExp||0);
    runBattleSequence(enemyName,battleIconForEnemy(evt,monster),enemyPower,baseGold,baseExp,evt?.type||'daily');
  }catch(err){
    console.error('challengeDungeon failed:',err);
    alert('戰鬥啟動失敗：'+(err?.message||err));
  }
}
function drawLottery(){
  if(gameData.hero.lotteryCoins<1){alert('沒有抽獎金幣');return;}
  const item=weightedPick(gameData.lotteryPool);
  if(!item){alert('抽獎池尚未設定');return;}
  gameData.hero.lotteryCoins--;

  let result='';
  if(item.type==='gold'){
    const amount=Number(item.value)||0;
    gameData.hero.gold+=amount;
    result=item.label;
  }else if(item.type==='shop'){
    const available=gameData.shopItems.filter(x=>x.active);
    if(available.length){
      const shop=available[Math.floor(Math.random()*available.length)];
      gameData.inventory.push({id:uid(),itemId:shop.id,name:shop.name,status:'unused',boughtDate:today(),source:'lottery'});
      result=shop.name;
    }else{
      gameData.hero.gold+=50;
      result='商店沒有商品，改獲得金幣 +50 G';
    }
  }
  saveGame();renderAll();
  alert('🎰 抽獎結果：'+result);
}
function exportLearningCSV(){

  gameData.learningProgress.forEach(r=>rows.push([r.date,r.subject,r.item,r.progress]));
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const csv='\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`學習進度_${today()}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
}

function saveCloudConfig(){
  const c=gameData.settings.cloud||{};
  c.apiKey=document.getElementById('fbApiKey').value.trim();
  c.authDomain=document.getElementById('fbAuthDomain').value.trim();
  c.projectId=document.getElementById('fbProjectId').value.trim();
  c.storageBucket=document.getElementById('fbStorageBucket').value.trim();
  c.messagingSenderId=document.getElementById('fbSenderId').value.trim();
  c.appId=document.getElementById('fbAppId').value.trim();
  c.email=document.getElementById('fbEmail').value.trim();
  c.enabled=!!(c.apiKey&&c.authDomain&&c.projectId&&c.appId);
  familyData.profiles.forEach(p=>{if(!p.data.settings)p.data.settings={parentPinHash:'',cloud:{}};p.data.settings.cloud={...c};});
  gameData.settings.cloud=c;saveGame();alert('雲端設定已儲存');renderGM();
}

function gmAddTask(){
  const name=document.getElementById('gmTaskName').value.trim();
  if(!name){alert('請輸入任務名稱');return;}
  const taskType=document.getElementById('gmTaskType').value;
  const rewardMode=document.getElementById('gmRewardMode')?.value||'auto';
  const category=document.getElementById('gmTaskCategory')?.value||'study';
  const difficulty=document.getElementById('gmTaskDifficulty')?.value||'normal';
  let rules=[];
  if(taskType==='timer'&&rewardMode==='manual'){
    rules=[
      {maxMinutes:Number(document.getElementById('gmRule1Min').value),stat:document.getElementById('gmRule1Stat').value,value:Number(document.getElementById('gmRule1Val').value)},
      {maxMinutes:Number(document.getElementById('gmRule2Min').value),stat:document.getElementById('gmRule2Stat').value,value:Number(document.getElementById('gmRule2Val').value)}
    ].filter(r=>r.maxMinutes>0&&r.value!==0);
  }
  const task={
    id:uid(),name,taskType,rewardMode,category,difficulty,
    description:document.getElementById('gmTaskDesc').value.trim(),
    subject:document.getElementById('gmSubject').value.trim(),
    progressType:document.getElementById('gmProgressType').value.trim(),
    progressValue:document.getElementById('gmProgressValue').value.trim(),
    goldReward:Number(document.getElementById('gmTaskGold').value)||0,
    expReward:Number(document.getElementById('gmTaskExp').value)||0,
    dailyLimit:Math.max(1,Number(document.getElementById('gmTaskLimit').value)||1),
    active:true,
    createdDate:today(),activeFrom:today(),activeUntil:'',
    countForBossOnNonSchoolDay:document.getElementById('gmBossNonSchool')?.checked||false,
    weekdays:[...document.querySelectorAll('.gmWeekday:checked')].map(x=>Number(x.value)),statRules:rules,
    fixedStat:document.getElementById('gmFixedStat')?.value||'will',
    fixedStatValue:rewardMode==='manual'?(Number(document.getElementById('gmFixedStatValue')?.value)||0):0,
    fastMinutes:Number(document.getElementById('gmRule1Min')?.value)||30,
    standardMinutes:Number(document.getElementById('gmRule2Min')?.value)||60,
    quantityTarget:Math.max(1,Number(document.getElementById('gmQuantityTarget')?.value)||1),
    quantityUnit:(document.getElementById('gmQuantityUnit')?.value||'次').trim()
  };
  if(rewardMode==='manual'){
    const previewStat=taskType==='timer'?Math.max(0,...rules.map(r=>Number(r.value)||0)):task.fixedStatValue;
    const br=taskBalanceReport(task.expReward,task.goldReward,previewStat);
    if(br.worst.cls==='balance-bad'&&!confirm('🔴 這組手動獎勵可能破壞數值平衡。仍要建立嗎？'))return;
  }
  gameData.tasks.push(task);
  if(document.getElementById('gmAssignAll')?.checked){
    persistFamily();
    familyData.profiles.forEach(p=>{
      if(p.id===activeProfileId)return;
      migrateProfileData(p.data);
      p.data.tasks.push({...JSON.parse(JSON.stringify(task)),id:uid()});
    });
  }
  saveGame();renderAll();
}

  saveGame();renderAll();renderGM();alert('已重置今日副本挑戰，可以再次測試。');
}
function pct(v){return (Number(v||0)*100).toFixed(1)+'%';}
function battleDebugCard(title,u){return `<div class="battle-debug-card"><b>${title}</b><br>HP ${u.maxHp}　Energy ${u.maxEnergy}<br>ATK ${u.attack.toFixed(1)}　MATK ${u.magicAttack.toFixed(1)}<br>DEF ${u.defense.toFixed(1)}　SPD ${u.speed.toFixed(1)}<br>CRIT ${pct(u.crit)}　EVA ${pct(u.evade)}<br>PARRY ${pct(u.parry)}　BLOCK ${pct(u.block)}<br>Status RES ${pct(u.statusRes)}　Base Element RES ${pct(u.elementalBaseRes)}<br>🔥 ${pct(totalElementRes(u,'fire'))}　❄️ ${pct(totalElementRes(u,'ice'))}　⚡ ${pct(totalElementRes(u,'lightning'))}　🌪️ ${pct(totalElementRes(u,'wind'))}<br>☠️毒特殊抗性 ${pct(u.resist?.poison||0)}　🌀詛咒特殊抗性 ${pct(u.resist?.curse||0)}</div>`;}
function gmShowBattleDebug(){
  ensureDailyDungeon();
  const evt=gameData.dailyDungeon.eventId?gameData.events.find(e=>e.id===gameData.dailyDungeon.eventId):null;
  const monster=evt?null:(gameData.dailyDungeon.monsterId==='AUTO'?{name:gameData.dailyDungeon.generatedName||generatedMonsterName(),difficulty:'normal'}:gameData.monsters.find(x=>x.id===gameData.dailyDungeon.monsterId));
  const name=evt?evt.name:(monster?.name||'怪物'),power=resolvedDungeonPower(evt,monster);
  const h=makeHeroBattleStats(),e=deriveEnemyStats(power,name,evt?.type||'daily'),box=document.getElementById('gmBattleDebug');
  if(box)box.innerHTML=`<div class="battle-debug-grid">${battleDebugCard('🧒 '+gameData.hero.name,h)}${battleDebugCard('👹 '+name,e)}</div>`;
}

function gmAddMonster(){
  const name=document.getElementById('gmMonName').value.trim();
  if(!name){alert('請輸入怪物名稱');return;}
  gameData.monsters.push({
    id:uid(),name,power:Number(document.getElementById('gmMonPower').value)||1,
    rewardGold:Number(document.getElementById('gmMonGold').value)||0,
    rewardExp:Number(document.getElementById('gmMonExp').value)||0,active:true
  });
  saveGame();renderAll();
}
function gmAddEvent(){
  const date=document.getElementById('gmEventDate').value;
  const type=document.getElementById('gmEventType').value;
  let name=document.getElementById('gmEventName').value.trim();
  if(!date){alert('請選日期');return;}
  if(!name)name=type==='final'?'學期終焉之龍':'期中大魔王';
  gameData.events.push({
    id:uid(),date,type,name,
    power:Number(document.getElementById('gmEventPower').value)||100,
    rewardGold:Number(document.getElementById('gmEventGold').value)||0,
    rewardExp:Number(document.getElementById('gmEventExp').value)||0,
    active:true
  });
  if(date===today())gameData.dailyDungeon={date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''};
  saveGame();renderAll();
}
function deleteEvent(id){
  if(confirm('刪除此考試事件？')){
    gameData.events=gameData.events.filter(x=>x.id!==id);
    if(gameData.dailyDungeon.eventId===id)gameData.dailyDungeon={date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''};
    saveGame();renderAll();
  }
}
function gmAddGold(n){gameData.hero.gold+=n;saveGame();renderAll();}
function gmAddLotteryCoin(n){gameData.hero.lotteryCoins+=n;saveGame();renderAll();}
function resetAll(){
  if(confirm('確定清除全部資料？此動作無法復原。')){
    localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(FAMILY_KEY);sessionStorage.removeItem('activeHeroProfile');location.reload();
  }
}
function renderAll(){renderHero();renderTasks();renderDungeon();renderShop();renderLottery();renderBag();renderGM();startLiveTimer();startStatusClock();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTasks();startLiveTimer();}});
function boot(){
  if(!gameData.hero.name){
    document.getElementById('heroSetup').style.display='block';
    document.getElementById('mainUI').style.display='none';
  }else{
    document.getElementById('heroSetup').style.display='none';
    document.getElementById('mainUI').style.display='block';
    ensureDailyDungeon();renderAll();setTimeout(()=>{refreshAutoRewardPreview();toggleRewardMode();},0);
  }
}
boot();
</script>

<script type="module">
let fb=null,auth=null,db=null,currentUser=null,saving=false;

async function initFirebase(){
  const c=gameData.settings?.cloud;
  if(!c?.enabled)return false;
  try{
    const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const fsMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    fb={appMod,authMod,fsMod};
    const app=appMod.initializeApp({
      apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,
      storageBucket:c.storageBucket,messagingSenderId:c.messagingSenderId,appId:c.appId
    });
    auth=authMod.getAuth(app); db=fsMod.getFirestore(app);
    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      if(user){
        const s=document.getElementById('cloudStatus');
        if(s)s.textContent='☁️ 已登入：'+user.email;
        await pullCloud();
      }
    });
    return true;
  }catch(e){console.error(e);alert('Firebase 初始化失敗：'+e.message);return false;}
}
async function pullCloud(){
  if(!currentUser||!db)return;
  const {doc,getDoc}=fb.fsMod;
  const ref=doc(db,'users',currentUser.uid,'game','main');
  const snap=await getDoc(ref);
  if(snap.exists()){
    const payload=snap.data();
    const localCfg=gameData.settings?.cloud;
    if(payload?.familyData?.profiles?.length){
      familyData=payload.familyData;
      activeProfileId=familyData.profiles.some(p=>p.id===activeProfileId)?activeProfileId:(familyData.activeProfileId||familyData.profiles[0].id);
      gameData=getActiveProfile().data;migrateProfileData(gameData);
    }else if(payload?.gameData){
      gameData=payload.gameData;migrateProfileData(gameData);
      familyData={version:8,activeProfileId:'hero_1',profiles:[{id:'hero_1',label:gameData.hero.name||'勇者 1',data:gameData}]};
      activeProfileId='hero_1';
    }
    if(payload?.familyData||payload?.gameData){
      if(!gameData.settings)gameData.settings={parentPinHash:'',cloud:{}};
      gameData.settings.cloud=localCfg||gameData.settings.cloud||{};
      persistFamily();boot();
    }
  }else await pushCloud();
}
async function pushCloud(){
  if(!currentUser||!db||saving)return;
  saving=true;
  try{
    const {doc,setDoc,serverTimestamp}=fb.fsMod;
    persistFamily();
    const clone=JSON.parse(JSON.stringify(familyData));
    await setDoc(doc(db,'users',currentUser.uid,'game','main'),{familyData:clone,updatedAt:serverTimestamp()},{merge:true});
  }catch(e){console.error(e);}
  finally{saving=false;}
}
window.cloudSaveGame=()=>{if(currentUser)pushCloud();};
window.firebaseLogin=async()=>{
  if(!fb){const ok=await initFirebase();if(!ok)return;}
  const email=document.getElementById('fbEmail')?.value.trim()||gameData.settings.cloud.email;
  const password=document.getElementById('fbPassword')?.value||'';
  if(!email||!password){alert('請輸入 Firebase Email 與密碼');return;}
  try{
    await fb.authMod.signInWithEmailAndPassword(auth,email,password);
    gameData.settings.cloud.email=email;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(gameData));
    alert('雲端登入成功');
  }catch(e){alert('登入失敗：'+e.message);}
};
if(gameData.settings?.cloud?.enabled)initFirebase();
</script>
