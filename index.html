<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小學勇者大冒險 V10.10.23</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--card:#21262d;--border:#30363d;
  --gold:#f0883e;--blue:#58a6ff;--green:#3fb950;--purple:#bc8cff;
  --pink:#ff7b72;--text:#c9d1d9;--bright:#f0f6fc;--muted:#8b949e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;padding:12px}
.app{max-width:920px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 10px 32px #0008}
h1,h2,h3{color:var(--gold);margin:8px 0 14px}
h1{text-align:center;font-size:24px}
h2{font-size:18px}
h3{font-size:15px}
.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 18px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 6px;border-radius:8px;font-weight:700;cursor:pointer}
.tab.active{background:var(--gold);color:#111}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0d1117;border-left:4px solid var(--blue);padding:9px;border-radius:7px}
button{border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn{background:#238636;color:#fff}.btn.blue{background:#1f6feb}.btn.red{background:#da3633}.btn.gray{background:#30363d;color:#fff}.btn.gold{background:var(--gold);color:#111}.btn.purple{background:#8957e5;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:#0d1117;color:var(--bright);border:1px solid var(--border);border-radius:7px;padding:10px;margin:5px 0 10px}
label{font-size:12px;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:var(--muted)}
.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--pink)}.purple{color:var(--purple)}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#0d1117;border:1px solid var(--border);font-size:11px;margin:2px}
.progress{height:10px;background:#0d1117;border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.progress>div{height:100%;background:var(--green)}
.boss{border:2px solid var(--pink);box-shadow:0 0 20px #ff7b7233}
.dragon{border:2px solid var(--purple);box-shadow:0 0 24px #bc8cff33}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

.hero-scene{
  position:relative;
  height:260px;
  overflow:hidden;
  border:2px solid #3d444d;
  border-radius:12px;
  background:#101826;
  image-rendering:pixelated;
}
.sky-layer{
  position:absolute;inset:0;
  background:
    linear-gradient(#20304a 0 48%,#354b3e 48% 65%,#253226 65% 100%);
}
.mountain-layer{
  position:absolute;left:0;right:0;bottom:74px;height:92px;
  opacity:.9;
  background:
    linear-gradient(135deg,transparent 0 34%,#314154 34% 51%,transparent 51% 100%) 0 0/180px 90px repeat-x,
    linear-gradient(45deg,transparent 0 35%,#263747 35% 53%,transparent 53% 100%) 80px 16px/220px 80px repeat-x;
  animation:scrollMountains 18s linear infinite;
}
.ground-layer{
  position:absolute;left:0;right:0;bottom:0;height:78px;
  background:
    repeating-linear-gradient(90deg,#24351f 0 18px,#2e4427 18px 34px,#20301d 34px 52px);
  border-top:6px solid #47663b;
  animation:scrollGround 2.6s linear infinite;
}
.pixel-cloud{
  position:absolute;width:84px;height:18px;background:#d8e5e8;opacity:.8;
  box-shadow:16px -10px 0 #d8e5e8,36px -5px 0 #d8e5e8;
  animation:cloudMove 24s linear infinite;
}
.pixel-cloud.c1{top:38px;left:-100px}
.pixel-cloud.c2{top:72px;left:-240px;animation-duration:31s;transform:scale(.7)}
@keyframes scrollMountains{from{background-position:0 0,80px 16px}to{background-position:-360px 0,-360px 16px}}
@keyframes scrollGround{from{background-position:0 0}to{background-position:-104px 0}}
@keyframes cloudMove{from{transform:translateX(0)}to{transform:translateX(1100px)}}
.warrior-wrap{
  position:absolute;left:50%;bottom:42px;transform:translateX(-50%);
  animation:warriorBob .58s steps(2,end) infinite;
  filter:drop-shadow(0 8px 0 rgba(0,0,0,.28));
}
@keyframes warriorBob{
  0%,100%{margin-bottom:0}
  50%{margin-bottom:5px}
}
.pixel-warrior{
  position:relative;width:96px;height:142px;
  image-rendering:pixelated;
}

.hero-sprite{
  display:block;
  width:160px;
  height:160px;
  object-fit:contain;
  image-rendering:pixelated;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
.px{position:absolute;background:#999}
.helm{left:30px;top:6px;width:42px;height:12px;background:#aeb6bf;box-shadow:6px -6px 0 #c6ced7,-6px 6px 0 #818b96,36px 8px 0 #707a86}
.face{left:34px;top:24px;width:34px;height:28px;background:#d8a16f;box-shadow:0 10px 0 #c98d5e}
.eye{left:56px;top:32px;width:6px;height:6px;background:#18202b}
.body{left:30px;top:54px;width:42px;height:48px;background:#596877;box-shadow:6px 8px 0 #6f7f90,-6px 8px 0 #445260}

.arm-l{left:18px;top:58px;width:12px;height:44px;background:#596877;transform:rotate(8deg)}

.hand-r{left:80px;top:94px;width:12px;height:12px;background:#d8a16f}
.leg-l{left:32px;top:102px;width:14px;height:34px;background:#303b48;transform:rotate(3deg)}
.leg-r{left:56px;top:102px;width:14px;height:34px;background:#303b48;transform:rotate(-3deg)}
.boot-l{left:26px;top:132px;width:24px;height:10px;background:#171d24}
.boot-r{left:54px;top:132px;width:24px;height:10px;background:#171d24}
.sword{left:4px;top:62px;width:8px;height:54px;background:#cdd8e2;transform:rotate(-16deg);box-shadow:0 -10px 0 #ecf4f8}
.guard{left:0;top:105px;width:24px;height:6px;background:#b88635;transform:rotate(-16deg)}
.scene-hud{

  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.hud-chip{

.xp-wrap{margin-top:10px}
.xp-label{display:flex;justify-content:space-between;font-size:12px;color:#d7dde5;margin-bottom:5px}

.vs-text{

.battle-message{

/* V6.1 正式草原橫向捲動背景 */
.adventure-stage{
  position:relative;
  overflow:hidden;
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScroll 30s linear infinite !important;
}
@keyframes grasslandScroll{
  from{background-position:0 center;}
  to{background-position:-1536px center;}
}


.scene{
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScroll 30s linear infinite !important;
}

.hero-scene{
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScroll 30s linear infinite !important;
}


/* V6.2 修正：舊 CSS 山景圖層會蓋住 PNG 背景，因此停用舊圖層 */
.hero-scene{
  background-image:url("images/grassland_bg.png") !important;
  background-repeat:repeat-x !important;
  background-size:auto 100% !important;
  background-position:0 center !important;
  animation:grasslandScrollV62 28s linear infinite !important;
}

/* 這四層原本是用 CSS 畫的天空、山、草地與雲，會整片蓋住新背景 */
.hero-scene > .sky-layer,
.hero-scene > .mountain-layer,
.hero-scene > .ground-layer,
.hero-scene > .pixel-cloud{
  display:none !important;
}

@keyframes grasslandScrollV62{
  from{background-position:0 center;}
  to{background-position:-2048px center;}
}

/* 圖片載入失敗時至少保留深色底，不會整塊透明 */
.hero-scene{
  background-color:#203b52;
}


/* V6.3：改用真正的 <img> 圖層，不再依賴 CSS background-image */
.hero-scene{
  background:#203b52 !important;
  animation:none !important;
}
.scene-bg-scroll{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
}
.scene-bg-track{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  display:flex;
  width:max-content;
  animation:sceneBgMove 24s linear infinite;
  will-change:transform;
}
.scene-bg-track img{
  display:block;
  height:100%;
  width:auto;
  max-width:none;
  flex:none;
  image-rendering:pixelated;
}
@keyframes sceneBgMove{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}
.hero-scene .scene-hud,
.hero-scene .warrior-wrap{
  z-index:2;
}
.hero-scene > .sky-layer,
.hero-scene > .mountain-layer,
.hero-scene > .ground-layer,
.hero-scene > .pixel-cloud{
  display:none !important;
}


/* V6.4：人物落地修正 */

  bottom:-28px !important;
}

.battle-overlay{position:fixed;inset:0;z-index:12000;background:rgba(4,8,14,.94);display:flex;align-items:center;justify-content:center;padding:12px}
.battle-window{width:min(900px,100%);max-height:96vh;overflow:auto;background:#10151c;border:3px solid #59616d;border-radius:14px;padding:12px}
.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.battle-unit{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px}
.battle-unit.enemy{text-align:right}.battle-name{font-weight:1000;font-size:17px;color:#f0f6fc;margin-bottom:5px}
.hp-bar{height:18px;border:2px solid #59616d;background:#0b0f14;border-radius:4px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(#45c968,#238636);transition:width .35s ease}
.hp-fill.low{background:linear-gradient(#ffb347,#d29922)}.hp-fill.critical{background:linear-gradient(#ff7b72,#da3633)}
.hp-text{margin-top:4px;font-size:12px;color:#8b949e}
.battle-arena{position:relative;height:300px;overflow:hidden;border:2px solid #30363d;border-radius:10px;background:#203b52}
.battle-bg{position:absolute;inset:0;background:url("images/grassland_bg.png?v=7") center/cover no-repeat;filter:saturate(.95) brightness(.86)}

  const a=new Date(OFFICIAL_LAUNCH_DATE+'T12:00:00');
  const b=new Date(today()+'T12:00:00');
  return Math.max(1,Math.floor((b-a)/604800000)+1);

  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const FAMILY_KEY='heroRPG_FAMILY_V8';

function makeFreshOfficialFamily(){
  const d=defaultData();
  d.season={id:CURRENT_SEASON_ID,launchDate:OFFICIAL_LAUNCH_DATE,official:true};
  d.hero.gold=0; d.hero.lotteryCoins=0;
  migrateProfileData(d);
  return {version:10,seasonId:CURRENT_SEASON_ID,activeProfileId:'hero_1',
    profiles:[{id:'hero_1',label:'新勇者',data:d}],
    access:{ownerUid:'',members:{}}};
}
function applyOfficialFreshStartIfNeeded(){
  if(!isOfficialSeasonStarted())return null;
  if(localStorage.getItem(OFFICIAL_SEASON_MARKER)===CURRENT_SEASON_ID)return null;
  localStorage.removeItem(FAMILY_KEY);
  localStorage.removeItem(STORAGE_KEY);
  sessionStorage.removeItem('activeHeroProfile');
  localStorage.setItem(OFFICIAL_SEASON_MARKER,CURRENT_SEASON_ID);
  return makeFreshOfficialFamily();
}
const __officialFreshFamily=applyOfficialFreshStartIfNeeded();

let familyData=__officialFreshFamily||loadFamilyData();
let activeProfileId=sessionStorage.getItem('activeHeroProfile')||familyData.activeProfileId||familyData.profiles[0].id;
let gameData=getActiveProfile().data;


function ensureFamilyAccessModel(){
  familyData.access=familyData.access||{ownerUid:'',members:{}};
  return familyData.access;
}
function familyRole(uid){
  const a=ensureFamilyAccessModel();
  return a.members?.[uid]?.role||(a.ownerUid===uid?'owner':'');
}
function canFamilyManage(uid){

function timerRewardTier(t,minutes){

    if(minutes>=low)return {key:'good',label:'✨ 達成練習時間',goldMultiplier:1.2,expMultiplier:1.2,agiBonus:0};

const JOB_AWAKEN_CONFIG={
  observationDays:28,minTaskRecords:20,stableWeeks:2,leadRatio:1.10,
  minCoreGrowthShare:.32,dualMinEachShare:.20,dualBalanceRatio:.70,
  combatCoreThreshold:55,overThresholdEfficiency:.40,secondaryCompensation:.35
};
function rawJobStat(key){
  if(key==='virtue')return Number(gameData.hero.virtue)||0;
  return Number(gameData.hero.stats?.[key])||0;
}
function jobGrowthValue(key){
  const base=key==='virtue'?0:10; return Math.max(0,rawJobStat(key)-base);
}
function totalJobGrowth(){return ['str','int','agi','will','virtue'].reduce((a,k)=>a+jobGrowthValue(k),0);}
function growthShare(key){const t=totalJobGrowth();return t>0?jobGrowthValue(key)/t:0;}
function dualJobQualified(rule){
  if(rule.kind!=='dual')return true;
  const [a,b]=rule.cores,sa=growthShare(a),sb=growthShare(b),va=jobGrowthValue(a),vb=jobGrowthValue(b);
  const balance=Math.max(va,vb)>0?Math.min(va,vb)/Math.max(va,vb):0;
  return sa>=JOB_AWAKEN_CONFIG.dualMinEachShare&&sb>=JOB_AWAKEN_CONFIG.dualMinEachShare&&balance>=JOB_AWAKEN_CONFIG.dualBalanceRatio;
}
function jobCoreShare(rule){return rule.kind==='dual'?Math.min(...rule.cores.map(growthShare)):growthShare(rule.core);}
const BEGINNER_SKILL_JOB_WEIGHTS={
  power_strike:{'戰士':1.00,'盜賊':.65,'聖騎士':.65,'魔劍士':.60},
  ember:{'法師':1.00,'魔劍士':.85,'獵人':.55},

function beginnerSkillAffinity(jobName){
  const usage=gameData.hero.skillUsage||{};
  const ids=Object.keys(BEGINNER_SKILL_JOB_WEIGHTS);
  const total=ids.reduce((s,id)=>s+(Number(usage[id])||0),0);
  if(total<=0)return 0;
  return ids.reduce((s,id)=>{
    const share=(Number(usage[id])||0)/total;
    return s+share*(BEGINNER_SKILL_JOB_WEIGHTS[id][jobName]||0);
  },0);
}
function blendedJobScore(rule){
  const reality=Math.max(0,jobScore(rule));
  // 技能只影響合格職業之間的排序，不繞過能力值/雙核心資格門檻。
  // 75% 現實成長 + 25% 戰鬥偏好；沒有技能紀錄時完全沿用原本判定。
  const affinity=beginnerSkillAffinity(rule.name);
  if(!Object.values(gameData.hero.skillUsage||{}).some(v=>Number(v)>0))return reality;
  return reality*(.75+.25*affinity);
}
function jobScore(rule){
  if(rule.kind==='dual'){
    if(!dualJobQualified(rule))return -1;
    const [a,b]=rule.cores.map(jobGrowthValue),balanced=(2*a*b)/(a+b||1);
    return balanced*1.45+Math.min(a,b)*.20;
  }
  return jobGrowthValue(rule.core)+jobGrowthValue(rule.secondary)*.10;
}
function currentJobCandidate(){
  // 複合職優先：符合資格的複合職先競爭；若皆不成立才判純職。
  const dual=JOB_RULES.filter(j=>j.kind==='dual'&&dualJobQualified(j)).map(j=>({j,score:blendedJobScore(j)})).sort((a,b)=>b.score-a.score);
  if(dual.length){
    if(dual.length===1||dual[0].score>=dual[1].score*JOB_AWAKEN_CONFIG.leadRatio)return dual[0].j;
  }
  const single=JOB_RULES.filter(j=>j.kind==='single'&&jobCoreShare(j)>=JOB_AWAKEN_CONFIG.minCoreGrowthShare)
    .map(j=>({j,score:blendedJobScore(j)})).sort((a,b)=>b.score-a.score);
  if(!single.length)return null;
  if(single.length===1||single[0].score>=single[1].score*JOB_AWAKEN_CONFIG.leadRatio)return single[0].j;
  return null;
}

  return c;

function stableCandidateWeeks(name){
  const h=[...(gameData.hero.jobCandidateHistory||[])].sort((a,b)=>b.week-a.week);
  let count=0,last=null;
  for(const x of h){
    if(x.job!==name)break;
    if(last!==null&&x.week!==last-1)break;
    count++;last=x.week;
  }
  return count;
}
function jobEffectiveCoreValue(rule){
  const keys=rule.kind==='dual'?rule.cores:[rule.core],vals=keys.map(k=>effectiveStat(rawJobStat(k)));
  const core=rule.kind==='dual'?Math.min(...vals):vals[0],second=effectiveStat(rawJobStat(rule.secondary));
  const t=JOB_AWAKEN_CONFIG.combatCoreThreshold;
  return (core<=t?core:t+(core-t)*JOB_AWAKEN_CONFIG.overThresholdEfficiency)+second*JOB_AWAKEN_CONFIG.secondaryCompensation;
}
function evaluateHiddenJob(showNotice=true){
  const h=gameData.hero;if(!h||h.jobAwakened)return;
  h.heroClass='見習勇者';
  if(daysSinceSemesterStart()<JOB_AWAKEN_CONFIG.observationDays||(gameData.taskRecords||[]).length<JOB_AWAKEN_CONFIG.minTaskRecords)return;
  const candidate=recordJobCandidateSnapshot(); if(!candidate)return;
  if(stableCandidateWeeks(candidate.name)<JOB_AWAKEN_CONFIG.stableWeeks)return;
  h.heroClass=candidate.name;h.jobAwakened=true;h.jobPassive=candidate.passive;
  h.skills=[...(h.skills||[])]; // 舊欄位保留相容性；職業主動技能改由技能書學習
  if(showNotice)alert(`✨ 職業覺醒！\n${h.name} 成為【${h.heroClass}】！\n獲得常駐被動技能；職業技能書已加入掉落池。`);

async function sha256Text(s){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function daysBetween(a,b){
  const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');
  return Math.max(0,Math.ceil((B-A)/86400000));
}

    .filter(e=>e.active!==false && ['midterm','final'].includes(e.type) && e.date>=td)
    .sort((a,b)=>a.date.localeCompare(b.date))[0]||null;
}
function taskDailyPotential(t){
  const limit=Math.max(1,Number(t.dailyLimit)||1);
  const stat = t.taskType==='timer'
    ? Math.max(0,...(t.statRules||[]).map(r=>Number(r.value)||0))
    : Number(t.fixedStatValue)||0;
  return {
    exp:(Number(t.expReward)||0)*limit,
    gold:(Number(t.goldReward)||0)*limit,
    stat:stat*limit
  };
}
function dailyPotential(){
  return (gameData.tasks||[]).filter(t=>t.active).reduce((a,t)=>{
    const p=taskDailyPotential(t);
    a.exp+=p.exp;a.gold+=p.gold;a.stat+=p.stat;return a;
  },{exp:0,gold:0,stat:0});
}
function estimatePowerAt(date,rate=BALANCE_CONFIG.expectedCompletion){
  const days=daysBetween(today(),date);
  const active=(gameData.tasks||[]).filter(t=>t.active);
  let power=combatPower();
  active.forEach(t=>{
    const limit=Math.max(1,Number(t.dailyLimit)||1);
    let statKey='will',statVal=0;
    if((t.taskType||'timer')==='timer'){
      const rules=[...(t.statRules||[])].sort((a,b)=>(Number(a.maxMinutes)||0)-(Number(b.maxMinutes)||0));
      const r=rules[Math.min(1,rules.length-1)]||rules[0];
      if(r){statKey=r.stat;statVal=Number(r.value)||0;}
    }else{
      statKey=t.fixedStat||'will';statVal=Number(t.fixedStatValue)||0;
    }
    const weight=BALANCE_CONFIG.combatWeights[statKey]||1.5;
    power += days*rate*limit*statVal*weight;
  });
  return Math.round(power);
}
function balanceLevel(value,greenMax,yellowMax){
  value=Number(value)||0;
  if(value<=greenMax)return {cls:'balance-good',icon:'🟢',text:'合理'};
  if(value<=yellowMax)return {cls:'balance-warn',icon:'🟡',text:'偏高'};
  return {cls:'balance-bad',icon:'🔴',text:'可能破壞平衡'};
}

  const worst=[e,g,s].sort((a,b)=>['balance-good','balance-warn','balance-bad'].indexOf(b.cls)-['balance-good','balance-warn','balance-bad'].indexOf(a.cls))[0];
  return {worst,e,g,s};
}

function scoreRewardTier(score,maxScore){
  const pct=maxScore>0?score/maxScore:0;
  if(pct>=.90)return {grade:'S',multiplier:1.00,label:'S'};
  if(pct>=.80)return {grade:'A',multiplier:.90,label:'A'};
  if(pct>=.70)return {grade:'B',multiplier:.80,label:'B'};
  if(pct>=.60)return {grade:'C',multiplier:.70,label:'C'};
  return {grade:'D',multiplier:.60,label:'D'};
}
function scaledRewardMap(map,multiplier){
  const out={};
  Object.entries(map||{}).forEach(([k,v])=>out[k]=Math.max(0,Math.round((Number(v)||0)*multiplier)));
  return out;
}
function completeScoreTask(taskId){
  const t=gameData.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(completedCount(taskId)>=t.dailyLimit){alert('今天已經登記過成績');return;}
  const maxScore=Math.max(1,Number(t.scoreMax)||100);
  const input=document.getElementById('score_'+taskId);
  const score=Number(input?.value);
  if(!Number.isFinite(score)||score<0||score>maxScore){alert(`請輸入 0～${maxScore} 的分數`);return;}
  const tier=scoreRewardTier(score,maxScore);
  const gold=Math.round((Number(t.goldReward)||0)*tier.multiplier);
  const exp=Math.round((Number(t.expReward)||0)*tier.multiplier);
  applyGoldWithDebt(gold); addExp(exp);

  let statGain=null, rollbackStats={};
  if(t.rewardMode==='auto'){
    const gains=applyRewardMap(scaledRewardMap(autoTaskRewards(t.category,t.difficulty,'complete'),tier.multiplier));
    statGain={multi:true,gains}; rollbackStats=gains;
  }else{
    const val=Math.round((Number(t.fixedStatValue)||0)*tier.multiplier);
    if(val>0){
      const stat=t.fixedStat||'will';
      if(stat==='virtue')gameData.hero.virtue=(gameData.hero.virtue||0)+val;
      else gameData.hero.stats[stat]=(gameData.hero.stats[stat]||0)+val;
      gameData.hero.lastStatGains={[stat]:val};
      statGain={stat,value:val}; rollbackStats={[stat]:val};
    }
  }
  const record={
    id:uid(),taskId:t.id,date:today(),status:'completed',taskType:'score',
    completedAt:new Date().toISOString(),score,scoreMax:maxScore,scoreGrade:tier.grade,scoreMultiplier:tier.multiplier,
    rewards:{gold,exp,statGain},approvalStatus:'pending',
    rollback:{gold,exp,statGain:rollbackStats},corrected:false
  };
  gameData.taskRecords.push(record);
  if(t.subject||t.progressType||t.progressValue){
    gameData.learningProgress.push({id:uid(),date:today(),subject:t.subject||'',item:t.progressType||t.name,progress:`${score}/${maxScore}（${tier.grade}）`});
  }
  evaluateHiddenJob(true);saveGame();
  alert(`📝 ${t.name}\n成績 ${score}/${maxScore}｜${tier.grade}級\n獎勵倍率 ${Math.round(tier.multiplier*100)}%\n💰 +${gold}\n⭐ +${exp}`+(statGain?.multi?`\n${rewardText(statGain.gains)}`:statGain?`\n${statName(statGain.stat)} +${statGain.value}`:''));
  renderAll();
}
function correctScoreTask(taskId,recordId){
  const t=gameData.tasks.find(x=>x.id===taskId);
  const r=(gameData.taskRecords||[]).find(x=>x.id===recordId);
  if(!t||!r||r.corrected)return;
  const maxScore=Math.max(1,Number(r.scoreMax)||Number(t.scoreMax)||100);
  const corrected=Number(document.getElementById('corr_'+taskId)?.value);
  if(!Number.isFinite(corrected)||corrected<0||corrected>maxScore){alert(`請輸入 0～${maxScore} 的訂正後分數`);return;}
  if(corrected<=Number(r.score||0)){alert('訂正後分數要高於第一次成績才會發放訂正獎勵');return;}
  const bonusExp=Math.max(0,Number(t.correctionExp)||0);
  addExp(bonusExp);
  r.corrected=true;r.correctedScore=corrected;r.correctedAt=new Date().toISOString();r.correctionExp=bonusExp;
  r.rollback.correctionExp=bonusExp;
  if(t.subject||t.progressType||t.progressValue){
    gameData.learningProgress.push({id:uid(),date:today(),subject:t.subject||'',item:(t.progressType||t.name)+'・訂正',progress:`${r.score} → ${corrected}/${maxScore}`});
  }
  saveGame();alert(`✨ 訂正完成！\n${r.score} → ${corrected}/${maxScore}\n⭐ 訂正 EXP +${bonusExp}`);renderAll();
}

function addExp(v){
  gameData.hero.exp+=v;
  while(gameData.hero.exp>=gameData.hero.maxExp){
    gameData.hero.exp-=gameData.hero.maxExp;
    gameData.hero.level++;
    gameData.hero.maxExp=Math.floor(gameData.hero.maxExp*1.2);
    Object.keys(gameData.hero.stats).forEach(k=>gameData.hero.stats[k]+=1);
    alert('✨ 升級！目前 Lv.'+gameData.hero.level+'，全能力 +1');
  }
}
function completedCount(taskId){
  return gameData.taskRecords.filter(r=>r.taskId===taskId&&r.date===today()&&r.status==='completed').length;
}
function startTask(taskId){
  if(gameData.activeTasks[taskId]){alert('這個任務已經在計時');return;}
  const t=gameData.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(completedCount(taskId)>=t.dailyLimit){alert('今天已達完成上限');return;}
  gameData.activeTasks[taskId]=Date.now();
  saveGame();renderTasks();startLiveTimer();
}
function finishTask(taskId){
  const start=gameData.activeTasks[taskId];
  if(!start){alert('請先開始任務');return;}
  const t=gameData.tasks.find(x=>x.id===taskId);
  const minutes=(Date.now()-start)/60000;
  delete gameData.activeTasks[taskId];

  let statGain=null;
  const timedReward=calculateTimedRewards(t,minutes);
  applyGoldWithDebt(timedReward.gold);
  addExp(timedReward.exp);
  if(t.rewardMode==='auto'){
    const gains=applyRewardMap(taskAutoRewardMap(t,minutes));
    statGain={multi:true,gains};
  }else{
    const ordered=[...(t.statRules||[])].sort((a,b)=>a.maxMinutes-b.maxMinutes);
    if((t.timerMode||'deadline')==='duration'){
      for(const r of ordered.slice().reverse()){if(minutes>=r.maxMinutes){statGain=r;break;}}
    }else{
      for(const r of ordered){if(minutes<=r.maxMinutes){statGain=r;break;}}
    }
    if(statGain){
      const val=Number(statGain.value)||0;
      if(statGain.stat==='virtue')gameData.hero.virtue=(gameData.hero.virtue||0)+val;
      else gameData.hero.stats[statGain.stat]=(gameData.hero.stats[statGain.stat]||0)+val;
      gameData.hero.lastStatGains={[statGain.stat]:val};
    }else gameData.hero.lastStatGains={};
  }

  const record={
    id:uid(),taskId:t.id,date:today(),status:'completed',
    startedAt:new Date(start).toISOString(),completedAt:new Date().toISOString(),
    durationMinutes:minutes,
    rewards:{gold:timedReward.gold,exp:timedReward.exp,baseGold:Number(t.goldReward)||0,baseExp:Number(t.expReward)||0,timerTier:timedReward.tier.key,statGain},
    approvalStatus:'pending',
    rollback:{gold:timedReward.gold,exp:timedReward.exp,statGain:statGain?.multi?statGain.gains:(statGain?{[statGain.stat]:Number(statGain.value)||0}:{})}
  };
  gameData.taskRecords.push(record);

  if(t.subject||t.progressType||t.progressValue){
    gameData.learningProgress.push({
      id:uid(),date:today(),
      subject:t.subject||'',
      item:t.progressType||t.name,
      progress:t.progressValue||'完成'
    });
  }
  evaluateHiddenJob(true);saveGame();
  const bonusText=timedReward.tier.key==='normal'?'':`\n${timedReward.tier.label}！獎勵 ×${timedReward.tier.goldMultiplier}`;
  alert(`完成【${t.name}】\n耗時 ${minutes.toFixed(1)} 分鐘${bonusText}\n💰 金幣 +${timedReward.gold}\n⭐ EXP +${timedReward.exp}`+(statGain?.multi?`\n${rewardText(statGain.gains)}`:statGain?`\n${statName(statGain.stat)} +${statGain.value}`:''));
  renderAll();
}

function reverseExp(amount){
  let remain=Number(amount)||0;
  gameData.hero.exp-=remain;
  while(gameData.hero.exp<0 && gameData.hero.level>1){
    gameData.hero.level--;
    gameData.hero.maxExp=Math.max(100,Math.floor(gameData.hero.maxExp/1.2));
    gameData.hero.exp+=gameData.hero.maxExp;
  }
  if(gameData.hero.exp<0)gameData.hero.exp=0;
}
function reviewTaskRecord(recordId,approved){
  const r=(gameData.taskRecords||[]).find(x=>x.id===recordId);
  if(!r||r.approvalStatus!=='pending')return;
  if(approved){
    r.approvalStatus='approved';
    const excellent=r.rewards?.timerTier==='excellent';
    if(excellent){
      if(Math.random()<.08)gameData.hero.lotteryCoins+=1;
      maybeDropSkillBook(.06,'優秀任務獎勵');
    }
    saveGame();renderAll();return;
  }
  const rb=r.rollback||{};
  const statMap=rb.statGain||{};
  Object.entries(statMap).forEach(([k,v])=>{
    if(k==='virtue')gameData.hero.virtue=Math.max(0,(gameData.hero.virtue||0)-(Number(v)||0));
    else gameData.hero.stats[k]=Math.max(0,(gameData.hero.stats[k]||0)-(Number(v)||0));
  });
  reverseExp(rb.exp||0);
  let need=Math.max(0,Number(rb.gold)||0);
  const take=Math.min(gameData.hero.gold,need);
  gameData.hero.gold-=take;need-=take;
  if(need>0)gameData.hero.pendingGoldDebt=(gameData.hero.pendingGoldDebt||0)+need;
  r.approvalStatus='rejected';r.rejectedAt=new Date().toISOString();
  saveGame();renderAll();
}
function applyGoldWithDebt(amount){
  amount=Number(amount)||0;
  const debt=gameData.hero.pendingGoldDebt||0;
  const paid=Math.min(amount,debt);
  gameData.hero.pendingGoldDebt=debt-paid;
  gameData.hero.gold+=amount-paid;
  return {gross:amount,paid,net:amount-paid};
}

function buyItem(itemId){
  const item=gameData.shopItems.find(x=>x.id===itemId);
  if(!item)return;
  const bought=gameData.inventory.filter(x=>x.itemId===itemId&&x.boughtDate===today()).length;

function weightedPick(items){
  const total=items.reduce((s,x)=>s+Math.max(0,Number(x.weight)||0),0);
  if(total<=0)return null;
  let r=Math.random()*total;
  for(const item of items){
    r-=Math.max(0,Number(item.weight)||0);
    if(r<=0)return item;
  }
  return items[items.length-1];
}
function rollDungeonDrop(rating=1){
  // 技能書是獨立稀有掉落；S評級較高，且只掉尚未學會的職業技能。
  const book=maybeDropSkillBook(rating===3?.14:rating===2?.06:.02,'每日戰鬥掉落');
  if(book)return book;
  // 抽獎幣不是爛獎：只有優秀表現才有低機率出現。
  if(rating===3&&Math.random()<.10){gameData.hero.lotteryCoins+=1;return {type:'lottery',label:'稀有抽獎幣 ×1',value:1};}
  const couponChance=rating===3?.45:rating===2?.25:.10;
  if(Math.random()<couponChance){
    const available=gameData.shopItems.filter(x=>x.active&&!x.battleConsumable);
    if(available.length){
      const item=available[Math.floor(Math.random()*available.length)];
      gameData.inventory.push({id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'dungeon'});
      return {type:'coupon',label:item.name,value:item.id};
    }
  }
  const amount=rating===3?5+Math.floor(Math.random()*6):rating===2?3+Math.floor(Math.random()*3):1+Math.floor(Math.random()*3);
  gameData.hero.gold+=amount;return {type:'gold',label:`金幣 +${amount} G`,value:amount};
}
function calculateBattleRating(win,heroHp,heroMaxHp,rounds){
  if(!win)return 0;
  const hpPct=heroHp/Math.max(1,heroMaxHp);
  if(hpPct>=.70 && rounds<=12)return 3;
  if(hpPct>=.40)return 2;
  return 1;
}

function weekdayNumberFor(dateStr=today()){
  return new Date(dateStr+'T12:00:00').getDay();
}
function isTaskScheduledToday(t,dateStr=today()){
  const wd=weekdayNumberFor(dateStr);
  const arr=t.weekdays||[1,2,3,4,5,6,0];
  return arr.includes(wd);
}
function effectiveSchoolDaysUntil(dateStr){
  const sem=gameData.semester||{}, start=new Date((sem.startDate||today())+'T12:00:00'), end=new Date(dateStr+'T12:00:00');
  const allowed=new Set(sem.schoolWeekdays||[1,2,3,4,5]);
  let count=0, d=new Date(start);
  while(d<=end){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const special=(sem.events||[]).find(e=>e.date===ds);
    if(allowed.has(d.getDay()) && special?.type!=='holiday')count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
function semesterWeekIndex(){
  const start=new Date((gameData.semester?.startDate||today())+'T12:00:00');
  const now=new Date(today()+'T12:00:00');
  return Math.max(1,Math.floor((now-start)/604800000)+1);
}

/* ===== V10.10.15 MULTI-ENEMY / SUMMON CORE =====
   相容原本 1v1：舊 battle.enemy 仍保留為主要敵人；
   新系統用 battle.enemies 管理 Boss + 最多 2 個召喚物。
*/
const MULTI_ENEMY_RULES={
  maxEnemies:4,
  maxSummons:3,
  summonRewards:false,
  removeSummonsWhenBossDies:true
};

function makeBattleEnemyUnit(monsterId, opts={}){
  const def=monsterDefinitionById(monsterId)||{id:monsterId,name:monsterId};
  const maxHp=Math.max(1,Number(opts.maxHp||opts.hp||100));
  return {
    uid:opts.uid||`${monsterId}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    monsterId,
    name:opts.name||def.name||monsterId,
    hp:Math.max(0,Number(opts.hp??maxHp)),
    maxHp,
    atk:Number(opts.atk||0),
    def:Number(opts.def||0),
    matk:Number(opts.matk||0),
    mdef:Number(opts.mdef||0),
    speed:Number(opts.speed||0),
    statuses:Array.isArray(opts.statuses)?opts.statuses:[],
    isBoss:!!(opts.isBoss??def.boss),
    isSummon:!!opts.isSummon,
    summonedBy:opts.summonedBy||null,
    rewardExp:opts.isSummon?0:Number(opts.rewardExp||0),
    rewardGold:opts.isSummon?0:Number(opts.rewardGold||0),
    dropTableId:opts.isSummon?null:(opts.dropTableId||def.dropTableId||null),
    alive:true
  };
}

function ensureBattleEnemyArray(battle){
  if(!battle)return [];
  if(!Array.isArray(battle.enemies))battle.enemies=[];
  // 舊版只有 enemy 時，自動包成第一個主要敵人，不破壞舊資料。
  if(!battle.enemies.length && battle.enemy){
    const e=battle.enemy;
    const unit=makeBattleEnemyUnit(e.monsterId||e.id||'legacy_enemy',{
      ...e,
      uid:e.uid||'primary_enemy',
      isBoss:!!e.isBoss,
      isSummon:false
    });
    battle.enemies.push(unit);
  }
  battle.enemies.forEach(u=>{
    u.alive=Number(u.hp)>0;
    if(!Array.isArray(u.statuses))u.statuses=[];
  });
  return battle.enemies;
}

function livingBattleEnemies(battle){
  return ensureBattleEnemyArray(battle).filter(u=>u.alive && Number(u.hp)>0);
}
function primaryBattleEnemy(battle){
  return ensureBattleEnemyArray(battle).find(u=>!u.isSummon)||ensureBattleEnemyArray(battle)[0]||null;
}
function battleEnemyByUid(battle,uid){
  return ensureBattleEnemyArray(battle).find(u=>u.uid===uid)||null;
}
function canSummonBattleEnemy(battle){
  const alive=livingBattleEnemies(battle);
  return alive.length<MULTI_ENEMY_RULES.maxEnemies &&
         alive.filter(u=>u.isSummon).length<MULTI_ENEMY_RULES.maxSummons;
}
function summonBattleEnemy(battle,monsterId,summoner,opts={}){
  if(!canSummonBattleEnemy(battle))return null;
  const parent=typeof summoner==='string'?battleEnemyByUid(battle,summoner):summoner;
  const unit=makeBattleEnemyUnit(monsterId,{
    ...opts,
    isSummon:true,
    summonedBy:parent?.uid||null,
    rewardExp:0,rewardGold:0,dropTableId:null
  });
  ensureBattleEnemyArray(battle).push(unit);
  return unit;
}
function defeatBattleEnemyUnit(battle,uid){
  const unit=battleEnemyByUid(battle,uid);
  if(!unit)return {ended:false};
  unit.hp=0; unit.alive=false;
  const main=primaryBattleEnemy(battle);
  if(main && !main.alive && MULTI_ENEMY_RULES.removeSummonsWhenBossDies){
    ensureBattleEnemyArray(battle).forEach(u=>{
      if(u.isSummon){u.hp=0;u.alive=false;}
    });
  }
  return {ended:livingBattleEnemies(battle).length===0,unit};
}
function validEnemyTargets(battle){
  return livingBattleEnemies(battle).map(u=>({uid:u.uid,name:u.name,isBoss:u.isBoss,isSummon:u.isSummon,hp:u.hp,maxHp:u.maxHp}));
}
function chooseEnemyTarget(battle,preferredUid=null){
  const alive=livingBattleEnemies(battle);
  return (preferredUid&&alive.find(u=>u.uid===preferredUid))||alive[0]||null;
}

/* 敵方逐隻行動的通用排程器。actionFn(unit) 可接既有怪物 AI。 */
async function runEnemyTeamTurn(battle,actionFn){
  const queue=[...livingBattleEnemies(battle)];
  for(const unit of queue){
    if(!unit.alive||Number(unit.hp)<=0)continue;
    if(typeof actionFn==='function')await actionFn(unit);
    const main=primaryBattleEnemy(battle);
    if(main && !main.alive)break;
  }
}

/* 通用簡易 AI：技能可帶 weight / condition。
   condition: low_hp, no_summon, target_not_statused, always */
function chooseWeightedEnemySkill(unit,battle,skills=[]){
  const pool=[];
  for(const s of skills){
    if(!s)continue;
    let ok=true;
    if(s.condition==='low_hp')ok=(unit.hp/unit.maxHp)<=Number(s.threshold||.4);
    if(s.condition==='no_summon')ok=!livingBattleEnemies(battle).some(x=>x.isSummon&&x.summonedBy===unit.uid);
    if(!ok)continue;
    const weight=Math.max(0,Number(s.weight||1));
    if(weight>0)pool.push({s,weight});
  }
  if(!pool.length)return skills[0]||null;
  const total=pool.reduce((a,x)=>a+x.weight,0);
  let r=Math.random()*total;
  for(const x of pool){r-=x.weight;if(r<=0)return x.s;}
  return pool[pool.length-1].s;
}

function taskIsEffectiveOn(t,dateStr){
  if(t.active===false)return false;

}

function taskCountsTowardBossOn(t,dateStr){
  if(!isBossLearningCategory(t))return false;
  if(!taskIsEffectiveOn(t,dateStr))return false;
  if(!isTaskScheduledToday(t,dateStr))return false;
  if(isNoStudyCalendarDay(dateStr))return false;
  if(isConfiguredSchoolDay(dateStr))return true;
  return t.countForBossOnNonSchoolDay===true;
}

function bossCutoffDate(kind='midterm'){
  const sem=gameData.semester||{};
  const dates=[
    ...(sem.events||[]).filter(e=>e.type===kind).map(e=>e.date),
    ...(gameData.events||[]).filter(e=>e.type===kind&&e.active!==false).map(e=>e.date)
  ].filter(Boolean).sort();
  if(dates.length)return dates[dates.length-1];
  return kind==='final'?(sem.endDate||'2027-01-14'):'2026-11-06';
}
function theoreticalLearningRequirement(kind='midterm'){
  const sem=gameData.semester||{};
  const cutoff=bossCutoffDate(kind);
  const start=sem.startDate||OFFICIAL_LAUNCH_DATE;
  let expected=0,scheduledCount=0,excludedDays=0;
  const d0=new Date(start+'T12:00:00'),d1=new Date(cutoff+'T12:00:00');
  if(!Number.isFinite(d0.getTime())||!Number.isFinite(d1.getTime())||d1<d0)
    return {expected:0,scheduledCount:0,excludedDays:0,start,cutoff};
  for(let d=new Date(d0);d<=d1;d.setDate(d.getDate()+1)){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(isNoStudyCalendarDay(ds)){excludedDays++;continue;}
    (gameData.tasks||[]).forEach(t=>{
      if(!taskCountsTowardBossOn(t,ds))return;
      expected+=(DIFFICULTY_POINTS[t.difficulty]||3);
      scheduledCount++;
    });
  }
  return {expected,scheduledCount,excludedDays,start,cutoff};
}

function learningCompletionRatio(kind='midterm'){
  const req=theoreticalLearningRequirement(kind);
  const records=(gameData.taskRecords||[]).filter(r=>{
    if(r.date<req.start||r.date>req.cutoff||r.approvalStatus!=='approved')return false;
    const t=(gameData.tasks||[]).find(x=>x.id===r.taskId);
    return !!t && taskCountsTowardBossOn(t,r.date);
  });
  const approvedPoints=records.reduce((sum,r)=>{
    const t=(gameData.tasks||[]).find(x=>x.id===r.taskId);
    return sum+(DIFFICULTY_POINTS[t?.difficulty]||3);
  },0);
  return req.expected>0?Math.min(1.2,approvedPoints/req.expected):0;
}

function bossLearningReport(kind='midterm'){
  const req=theoreticalLearningRequirement(kind);
  let approved=0;
  (gameData.taskRecords||[]).forEach(r=>{
    if(r.date<req.start||r.date>req.cutoff||r.approvalStatus!=='approved')return;
    const t=(gameData.tasks||[]).find(x=>x.id===r.taskId);
    if(t&&taskCountsTowardBossOn(t,r.date))approved+=(DIFFICULTY_POINTS[t.difficulty]||3);
  });
  const ratio=req.expected?approved/req.expected:0;
  return {required:req.expected,approved,ratio,excludedDays:req.excludedDays,cutoff:req.cutoff};
}

function bossDifficultyMultiplier(kind){
  const ratio=learningCompletionRatio(kind);
  if(ratio>=.9)return .88;
  if(ratio>=.75)return .97;
  if(ratio>=.60)return 1.06;
  if(ratio>=.50)return 1.14;
  if(ratio>=.35)return 1.28;
  return 1.45;
}

const SEMESTER_BALANCE = {
  targetCompletion: .75,
  dailyVariance: .035,
  difficultyMultipliers: {easy:.88, normal:.94, hard:1.02, elite:1.08},
  eventMultipliers: {daily:1.00, midterm:1.18, final:1.30},
  minPower: 70
};

function dateOnlyBattle(s){ return s ? new Date(s+'T00:00:00') : null; }
function daysBetweenBattle(a,b){
  if(!a||!b)return 0;
  return Math.max(0,Math.floor((b-a)/86400000));
}
function semesterProgressInfo(){
  const sem=gameData.semester||{};
  const start=dateOnlyBattle(sem.startDate), end=dateOnlyBattle(sem.endDate), now=dateOnlyBattle(today());
  if(!start||!end||end<=start) return {valid:false,day:1,totalDays:120,progress:0};
  const total=Math.max(1,daysBetweenBattle(start,end)+1);
  const day=Math.min(total,Math.max(1,daysBetweenBattle(start,now)+1));
  return {valid:true,day,totalDays:total,progress:(day-1)/Math.max(1,total-1)};
}

function expectedDailyStatBudget(){
  // 只採「系統自動換算」任務建立基準；手動任務不拿來把世界難度灌爆。
  const active=(gameData.tasks||[]).filter(t=>t.active!==false && t.rewardMode==='auto');
  if(!active.length) return 3.0;
  let sum=0;
  active.forEach(t=>{
    const map=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType||'simple');
    sum += Object.values(map).reduce((a,b)=>a+(Number(b)||0),0);
  });
  // dailyLimit 避免重複任務造成怪物無限膨脹；以每天每類正常完成一次估算。
  return clampBattle(sum,2,18);
}

function expectedSemesterPowerAt(dateStr=today()){
  const sem=gameData.semester||{};
  const start=dateOnlyBattle(sem.startDate||OFFICIAL_LAUNCH_DATE);
  const target=dateOnlyBattle(dateStr);
  const baseStats={str:10,agi:10,int:10,will:10};
  if(!start||!target)return 79;
  const budget=expectedDailyStatBudget()*SEMESTER_BALANCE.targetCompletion;
  const active=(gameData.tasks||[]).filter(t=>t.active!==false && t.rewardMode==='auto');
  let weights={str:0,agi:0,int:0,will:0}, total=0;
  active.forEach(t=>{
    const map=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType||'simple');
    Object.entries(map).forEach(([k,v])=>{
      if(k!=='virtue'){weights[k]=(weights[k]||0)+(Number(v)||0);total+=Number(v)||0;}
    });
  });
  if(total<=0){weights={str:.25,agi:.25,int:.25,will:.25};total=1;}
  const elapsed=Math.max(0,daysBetweenBattle(start,target));
  Object.keys(baseStats).forEach(k=>{
    baseStats[k]+=elapsed*budget*((weights[k]||0)/total);
  });
  return Math.round(baseStats.str*2.2+baseStats.agi*2.0+baseStats.int*1.8+baseStats.will*1.9);
}
function expectedSemesterPower(){return expectedSemesterPowerAt(today());}

function deterministicDailyVariance(){
  const s=today().replaceAll('-','');
  let n=0; for(const ch of s)n=(n*31+ch.charCodeAt(0))%997;
  return ((n/996)*2-1)*SEMESTER_BALANCE.dailyVariance;
}

function generatedMonsterPower(kind='daily',difficulty='normal'){
  const targetDate=kind==='midterm'?bossCutoffDate('midterm'):kind==='final'?bossCutoffDate('final'):today();
  const expected=Math.max(SEMESTER_BALANCE.minPower,expectedSemesterPowerAt(targetDate));
  const diff=SEMESTER_BALANCE.difficultyMultipliers[difficulty]||SEMESTER_BALANCE.difficultyMultipliers.normal;
  const evt=SEMESTER_BALANCE.eventMultipliers[kind]||1;
  return Math.max(SEMESTER_BALANCE.minPower,Math.round(expected*diff*evt*(1+deterministicDailyVariance())));
}

function eventSuggestedPower(type='midterm'){
  return generatedMonsterPower(type==='final'?'final':'midterm','normal');
}
function actualVsExpectedStatus(monsterPower){
  const ratio=combatPower()/Math.max(1,monsterPower);
  if(ratio>=1.15)return {label:'🟢 優勢戰',cls:'good'};
  if(ratio>=1.00)return {label:'🟢 正常戰',cls:'good'};
  if(ratio>=.90)return {label:'🟡 苦戰',cls:'warn'};

}

function resolvedDungeonPower(evt,monster){

  if(monster?.power!==undefined)return Math.max(1,Number(monster.power)||1);

  return calibratedDailyMonsterPower();
}



// 每日怪設計原則：
 // 1. 長期：學期週數提供基準曲線
 // 2. 短期：當日有效任務內容/獎勵量決定當日負荷
 // 3. 假日與標記國定假日不套平日強度
 // 4. 計時任務的「優秀完成加成」不預先灌進怪物，讓優秀表現形成實際優勢
 // 5. 角色戰力只小幅安全修正，避免怪物完全追蹤玩家
const DUNGEON_GROWTH_CONFIG={
  // 初始勇者約 41 戰力。第一週普通怪以 40 左右起跑。
  firstWeekBase:40,
  weeklyGrowth:0.16,        // 每週約 +16%
  sundayBossBonus:1.28,    // 保留給獨立週Boss事件使用；每日AUTO怪不直接套用
  minPower:32,
  learningInfluence:.35    // 學習量影響，但不讓怪完全追著角色膨脹
};
function semesterProgressWeek(){
  const configured=gameData.semester?.startDate;
  const start=(!configured||configured<OFFICIAL_LAUNCH_DATE)?OFFICIAL_LAUNCH_DATE:configured;
  const a=new Date(start+'T12:00:00'),b=new Date(today()+'T12:00:00');
  return Math.max(1,Math.floor((b-a)/604800000)+1);
}
function todayEffectiveTaskLoad(){
  const t=today();
  const tasks=(gameData.tasks||[]).filter(x=>{
    if(x.active===false)return false;
    // 有日期的任務只算今天；無日期的固定/每日任務維持相容。
    if(x.date&&x.date!==t)return false;
    return true;
  });

  let load=0;
  for(const task of tasks){
    // 優先使用任務本身的能力獎勵總量，這最接近孩子今天完成後實際會得到的成長。
    const rewards=task.rewards||task.statRewards||{};
    const statGain=['str','int','agi','will','virtue'].reduce((s,k)=>s+(Number(rewards[k])||0),0);

    // 若舊任務沒有能力獎勵資料，才依難度回推負荷。
    const difficultyFallback={
      easy:1,normal:3,medium:3,hard:4,challenge:5
    }[String(task.difficulty||'normal').toLowerCase()]||3;

    let taskLoad=statGain>0?statGain:difficultyFallback;

    // 計時任務只反映「預期工作量」，不預先把優秀完成加成算進怪物。
    // 優秀加成是孩子完成後的額外優勢，不能被怪物提前吃掉。
    if(task.timerEnabled||task.timeLimit||task.timerMinutes)taskLoad*=1.05;

    load+=taskLoad;
  }
  return {count:tasks.length,load:Math.round(load*100)/100};
}
function isNonSchoolDay(){
  const d=new Date(today()+'T12:00:00'),day=d.getDay();
  // 週六、週日不列入平日學習強度統計。
  // 國定假日若由資料/後台標記 holiday=true，也同樣排除平日基準。
  const holidayMarked=(gameData.calendarDays||[]).some(x=>x.date===today()&&x.holiday===true);
  return day===0||day===6||holidayMarked;
}
// V10.10.23：同一週由週一到週五逐步升壓；週末重打視同週五 Boss。
function weeklyEncounterFactor(dayIndex){
  const i=Math.max(0,Math.min(4,Number(dayIndex)||0));
  return [0.90,0.98,1.06,1.14,1.22][i];
}
function calibratedDailyMonsterPower(){
  const week=semesterProgressWeek();
  const cfg=DUNGEON_GROWTH_CONFIG;

  // 學期週數提供長期底盤。
  const weeklyBase=cfg.firstWeekBase*Math.pow(1+cfg.weeklyGrowth,week-1);

  // 同一週週一→週五也要有明確升壓，不能五天都吃同一個 power。
  const encounterFactor=weeklyEncounterFactor(dailyMonsterIndexForDate(today()));

  // 今日任務是每日怪強度的主要短期依據。
  const taskInfo=todayEffectiveTaskLoad();
  const neutralLoad=12;
  const taskRatio=taskInfo.load>0?taskInfo.load/neutralLoad:.70;
  const taskFactor=Math.max(.72,Math.min(1.38,.72+taskRatio*.28));

  // 假日/國定假日不使用平日強度要求；週末若補打 Boss，仍由 encounterFactor 保留 Boss 壓力。
  const calendarFactor=isNonSchoolDay() ? .88 : 1.0;

  // 角色成長只做很小的安全修正，避免怪物完全追著角色膨脹。
  const cp=Math.max(1,combatPower());
  const growthFactor=1+(Math.max(0,cp-41)/100)*cfg.learningInfluence;

  return Math.max(
    cfg.minPower,
    Math.round(weeklyBase*encounterFactor*taskFactor*calendarFactor*growthFactor)
  );
}

    speed:e.agi,
    crit:clampBattle(.05+.25*(e.agi/(e.agi+100))+pm.crit,.05,.35),

  };

function deriveEnemyStats(power,name='怪物',eventType='daily'){
  const boss=eventType==='midterm'||eventType==='final';
  // V10.10.23 修正 power→戰鬥屬性的換算。
  // 勇者 10/10/10/10 的 combatPower 約 41，因此平均單項能力應約為 power/4.1；
  // 舊版除以 5 會把 W1~W3 怪物能力整體壓低約 18%，造成新角色也能輕鬆普攻推過。
  const rawBase=Math.max(8,Number(power||70)/4.1);
  const variance=(label)=>{
    if(name.includes('史萊姆'))return label==='will'?.85:label==='agi'?.8:1;
    if(name.includes('哥布林'))return label==='agi'?1.25:label==='will'?.8:1;
    if(name.includes('獸人'))return label==='str'?1.3:label==='agi'?.8:1;
    if(name.includes('骷髏'))return label==='int'?1.25:label==='str'?.85:1;
    if(name.includes('騎士'))return label==='will'?1.3:label==='agi'?.8:1;
    return 1;
  };
  const e={
    str:effectiveStat(rawBase*variance('str')),
    int:effectiveStat(rawBase*.9*variance('int')),
    agi:effectiveStat(rawBase*.9*variance('agi')),
    will:effectiveStat(rawBase*variance('will')),
    virtue:0
  };
  // V10.10.28：effectiveStat 會在高數值逐漸飽和，因此不能只靠 e.will/e.str 支撐後期怪物。
  // 保留 Power<=100 的前期手感；只有超過 100 的 Power 轉成後期成長量，避免 W1~W3 被重新拉高。
  const latePower=Math.max(0,Number(power||0)-100);
  const lateHp=latePower*(boss?1.80:.55);
  const maxHp=Math.round((boss?150:100)+(boss?5.2:3.6)*e.will+1.0*e.str+lateHp);
  const maxEnergy=Math.round(45+e.int*.45+e.will*.25+latePower*.04);
  const resist={fire:0,ice:0,lightning:0,wind:0,poison:0,curse:0};
  if(name.includes('史萊姆')){resist.fire=-.15;resist.ice=.10;}
  if(name.includes('獸人')){resist.fire=.15;resist.ice=-.20;}
  if(name.includes('骷髏')){resist.poison=.85;resist.curse=.25;resist.fire=-.10;}
  if(name.includes('騎士')){resist.fire=.10;resist.ice=.10;resist.lightning=.10;resist.wind=.10;}
  return {
    side:'enemy',name,...e,maxHp,maxEnergy,
    // 高 Power 額外成長採溫和線性補償，解除 effectiveStat 飽和造成的後期斷層。
    attack:9+e.str*1.15+latePower*.05,
    magicAttack:7+e.int*1.15+latePower*.05,
    defense:8+e.will*.75+latePower*.035,
    magicDefense:7+e.will*.70+latePower*.035,
    speed:e.agi,
    crit:clampBattle(.04+.20*(e.agi/(e.agi+100)),.04,.24),
    evade:clampBattle(.02+.16*(e.agi/(e.agi+100)),.02,.18),
    parry:clampBattle(.02+.07*(e.will/(e.will+100)),.02,.09),
    block:clampBattle(.04+.12*(e.will/(e.will+100)),.04,.16),
    statusRes:clampBattle(.04+.22*(e.will/(e.will+100)),.04,.26),
    elementalBaseRes:clampBattle(.12*(e.will/(e.will+100)),0,.12),
    resist,statuses:[],guarding:false,boss
  };
}
function defenseReduction(def){
  return def/(def+100);
}
function totalElementRes(defender,type){
  const special=Number(defender.resist?.[type]||0);
  const base=type==='poison'||type==='curse'?0:(defender.elementalBaseRes||0);
  return clampBattle(base+special,-.50,.75);
}
function statusChance(base,defender,statusType){
  const special=Number(defender.resist?.[statusType]||0);
  return clampBattle(base*(1-(defender.statusRes||0))*(1-special),0,.95);
}
function addStatus(target,status){

  if(existing){

  }else target.statuses.push({...status});
}

    paralysis:'⚡ 麻痺',freeze:'❄️ 冰凍',stun:'😵 暈眩'}[s.type]||s.type;
}
function effectMod(unit,key){return (unit.statuses||[]).reduce((a,s)=>a+Number(s.mods?.[key]||0),0);}
function effectiveBattleValue(unit,key){return Math.max(0,Number(unit[key]||0)+effectMod(unit,key));}
function addTimedEffect(target,effect){target.statuses.push({type:'effect_'+Date.now()+'_'+Math.random(),name:effect.name||'效果',effectType:effect.effectType||'buff',turns:Number(effect.turns)||1,mods:{...(effect.mods||{})}});}

async function animateBattleAction(attackerSide,result){
  const attacker=document.getElementById('battleChar_'+attackerSide);
  const defenderSide=attackerSide==='hero'?'enemy':'hero';
  const defender=document.getElementById('battleChar_'+defenderSide);
  if(!attacker||!defender)return;
  attacker.classList.remove('attack');defender.classList.remove('hit','dodge');
  void attacker.offsetWidth;
  attacker.classList.add('attack');
  try{
    if(attackerSide==='hero')await playHeroAttackFrames(); else await playEnemyAttackFrames();
    if(result.type==='dodge')defender.classList.add('dodge');
    else if(result.damage>0)defender.classList.add('hit');
    await battleSleep(220);
  }finally{
    attacker.classList.remove('attack');
    defender.classList.remove('hit','dodge');
    // Never leave inline transforms behind after long battles.
    attacker.style.transform='';
    defender.style.transform='';
    const sprite=document.getElementById('battleHeroSprite');
    if(sprite)sprite.src=HERO_ATTACK_FRAMES[0];
    if(battleStateV10?.monsterId==='hero_mirror'){
      const mirror=document.getElementById('battleEnemySprite');
      if(mirror)mirror.src=HERO_ATTACK_FRAMES[0];
    }
  }
}
function resolveAttack(attacker,defender,action={type:'physical',multiplier:1}){
  const damageType=action.type||'physical';
  const isPhysical=damageType==='physical';
  const canDodge=action.canDodge!==false;
  const hit=clampBattle(BATTLE_CONFIG.baseHit+(attacker.speed-defender.speed)*.001+effectMod(attacker,'hit'),.45,.99);
  if(Math.random()>hit)return {type:'miss',damage:0,damageType};
  if(canDodge && Math.random()<effectiveBattleValue(defender,'evade'))return {type:'dodge',damage:0,damageType};
  if(isPhysical && action.canParry!==false && Math.random()<effectiveBattleValue(defender,'parry'))return {type:'parry',damage:0,damageType};

  const crit=Math.random()<effectiveBattleValue(attacker,'crit');
  const variance=.90+Math.random()*.20;
  const attackValue=isPhysical?effectiveBattleValue(attacker,'attack'):effectiveBattleValue(attacker,'magicAttack');
  const defenseValue=isPhysical?effectiveBattleValue(defender,'defense'):effectiveBattleValue(defender,'magicDefense');
  // V10.10.20：支援特定技能/戰鬥的防禦穿透。一般戰鬥預設 0，不改既有平衡。
  const defensePierce=clampBattle(Number(action.defensePierce||0),0,.90);
  let raw=Math.max(1,attackValue*(action.multiplier||1)-defenseValue*(1-defensePierce)*.50);
  let weak=false,resisted=false;

  if(damageType==='holy'){
    // 神聖傷害：不吃元素抗性，但仍使用 MDEF 基礎減傷。
  }else if(damageType==='arcane'){
    // 祕法：純魔法基準屬性，只吃 MDEF，不進元素弱點/抗性表。
  }else if(!isPhysical){
    const res=totalElementRes(defender,damageType);
    raw*=1-res;
    weak=res<-.05;resisted=res>.10;
  }

  // 專注：下一次真正命中的傷害型攻擊 +40%，命中後即消耗。
  const focus=attacker.statuses?.find(s=>Number(s.mods?.nextAttackMultiplier||0)>0);
  if(focus){
    raw*=1+Number(focus.mods.nextAttackMultiplier||0);
    focus.turns=0;
  }
  raw*=variance;
  raw*=Math.max(.10,1+effectMod(defender,'damageTaken'));
  let blocked=false;
  if(isPhysical && action.canBlock!==false && Math.random()<effectiveBattleValue(defender,'block')){
    raw*=BATTLE_CONFIG.blockReduction;blocked=true;
  }
  if(crit)raw*=BATTLE_CONFIG.critDamage;

  // V10.10.20：勇者鏡像戰避免「高防禦對高防禦」造成雙方永遠 1 傷害。
  // 只有 mirrorDuel 攻擊套用，最低傷害為目標最大 HP 的 2%，其他怪物完全不受影響。
  if(action.mirrorDuel){
    const mirrorFloor=Math.max(2,Math.round(Number(defender.maxHp||1)*.02));
    raw=Math.max(raw,mirrorFloor);
  }
  const damage=Math.max(1,Math.round(raw));
  return {type:blocked?'block':'hit',damage,damageType,crit,weak,resisted};
}
function getUnitHp(side){return side==='hero'?battleStateV10.heroHp:battleStateV10.enemyHp;}
function setUnitHp(side,val){
  if(side==='hero')battleStateV10.heroHp=Math.max(0,val);
  else battleStateV10.enemyHp=Math.max(0,val);
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  updateBattleHp(side,getUnitHp(side),unit.maxHp);
}
function getUnitEnergy(side){return side==='hero'?battleStateV10.heroEnergy:battleStateV10.enemyEnergy;}
function setUnitEnergy(side,val){
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  val=clampBattle(val,0,unit.maxEnergy);
  if(side==='hero')battleStateV10.heroEnergy=val;else battleStateV10.enemyEnergy=val;
  updateBattleResource(side,val,unit.maxEnergy);
}
async function processStatusTick(side){
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  let hp=getUnitHp(side),skip=false;
  for(const s of [...unit.statuses]){
    if(s.type==='poison'){
      const dmg=Math.max(1,Math.round(s.power||6));hp-=dmg;
      addBattleLog(`☠️ ${unit.name}受到 ${dmg} 點毒素傷害。`);showDamage(side,'-'+dmg);
    }else if(s.type==='burn'){
      const dmg=Math.max(1,Math.round(s.power||5));hp-=dmg;
      addBattleLog(`🔥 ${unit.name}受到 ${dmg} 點燃燒傷害。`);showDamage(side,'-'+dmg);
    }else if(s.type==='bleed'){
      const dmg=Math.max(1,Math.round(s.power||5));hp-=dmg;
      addBattleLog(`🩸 ${unit.name}流血，受到 ${dmg} 點傷害。`);showDamage(side,'-'+dmg);
    }else if(s.type==='curse' && s.mode==='delayed'){
      s.countdown=(s.countdown??s.turns)-1;
      if(s.countdown<=0){
        const dmg=Math.max(1,Math.round(s.power||25));hp-=dmg;
        addBattleLog(`💀 死亡印記爆發！${unit.name}受到 ${dmg} 點詛咒傷害！`);
        showDamage(side,'-'+dmg,'holy-float');s.turns=0;
      }else addBattleLog(`🌀 ${unit.name}的死亡印記：${s.countdown}`);
    }else if(['stun','freeze'].includes(s.type)){
      if(Math.random()<.85){skip=true;addBattleLog(`${statusLabel(s)}！${unit.name}無法行動。`);}
    }else if(s.type==='paralysis'){
      if(Math.random()<.35){skip=true;addBattleLog(`⚡ 麻痺發作！${unit.name}無法行動。`);}
    }
    s.turns--;
  }
  unit.statuses=unit.statuses.filter(s=>s.turns>0);
  setUnitHp(side,hp);updateBattleStatuses();
  await battleSleep(250);
  return skip;
}
function maybeApplyEnemyStatus(attacker,defender,result){
  if(result.damage<=0)return;
  const name=attacker.name||'';
  if(name.includes('骷髏法師') && Math.random()<statusChance(.28,defender,'curse')){
    addStatus(defender,{type:'curse',mode:'delayed',turns:4,countdown:3,power:Math.max(18,attacker.magicAttack*.8)});
    addBattleLog(`🌀 ${defender.name}中了「死亡印記」！`);
  }else if((name.includes('魔獸')||name.includes('暗影豹')) && Math.random()<statusChance(.22,defender,'poison')){
    addStatus(defender,{type:'poison',turns:3,power:Math.max(4,attacker.attack*.15)});
    addBattleLog(`☠️ ${defender.name}中毒了！`);
  }
}
function actionSummary(result,targetName){
  if(result.type==='miss')return '💨 攻擊落空！';
  if(result.type==='dodge')return `💨 ${targetName}閃避成功！`;
  if(result.type==='parry')return `⚔️ ${targetName}招架成功！`;
  if(result.type==='block')return `🛡️ ${targetName}格擋，只受到 ${result.damage} 點傷害。`;
  let tags='';
  if(result.crit)tags+='💥 致命一擊！';
  if(result.weak)tags+=' WEAK！';
  if(result.resisted)tags+=' 抵抗！';
  return `${tags} ${targetName}受到 ${result.damage} 點傷害！`;
}
async function executeAttack(attackerSide,action){
  const defenderSide=attackerSide==='hero'?'enemy':'hero';
  const attacker=attackerSide==='hero'?battleStateV10.hero:battleStateV10.enemy;
  const defender=defenderSide==='hero'?battleStateV10.hero:battleStateV10.enemy;
  const result=resolveAttack(attacker,defender,action);
  await animateBattleAction(attackerSide,result);
  if(result.damage)setUnitHp(defenderSide,getUnitHp(defenderSide)-result.damage);
  addBattleLog(actionSummary(result,defender.name));
  if(attackerSide==='enemy')maybeApplyEnemyStatus(attacker,defender,result);
  updateBattleStatuses();
  return result;
}
function enemyChooseAction(){
  const e=battleStateV10.enemy;
  const energy=battleStateV10.enemyEnergy;
  if(energy>=30 && e.int>e.str*.9 && Math.random()<.35){
    return {kind:'skill',name:'暗影彈',cost:30,type:'wind',multiplier:1.15};
  }
  if(getUnitHp('enemy')/e.maxHp<.35 && Math.random()<.22)return {kind:'defend',name:'防禦'};
  return {kind:'attack',name:'攻擊',type:'physical',multiplier:1};
}
function applyEnergyForAction(side,action){
  let energy=getUnitEnergy(side);
  if(action.kind==='attack')energy+=10;
  if(action.kind==='defend')energy+=20;
  if(action.kind==='skill'){energy-=Number(action.cost)||0;energy+=Number(action.energyGain)||0;}
  setUnitEnergy(side,energy);
}
async function performAction(side,action){
  const unit=side==='hero'?battleStateV10.hero:battleStateV10.enemy;
  unit.guarding=false;
  if(action.kind==='defend'){unit.guarding=true;addTimedEffect(unit,{name:'防禦姿態',effectType:'buff',turns:1,mods:{damageTaken:-.50}});addBattleLog(`🛡️ ${unit.name}採取防禦姿態！`);applyEnergyForAction(side,action);updateBattleStatuses();return;}
  if(action.kind==='skill'){
    if(getUnitEnergy(side)<action.cost){addBattleLog(`⚡ ${unit.name}能量不足！`);return;}
    addBattleLog(`${action.icon||'✨'} ${unit.name}使用「${action.name}」！`);applyEnergyForAction(side,action);if(side==='hero')recordSkillUsage(action.id);
    if(action.effect){addTimedEffect(unit,{...action.effect,name:action.name});addBattleLog(`${action.name}生效。`);updateBattleStatuses();return;}
    if(side==='hero')return executeHeroAgainstTarget(action);
    return executeAttack(side,action);
  }
  addBattleLog(`⚔️ ${unit.name}攻擊！`);applyEnergyForAction(side,action);if(side==='hero')return executeHeroAgainstTarget(action);return executeAttack(side,action);
}
function setBattleControls(enabled){
  document.querySelectorAll('.battle-action-btn,.battle-choice').forEach(b=>b.disabled=!enabled);
}
function battleInitiativeSpeed(unit,isHero=false){
  const base=effectiveBattleValue(unit,'speed');
  // W8 土匪盜賊保留「第一回合搶先出手」特色，但只行動一次，不再額外偷一回合。
  const firstStrike=(!isHero&&battleStateV10?.round===1&&unit?.monsterId==='human_bandit_rogue'&&!unit.firstStrikeDone)?10000:0;
  return base+firstStrike;
}
function buildRoundInitiativeQueue(){
  const entries=[{side:'hero',unit:battleStateV10.hero,speed:battleInitiativeSpeed(battleStateV10.hero,true),order:0}];
  (battleStateV10.enemies||[]).filter(u=>u.hp>0&&u.alive!==false).forEach((u,i)=>entries.push({side:'enemy',unit:u,speed:battleInitiativeSpeed(u,false),order:i+1}));
  // 每回合開始時就凍結名單：本回合中途召喚出的單位從下一回合才取得行動權。
  return entries.sort((a,b)=>b.speed-a.speed||a.order-b.order);
}
async function runInitiativeRound(heroActionFn){
  const queue=buildRoundInitiativeQueue();
  addBattleLog(`⏱️ 行動順序：${queue.map(x=>`${x.side==='hero'?'🧒':'👹'}${x.unit.name}(${Math.round(effectiveBattleValue(x.unit,'speed'))})`).join(' → ')}`);
  for(const turn of queue){
    if(battleStateV10.ended)return false;
    if(turn.side==='hero'){
      const heroSkip=await tickLiveUnit(battleStateV10.hero,true);if(await checkBattleEnd())return false;
      if(!heroSkip)await heroActionFn();
    }else{
      const u=turn.unit;
      if(u.hp<=0||u.alive===false)continue;
      if(u.monsterId==='human_bandit_rogue'&&battleStateV10.round===1&&!u.firstStrikeDone){u.firstStrikeDone=true;addBattleLog('🗡️ 土匪盜賊速度壓制，第一回合搶先行動！');}
      await performLiveEnemyTurn(u);
    }
    if(await checkBattleEnd())return false;
    await battleSleep(turn.side==='hero'?250:220);
  }
  return true;
}
async function battlePlayerAction(action){
  if(!battleStateV10||battleStateV10.busy||battleStateV10.ended)return;
  if(action.kind==='skill'&&battleStateV10.heroEnergy<action.cost){addBattleLog('⚡ 能量不足！');return;}
  if(!selectedBattleEnemy()){addBattleLog('沒有可攻擊的目標。');return;}
  battleStateV10.busy=true;setBattleControls(false);hideBattleSubmenu();battleStateV10.round++;
  const banner=document.getElementById('battleRoundBanner');if(banner)banner.textContent=`ROUND ${battleStateV10.round}`;
  const completed=await runInitiativeRound(()=>performAction('hero',action));
  if(!completed||battleStateV10.ended)return;
  battleStateV10.busy=false;setBattleControls(true);renderBattleTargets();updateBattleStatuses();
}

function makeLiveEnemy(monsterId,power,eventType='daily',opts={}){

  const statEventType=(def.boss||opts.isBoss) && eventType==='daily' ? 'midterm' : eventType;

    const h=makeHeroBattleStats();

  // V10.10.28：後期 Power 曲線已修正，Final Boss 額外倍率由 1.75 校回 1.35，避免重複灌血；召喚物不吃此倍率。
  const finalBossHpScale=(!opts.isSummon && def.finalBoss)?1.35:1;
  const hpScale=Number(opts.hpScale??scale)*finalBossHpScale;
  // V10.10.19：怪物原本不分物理/魔法職能，Boss 旗標也只增加 HP，
  // 造成死靈法師/魔王等純法系怪 MATK 過低，遇到玩家 MDEF 後常被公式壓到最低 1 傷害。
  // 不改技能倍率，改由技能組判斷施法者職能，給法系怪合理的 MATK 底盤。
  const aiProfile=MONSTER_AI_DATABASE[monsterId]||{};

  if(Array.isArray(aiProfile.rotation))aiProfile.rotation.forEach(id=>{const sk=MONSTER_SKILL_DATABASE[id];if(sk)aiSkillDefs.push(sk);});
  const magicSkillCount=aiSkillDefs.filter(sk=>sk.kind==='magic').length;

  let attackRoleScale=1,magicRoleScale=1;
  if(isMagicCaster){
    magicRoleScale=bossLike?1.55:1.30;
    attackRoleScale=.90;
  }
  // 明確純法系 Boss 再確保最低職能倍率；技能本身仍維持原本 1.0 / 1.35 等資料。
  if(monsterId==='demon_king_phase1'||monsterId==='demon_king_phase2')magicRoleScale=Math.max(magicRoleScale,1.60);
  if(monsterId==='necromancer')magicRoleScale=Math.max(magicRoleScale,1.35);
  const u={...base,uid:opts.uid||`${monsterId}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,monsterId,name:opts.name||def.name,
    maxHp:Math.max(1,Math.round(base.maxHp*hpScale)),hp:0,alive:true,isBoss:!!(opts.isBoss??def.boss),isSummon:!!opts.isSummon,summonedBy:opts.summonedBy||null,
    attack:base.attack*scale*attackRoleScale,magicAttack:base.magicAttack*scale*magicRoleScale,defense:base.defense*scale,magicDefense:base.magicDefense*scale,speed:base.speed*scale,
    statuses:[],skillUses:{},cooldowns:{},chargedSkill:null,rotationIndex:0,reviveUsed:false,turnsTaken:0};

  return u;
}

function battleIconForEnemy(evt,monster){
  if(evt?.type==='final')return '🐉';
  if(evt?.type==='midterm')return '👿';
  const n=(monster?.name||'').toLowerCase();
  if(n.includes('史萊姆'))return '🟢';
  if(n.includes('哥布林'))return '👺';
  if(n.includes('獸人'))return '👹';
  if(n.includes('骷髏'))return '💀';

  return '👹';
}

        ? `<div class="small good">本次：${todayRec.score}/${todayRec.scoreMax}｜${todayRec.scoreGrade||''}</div>`+
          ((t.allowCorrection&&!todayRec.corrected)
            ? `<div class="quantity-box"><input id="corr_${t.id}" type="number" min="0" max="${t.scoreMax||100}" placeholder="訂正後分數"><button class="btn purple" onclick="correctScoreTask('${t.id}','${todayRec.id}')">完成訂正</button></div>`
            : (todayRec.corrected?`<div class="small purple">✨ 已訂正：${todayRec.correctedScore}/${todayRec.scoreMax}</div>`:''))
        : `<div class="quantity-box"><input id="score_${t.id}" type="number" inputmode="numeric" min="0" max="${t.scoreMax||100}" placeholder="輸入分數 / ${t.scoreMax||100}"><button class="btn" onclick="completeScoreTask('${t.id}')">送出成績</button></div>`;
    }else{
      action=`<button class="btn big-battle-btn" ${count>=t.dailyLimit?'disabled':''} onclick="completeSimpleTask('${t.id}')">${count>=t.dailyLimit?'今天完成了':'完成！'}</button>`;
    }

    html+=`<div class="card">
      <span class="task-type-badge">${typeLabel}</span><br>
      <strong style="font-size:18px">${t.name}</strong>
      <div class="small purple">${[t.subject,t.progressValue].filter(Boolean).join('｜')}</div>
      <div style="margin:8px 0">
        <span class="pill">💰 ${t.goldReward}</span>
        <span class="pill">⭐ ${t.expReward}</span>
      </div>
      ${type==='timer'
        ?(t.rewardMode==='auto'
          ?`<div class="small good">🌱 ${rewardText(autoTaskRewards(t.category,t.difficulty,t.taskType))}｜🌟 ≤${t.fastMinutes||30}分：金幣/EXP ×1.5＋敏捷+2｜✨ ≤${t.standardMinutes||60}分：×1.2＋敏捷+1</div>`
          :`<div class="small">${(t.statRules||[]).map(r=>`≤${r.maxMinutes}分：${statName(r.stat)}+${r.value}`).join(' ｜ ')}</div>`)
        :(t.rewardMode==='auto'
          ?`<div class="small good">🌱 ${rewardText(autoTaskRewards(t.category,t.difficulty,t.taskType))}${type==='quantity'?`｜目標 ${t.quantityTarget||1} ${t.quantityUnit||'次'}`:type==='score'?`｜滿分 ${t.scoreMax||100} 分`:''}</div>`
          :`<div class="small">${statName(t.fixedStat||'will')} +${t.fixedStatValue||0}${type==='quantity'?`｜目標 ${t.quantityTarget||1} ${t.quantityUnit||'次'}`:type==='score'?`｜滿分 ${t.scoreMax||100} 分`:''}</div>`)
      }
      ${action}
    </div>`;
  });
  document.getElementById('panel-tasks').innerHTML=html;
}

let dungeonIdleTimer=null;
function monsterAssetKey(monster,evt){
  const s=((evt?.name||monster?.name||'')+'').toLowerCase();
  if(s.includes('史萊姆')||s.includes('slime'))return 'slime';
  return null;
}
function dungeonHeroIdleFrames(){return heroIdleFrames();}
function dungeonEnemyIdleFrames(monster,evt){
  const key=monsterAssetKey(monster,evt);
  if(key==='slime')return [1,2,3,4].map(n=>sprite(`images/slime_idle_${n}.png`));
  return [];
}
function startDungeonIdleAnimation(monster,evt){
  if(dungeonIdleTimer)clearInterval(dungeonIdleTimer);
  const h=document.getElementById('dungeonHeroIdle'),e=document.getElementById('dungeonEnemyIdle');
  const hf=dungeonHeroIdleFrames(),ef=dungeonEnemyIdleFrames(monster,evt);let i=0;
  if(h)h.src=hf[0]; if(e&&ef.length)e.src=ef[0];
  dungeonIdleTimer=setInterval(()=>{i=(i+1)%4;if(h)h.src=hf[i];if(e&&ef.length)e.src=ef[i];},260);
}

function gmAddShopItem(){ensureItemSystem();const name=document.getElementById('gmShopName')?.value.trim();if(!name){alert('請輸入商品名稱');return;}const category=document.getElementById('gmShopCategory')?.value||'coupon';const item={id:uid(),name,icon:category==='equipment'?'🛡️':category==='consumable'?'🧪':category==='coupon'?'🎟️':'✨',category,description:document.getElementById('gmShopDesc')?.value.trim()||'',price:Number(document.getElementById('gmShopPrice')?.value)||0,dailyLimit:Math.max(1,Number(document.getElementById('gmShopLimit')?.value)||1),active:true,stats:{}};if(category==='equipment'){item.equipSlot=document.getElementById('gmEquipSlot')?.value||'weapon';const k=document.getElementById('gmEquipStat')?.value||'attack';let v=Number(document.getElementById('gmEquipValue')?.value)||0;if(['crit','evade','block'].includes(k))v/=100;item.stats[k]=v;}if(category==='consumable'){item.subtype='battle';item.battleConsumable=true;item.effectType=document.getElementById('gmEffectType')?.value||'poison';item.effectValue=Number(document.getElementById('gmEffectValue')?.value)||0;item.effectTurns=item.effectType==='poison'?3:0;}gameData.shopItems.push(item);saveGame();renderAll();}

// 掉落：評分越高越偏向裝備／商品，不再幾乎只看到金幣。
function rollDungeonDrop(rating=1){ensureItemSystem();const book=maybeDropSkillBook(rating===3?.14:rating===2?.06:.02,'每日戰鬥掉落');if(book)return book;if(rating===3&&Math.random()<.10){gameData.hero.lotteryCoins+=1;return {type:'lottery',label:'稀有抽獎幣 ×1',value:1};}const roll=Math.random();const itemChance=rating===3?.72:rating===2?.50:.28;if(roll<itemChance){const pool=gameData.shopItems.filter(x=>x.active&&['equipment','consumable','coupon'].includes(itemCategory(x)));if(pool.length){const weighted=pool.flatMap(i=>Array(itemCategory(i)==='equipment'?(rating===3?4:2):itemCategory(i)==='consumable'?3:2).fill(i));const item=weighted[Math.floor(Math.random()*weighted.length)];gameData.inventory.push({id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'dungeon'});return {type:itemCategory(item),label:`${item.icon||'🎁'} ${item.name}`,value:item.id};}}const amount=rating===3?5+Math.floor(Math.random()*6):rating===2?3+Math.floor(Math.random()*3):1+Math.floor(Math.random()*3);gameData.hero.gold+=amount;return {type:'gold',label:`金幣 +${amount} G`,value:amount};}

// 裝備能力實際套入戰鬥數值。
const __makeHeroBattleStatsV10109=makeHeroBattleStats;
makeHeroBattleStats=function(){const u=__makeHeroBattleStatsV10109();const e=totalEquipmentStats();u.attack+=e.attack;u.magicAttack+=e.magicAttack;u.defense+=e.defense;u.magicDefense+=e.magicDefense;u.speed+=e.speed;u.maxHp+=e.maxHp;u.maxEnergy+=e.maxEnergy;u.crit=clampBattle(u.crit+e.crit,.05,.60);u.evade=clampBattle(u.evade+e.evade,.02,.50);u.block=clampBattle(u.block+e.block,.05,.45);return u;};

function addSemesterEvent(){
  const date=document.getElementById('gmSemEventDate').value;
  if(!date){alert('請先選日期');return;}
  const type=document.getElementById('gmSemEventType').value;
  const name=document.getElementById('gmSemEventName').value.trim()||type;
  gameData.semester.events.push({id:uid(),date,type,name});
  // 同步既有 events，Boss 仍沿用現有事件系統
  if(['midterm','final'].includes(type) && !gameData.events.some(e=>e.date===date&&e.type===type)){
    gameData.events.push({id:uid(),date,type,name,power:0,rewardGold:type==='final'?200:120,rewardExp:type==='final'?220:140,active:true});
  }
  saveGame();renderGM();
}

// V10.10.27：GM週數測試必須走和正式事件相同的期中／期末 Power 公式。
// 過去所有週五 boss 都被誤當 midterm，但 Power 又只走週數曲線，造成「標籤是 Boss、強度卻不是考試 Boss」。
function gmTestDateForWeekDay(week,dayIndex=0){
  const start=dateOnlyBattle(gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE);
  if(!start)return today();
  const d=new Date(start);
  d.setDate(d.getDate()+Math.max(0,week-1)*7+Math.max(0,Math.min(4,Number(dayIndex)||0)));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function deterministicVarianceForDate(dateStr){
  const s=String(dateStr||today()).replaceAll('-','');
  let n=0;for(const ch of s)n=(n*31+ch.charCodeAt(0))%997;
  return ((n/996)*2-1)*SEMESTER_BALANCE.dailyVariance;
}
function gmTestEncounterInfo(week,dayIndex=0,mon=null){
  const date=gmTestDateForWeekDay(week,dayIndex);
  const evt=(gameData.events||[]).find(e=>e.active!==false&&e.date===date&&(e.type==='midterm'||e.type==='final'));
  let eventType='daily';
  if(mon?.finalBoss||mon?.examBoss==='final_day1'||mon?.examBoss==='final_day2')eventType='final';
  else if(evt?.type==='final'||evt?.type==='midterm')eventType=evt.type;
  return {date,eventType,evt};
}
function gmWeekTestPower(week,dayIndex=0,mon=null){
  const info=gmTestEncounterInfo(week,dayIndex,mon);
  let basePower;
  if(info.eventType==='midterm'||info.eventType==='final'){
    // 若正式事件有人工指定 Power，測試器尊重該值；否則用正式考試公式。
    if(info.evt&&Number(info.evt.power)>0){
      basePower=Number(info.evt.power);
    }else{
      const expected=Math.max(SEMESTER_BALANCE.minPower,expectedSemesterPowerAt(info.date));
      const diff=SEMESTER_BALANCE.difficultyMultipliers.normal;
      const evtMult=SEMESTER_BALANCE.eventMultipliers[info.eventType]||1;
      basePower=Math.max(SEMESTER_BALANCE.minPower,Math.round(expected*diff*evtMult*(1+deterministicVarianceForDate(info.date))));
    }
  }else{
    const cfg=DUNGEON_GROWTH_CONFIG||{firstWeekBase:40,weeklyGrowth:.16,minPower:32};
    const weeklyBase=(cfg.firstWeekBase||40)*Math.pow(1+(cfg.weeklyGrowth||.16),Math.max(0,week-1));
    basePower=Math.max(cfg.minPower||1,Math.round(weeklyBase*weeklyEncounterFactor(dayIndex)));
  }
  return Math.max(1,Math.round(basePower*currentBattleTestMultiplier()));
}
function gmStartWeekBattleTest(){
