  const map=WEEKLY_MAP_DATABASE.find(x=>x.week===w);if(!map||map.noBattle){alert('這一週沒有戰鬥。');return;}
  const monsterId=map.monsters?.[d],mon=monsterDefinitionById(monsterId);if(!mon){alert('找不到這隻怪物的資料。');return;}
  sessionStorage.setItem('gmTestWeek',String(w));sessionStorage.setItem('gmTestDay',String(d));
  const encounter=gmTestEncounterInfo(w,d,mon),eventType=encounter.eventType,power=gmWeekTestPower(w,d,mon),heroMode=document.getElementById('gmTestHeroMode')?.value||'standard';
  const testHero=gmBuildTestHero(w,heroMode);
  const iconEvt=eventType==='daily'?null:{type:eventType};
  runBattleSequence(mon.name,battleIconForEnemy(iconEvt,mon),power,0,0,eventType,monsterId,{testMode:true,testWeek:w,testDay:d,testHero});
  const formulaLabel=eventType==='final'?`期末公式 ×${SEMESTER_BALANCE.eventMultipliers.final}`:eventType==='midterm'?`期中公式 ×${SEMESTER_BALANCE.eventMultipliers.midterm}`:'週數日常公式';
  addBattleLog(`🧪 GM測試模式：第${w}週 ${['一','二','三','四','五'][d]}｜模擬日期 ${encounter.date}｜${formulaLabel}｜Power ${power}｜敵HP ${battleStateV10?.enemy?.maxHp||'-'}｜不寫入正式進度與獎勵。`);
}
function gmSetBattleTestMultiplier(v){
  gameData.settings.battleTestMultiplier=Number(v)||1;
  saveGame();
  renderAll();
}
function currentBattleTestMultiplier(){
  return Number(gameData.settings?.battleTestMultiplier)||1;
}

function gmResetDungeonChallenge(){
  ensureDailyDungeon();gameData.dailyDungeon.challenged=false;gameData.dailyDungeon.result=null;gameData.dailyDungeon.drop=null;
  saveGame();renderAll();renderGM();alert('已重置今日副本挑戰，可以再次測試。');
}
function pct(v){return (Number(v||0)*100).toFixed(1)+'%';}
function battleDebugCard(title,u){return `<div class="battle-debug-card"><b>${title}</b><br>HP ${u.maxHp}　Energy ${u.maxEnergy}<br>ATK ${u.attack.toFixed(1)}　MATK ${u.magicAttack.toFixed(1)}<br>DEF ${u.defense.toFixed(1)}　MDEF ${(u.magicDefense||0).toFixed(1)}　SPD ${u.speed.toFixed(1)}<br>CRIT ${pct(u.crit)}　EVA ${pct(u.evade)}<br>PARRY ${pct(u.parry)}　BLOCK ${pct(u.block)}<br>Status RES ${pct(u.statusRes)}　Base Element RES ${pct(u.elementalBaseRes)}<br>🔥 ${pct(totalElementRes(u,'fire'))}　❄️ ${pct(totalElementRes(u,'ice'))}　⚡ ${pct(totalElementRes(u,'lightning'))}　🌪️ ${pct(totalElementRes(u,'wind'))}<br>☠️毒特殊抗性 ${pct(u.resist?.poison||0)}　🌀詛咒特殊抗性 ${pct(u.resist?.curse||0)}</div>`;}

function gmShowJobDebug(){
  const box=document.getElementById('gmJobDebug');if(!box)return;
  const c=currentJobCandidate(),weeks=c?stableCandidateWeeks(c.name):0;
  box.innerHTML=`<div class="battle-debug-card"><b>目前職業：${gameData.hero.jobAwakened?gameData.hero.heroClass:'見習勇者'}</b><br>
  觀察期：至少 ${JOB_AWAKEN_CONFIG.observationDays} 天＋${JOB_AWAKEN_CONFIG.minTaskRecords} 筆任務。<br>
  複合職優先；雙核心各至少20%，平衡度70%。純職核心占比至少32%。<br>
  目前候選：${c?.name||'尚未形成'}｜穩定 ${weeks}/${JOB_AWAKEN_CONFIG.stableWeeks} 週<br>
  七職：戰士（力）／法師（智）／牧師（美德）／獵人（敏+智）／盜賊（敏+力）／聖騎士（力+美德）／魔劍士（力+智）<br>
  技能偏好（最終排序25%）：奮力一擊 ${gameData.hero.skillUsage?.power_strike||0}｜魔力彈 ${gameData.hero.skillUsage?.ember||0}｜防禦姿態 ${gameData.hero.skillUsage?.defense_stance||0}｜專注 ${gameData.hero.skillUsage?.focus||0}</div>`;
}

function gmShowGrowthCurve(){
  const ti=todayEffectiveTaskLoad();
  return `第${semesterProgressWeek()}週｜今日有效任務 ${ti.count} 項／負荷 ${ti.load}｜${isNonSchoolDay()?'假日模式':'平日模式'}｜AUTO怪戰力 ${calibratedDailyMonsterPower()}｜測試倍率 ${Math.round(currentBattleTestMultiplier()*100)}%`;
}

function gmShowBattleDebug(){
  ensureDailyDungeon();
  const evt=gameData.dailyDungeon.eventId?gameData.events.find(e=>e.id===gameData.dailyDungeon.eventId):null;
  const monster=evt?null:(gameData.dailyDungeon.monsterId==='AUTO'?{name:gameData.dailyDungeon.generatedName||generatedMonsterName(),difficulty:'normal'}:gameData.monsters.find(x=>x.id===gameData.dailyDungeon.monsterId));
  const name=evt?evt.name:(monster?.name||'怪物'),power=Math.round(resolvedDungeonPower(evt,monster)*currentBattleTestMultiplier());
  const h=makeHeroBattleStats(),e=deriveEnemyStats(power,name,evt?.type||'daily'),box=document.getElementById('gmBattleDebug');
  if(box)box.innerHTML=`<div class="small" style="margin-bottom:8px">${gmShowGrowthCurve()}</div><div class="battle-debug-grid">${battleDebugCard('🧒 '+gameData.hero.name,h)}${battleDebugCard('👹 '+name,e)}</div>`;
}

function gmAddMonster(){
  const name=document.getElementById('gmMonName').value.trim();
  if(!name){alert('請輸入怪物名稱');return;}
  gameData.monsters.push({
    id:uid(),name,power:Number(document.getElementById('gmMonPower').value)||1,
    rewardGold:Number(document.getElementById('gmMonGold').value)||0,
    rewardExp:Number(document.getElementById('gmMonExp').value)||0,active:true
  });
  saveGame();renderAll();
}
function gmAddEvent(){
  const date=document.getElementById('gmEventDate').value;
  const type=document.getElementById('gmEventType').value;
  let name=document.getElementById('gmEventName').value.trim();
  if(!date){alert('請選日期');return;}
  if(!name)name=type==='final'?'學期終焉之龍':'期中大魔王';
  gameData.events.push({
    id:uid(),date,type,name,
    power:Number(document.getElementById('gmEventPower').value)||100,
    rewardGold:Number(document.getElementById('gmEventGold').value)||0,
    rewardExp:Number(document.getElementById('gmEventExp').value)||0,
    active:true
  });
  if(date===today())gameData.dailyDungeon={date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''};
  saveGame();renderAll();
}
function deleteEvent(id){
  if(confirm('刪除此考試事件？')){
    gameData.events=gameData.events.filter(x=>x.id!==id);
    if(gameData.dailyDungeon.eventId===id)gameData.dailyDungeon={date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''};
    saveGame();renderAll();
  }
}
function gmAddGold(n){gameData.hero.gold+=n;saveGame();renderAll();}
function gmAddLotteryReward(){
  const label=(document.getElementById('gmLotteryLabel')?.value||'').trim();if(!label){alert('請輸入獎項名稱');return;}
  gameData.lotteryPool.push({id:uid(),label,weight:Math.max(1,Number(document.getElementById('gmLotteryWeight')?.value)||1),stock:Math.max(0,Number(document.getElementById('gmLotteryStock')?.value)||0),active:true});
  saveGame();renderAll();
}
function gmDeleteLotteryReward(id){
  if(!confirm('刪除此抽獎獎項？'))return;
  gameData.lotteryPool=gameData.lotteryPool.filter(x=>x.id!==id);saveGame();renderAll();
}

function gmAddLotteryCoin(n){gameData.hero.lotteryCoins+=n;saveGame();renderAll();}
function resetAll(){
  if(confirm('確定清除全部資料？此動作無法復原。')){
    localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(FAMILY_KEY);sessionStorage.removeItem('activeHeroProfile');location.reload();
  }
}
function renderAll(){
  repairRuntimeData();
  const jobs=[
    ['狀態',renderHero],['任務',renderTasks],['副本',renderDungeon],
    ['商店',renderShop],['抽獎',renderLottery],['背包',renderBag],['家長後台',renderGM]
  ];
  for(const [name,fn] of jobs){
    try{fn();}
    catch(e){
      console.error(`Render ${name} failed`,e);
      const panelMap={'狀態':'hero','任務':'tasks','副本':'dungeon','商店':'shop','抽獎':'lottery','背包':'bag','家長後台':'gm'};
      const el=document.getElementById('panel-'+panelMap[name]);
      if(el)el.innerHTML=`<div class="card bad"><strong>⚠️ ${name}載入失敗</strong><div class="small">${String(e?.message||e)}</div></div>`;
    }
  }
  startLiveTimer();startStatusClock();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTasks();startLiveTimer();}});
function ensureHolidayTower(){
  if(!gameData.holidayTower)gameData.holidayTower={date:today(),runsUsed:0,bestFloor:0};
  if(gameData.holidayTower.date!==today())gameData.holidayTower={date:today(),runsUsed:0,bestFloor:gameData.holidayTower.bestFloor||0};
}
function towerRunsLeft(){ensureHolidayTower();return Math.max(0,(gameData.settings?.holidayTower?.dailyLimit||3)-gameData.holidayTower.runsUsed);}

function boot(){
  if(!gameData.hero.name){
    document.getElementById('heroSetup').style.display='block';
    document.getElementById('mainUI').style.display='none';
  }else{
    document.getElementById('heroSetup').style.display='none';
    document.getElementById('mainUI').style.display='block';
    ensureDailyDungeon();renderAll();setTimeout(()=>{refreshAutoRewardPreview();toggleRewardMode();updateTimerModeLabels();},0);
  }
}
boot();
</script>

<script type="module">
let fb=null,auth=null,db=null,currentUser=null,saving=false;

async function initFirebase(){
  const c=gameData.settings?.cloud;
  if(!c?.enabled)return false;
  try{
    const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const fsMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    fb={appMod,authMod,fsMod};
    const app=appMod.initializeApp({
      apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,
      storageBucket:c.storageBucket,messagingSenderId:c.messagingSenderId,appId:c.appId
    });
    auth=authMod.getAuth(app); db=fsMod.getFirestore(app);
    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      if(user){
        const s=document.getElementById('cloudStatus');
        if(s)s.textContent='☁️ 已登入：'+(user.email||'匿名使用者');
        await pullCloud();
      }
    });
    return true;
  }catch(e){console.error(e);alert('Firebase 初始化失敗：'+e.message);return false;}
}
async function pullCloud(){
  if(!currentUser||!db)return;
  const {doc,getDoc}=fb.fsMod;
  const ref=doc(db,'users',currentUser.uid,'seasons',CURRENT_SEASON_ID);
  const snap=await getDoc(ref);
  if(snap.exists()){
    const payload=snap.data();
    const localCfg=gameData.settings?.cloud;
    if(payload?.familyData?.profiles?.length){
      familyData=payload.familyData;
      activeProfileId=familyData.profiles.some(p=>p.id===activeProfileId)?activeProfileId:(familyData.activeProfileId||familyData.profiles[0].id);
      gameData=getActiveProfile().data;migrateProfileData(gameData);
    }else if(payload?.gameData){
      gameData=payload.gameData;migrateProfileData(gameData);
      familyData={version:8,activeProfileId:'hero_1',profiles:[{id:'hero_1',label:gameData.hero.name||'勇者 1',data:gameData}]};
      activeProfileId='hero_1';
    }
    if(payload?.familyData||payload?.gameData){
      if(!gameData.settings)gameData.settings={parentPinHash:'',cloud:{}};
      gameData.settings.cloud=localCfg||gameData.settings.cloud||{};
      persistFamily();boot();
    }
  }else await pushCloud();
}
async function pushCloud(){
  if(!currentUser||!db||saving)return;
  saving=true;
  try{
    const {doc,setDoc,serverTimestamp}=fb.fsMod;
    persistFamily();
    const clone=JSON.parse(JSON.stringify(familyData));
    await setDoc(doc(db,'users',currentUser.uid,'seasons',CURRENT_SEASON_ID),{familyData:clone,updatedAt:serverTimestamp()},{merge:true});
  }catch(e){console.error(e);}
  finally{saving=false;}
}
window.cloudSaveGame=()=>{if(currentUser)pushCloud();};
window.firebaseAnonymousLogin=async()=>{
  if(!fb){const ok=await initFirebase();if(!ok)return;}
  try{
    if(auth.currentUser)return;
    await fb.authMod.signInAnonymously(auth);
    alert('已建立匿名雲端身份，可以直接開始使用。');
  }catch(e){alert('匿名登入失敗：'+e.message);}
};
window.firebaseGoogleLogin=async()=>{
  if(!fb){const ok=await initFirebase();if(!ok)return;}
  try{
    const provider=new fb.authMod.GoogleAuthProvider();
    const result=await fb.authMod.signInWithPopup(auth,provider);
    const user=result.user;
    const access=ensureFamilyAccessModel();
    if(!access.ownerUid){
      access.ownerUid=user.uid;
      access.members[user.uid]={role:'owner',email:user.email||'',displayName:user.displayName||'家長'};
      persistFamily();
    }else if(!access.members[user.uid]){
      // 未被邀請者不自動取得管理權；先保留登入身份。
      access.members[user.uid]={role:'viewer',email:user.email||'',displayName:user.displayName||'家長'};
      persistFamily();
    }
    alert('Google 登入成功');
    renderAll();
  }catch(e){alert('Google 登入失敗：'+e.message);}
};
window.cloudSaveGame=()=>{if(currentUser)pushCloud();};
if(gameData.settings?.cloud?.enabled)initFirebase();</script>
