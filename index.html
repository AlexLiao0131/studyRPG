<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小學勇者大冒險 V6</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--card:#21262d;--border:#30363d;
  --gold:#f0883e;--blue:#58a6ff;--green:#3fb950;--purple:#bc8cff;
  --pink:#ff7b72;--text:#c9d1d9;--bright:#f0f6fc;--muted:#8b949e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;padding:12px}
.app{max-width:920px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 10px 32px #0008}
h1,h2,h3{color:var(--gold);margin:8px 0 14px}
h1{text-align:center;font-size:24px}
h2{font-size:18px}
h3{font-size:15px}
.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 18px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 6px;border-radius:8px;font-weight:700;cursor:pointer}
.tab.active{background:var(--gold);color:#111}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0d1117;border-left:4px solid var(--blue);padding:9px;border-radius:7px}
button{border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
.btn{background:#238636;color:#fff}.btn.blue{background:#1f6feb}.btn.red{background:#da3633}.btn.gray{background:#30363d;color:#fff}.btn.gold{background:var(--gold);color:#111}.btn.purple{background:#8957e5;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;background:#0d1117;color:var(--bright);border:1px solid var(--border);border-radius:7px;padding:10px;margin:5px 0 10px}
label{font-size:12px;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:var(--muted)}
.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--pink)}.purple{color:var(--purple)}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#0d1117;border:1px solid var(--border);font-size:11px;margin:2px}
.progress{height:10px;background:#0d1117;border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.progress>div{height:100%;background:var(--green)}
.boss{border:2px solid var(--pink);box-shadow:0 0 20px #ff7b7233}
.dragon{border:2px solid var(--purple);box-shadow:0 0 24px #bc8cff33}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

.hero-scene{
  position:relative;
  height:260px;
  overflow:hidden;
  border:2px solid #3d444d;
  border-radius:12px;
  background:#101826;
  image-rendering:pixelated;
}
.sky-layer{
  position:absolute;inset:0;
  background:
    linear-gradient(#20304a 0 48%,#354b3e 48% 65%,#253226 65% 100%);
}
.mountain-layer{
  position:absolute;left:0;right:0;bottom:74px;height:92px;
  opacity:.9;
  background:
    linear-gradient(135deg,transparent 0 34%,#314154 34% 51%,transparent 51% 100%) 0 0/180px 90px repeat-x,
    linear-gradient(45deg,transparent 0 35%,#263747 35% 53%,transparent 53% 100%) 80px 16px/220px 80px repeat-x;
  animation:scrollMountains 18s linear infinite;
}
.ground-layer{
  position:absolute;left:0;right:0;bottom:0;height:78px;
  background:
    repeating-linear-gradient(90deg,#24351f 0 18px,#2e4427 18px 34px,#20301d 34px 52px);
  border-top:6px solid #47663b;
  animation:scrollGround 2.6s linear infinite;
}
.pixel-cloud{
  position:absolute;width:84px;height:18px;background:#d8e5e8;opacity:.8;
  box-shadow:16px -10px 0 #d8e5e8,36px -5px 0 #d8e5e8;
  animation:cloudMove 24s linear infinite;
}
.pixel-cloud.c1{top:38px;left:-100px}
.pixel-cloud.c2{top:72px;left:-240px;animation-duration:31s;transform:scale(.7)}
@keyframes scrollMountains{from{background-position:0 0,80px 16px}to{background-position:-360px 0,-360px 16px}}
@keyframes scrollGround{from{background-position:0 0}to{background-position:-104px 0}}
@keyframes cloudMove{from{transform:translateX(0)}to{transform:translateX(1100px)}}
.warrior-wrap{
  position:absolute;left:50%;bottom:42px;transform:translateX(-50%);
  animation:warriorBob .58s steps(2,end) infinite;
  filter:drop-shadow(0 8px 0 rgba(0,0,0,.28));
}
@keyframes warriorBob{
  0%,100%{margin-bottom:0}
  50%{margin-bottom:5px}
}
.pixel-warrior{
  position:relative;width:96px;height:142px;
  image-rendering:pixelated;
}

.hero-sprite{
  display:block;
  width:160px;
  height:160px;
  object-fit:contain;
  image-rendering:pixelated;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
.px{position:absolute;background:#999}
.helm{left:30px;top:6px;width:42px;height:12px;background:#aeb6bf;box-shadow:6px -6px 0 #c6ced7,-6px 6px 0 #818b96,36px 8px 0 #707a86}
.face{left:34px;top:24px;width:34px;height:28px;background:#d8a16f;box-shadow:0 10px 0 #c98d5e}
.eye{left:56px;top:32px;width:6px;height:6px;background:#18202b}
.body{left:30px;top:54px;width:42px;height:48px;background:#596877;box-shadow:6px 8px 0 #6f7f90,-6px 8px 0 #445260}
.belt{left:28px;top:94px;width:48px;height:8px;background:#6b4a2c}
.arm-l{left:18px;top:58px;width:12px;height:44px;background:#596877;transform:rotate(8deg)}
.arm-r{left:72px;top:58px;width:12px;height:44px;background:#596877;transform:rotate(-8deg)}
.hand-l{left:14px;top:94px;width:12px;height:12px;background:#d8a16f}
.hand-r{left:80px;top:94px;width:12px;height:12px;background:#d8a16f}
.leg-l{left:32px;top:102px;width:14px;height:34px;background:#303b48;transform:rotate(3deg)}
.leg-r{left:56px;top:102px;width:14px;height:34px;background:#303b48;transform:rotate(-3deg)}
.boot-l{left:26px;top:132px;width:24px;height:10px;background:#171d24}
.boot-r{left:54px;top:132px;width:24px;height:10px;background:#171d24}
.sword{left:4px;top:62px;width:8px;height:54px;background:#cdd8e2;transform:rotate(-16deg);box-shadow:0 -10px 0 #ecf4f8}
.guard{left:0;top:105px;width:24px;height:6px;background:#b88635;transform:rotate(-16deg)}
.scene-hud{
  position:absolute;left:10px;right:10px;top:10px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.hud-chip{
  background:rgba(8,12,18,.78);border:1px solid #56606b;border-radius:8px;
  padding:6px 9px;color:#fff;font-weight:800;font-size:13px;
}
.xp-wrap{margin-top:10px}
.xp-label{display:flex;justify-content:space-between;font-size:12px;color:#d7dde5;margin-bottom:5px}
.xp-bar{
  height:18px;background:#15191f;border:2px solid #59616d;border-radius:4px;
  box-shadow:inset 0 0 0 2px #07090c;overflow:hidden;
}
.xp-fill{
  height:100%;
  background:linear-gradient(#8f46db,#6a2cb7);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18);
  transition:width .3s ease;
}
.kid-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px
}
.kid-box{
  background:#11161d;border:1px solid #30363d;border-radius:9px;padding:10px;text-align:center;
  font-size:14px;font-weight:800
}



.balance-box{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;margin:10px 0}
.balance-good{border-left:5px solid #3fb950}
.balance-warn{border-left:5px solid #d29922}
.balance-bad{border-left:5px solid #f85149}
.balance-title{font-weight:900;font-size:15px;margin-bottom:5px}
.balance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}
.balance-cell{background:#161b22;border-radius:7px;padding:8px;font-size:12px}
.gm-money-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gm-money-row button{min-height:44px}
.audit-row{padding:8px 0;border-bottom:1px solid #30363d;font-size:12px}

.status-clock{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:10px;padding:10px 12px;border:1px solid #30363d;
  border-radius:10px;background:#11161d
}
.status-date{font-size:14px;font-weight:800;color:#c9d1d9}
.status-time{font-size:24px;font-weight:1000;color:#f0f6fc;letter-spacing:1px}
.ability-btn{
  width:100%;margin-top:10px;min-height:48px;font-size:16px;
  background:#30363d;color:#f0f6fc;border:1px solid #59616d
}
.ability-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;
  align-items:center;justify-content:center;padding:18px;z-index:9999
}
.ability-panel{
  width:min(430px,100%);background:#161b22;border:2px solid #59616d;
  border-radius:14px;padding:18px;box-shadow:0 18px 48px #000a
}
.ability-row{
  display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:11px 4px;border-bottom:1px solid #30363d;font-size:18px;font-weight:800
}
.stat-rise{color:#3fb950;font-size:13px;min-width:34px;text-align:right}
.task-type-badge{
  display:inline-block;font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px;
  background:#11161d;border:1px solid #3d444d;margin-bottom:6px
}
.quantity-box{
  display:flex;gap:8px;align-items:center;margin-top:10px
}
.quantity-box input{margin:0;min-width:0}
.gm-type-settings{padding:10px;background:#0d1117;border-radius:9px;margin:8px 0 12px}

.parent-lock{max-width:420px;margin:18px auto;padding:18px;background:#11161d;border:2px solid #3d444d;border-radius:12px;text-align:center}
.parent-lock input{font-size:22px;text-align:center;letter-spacing:5px}
.timeline{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px 2px 4px}
.timeline-node{min-width:92px;text-align:center;padding:8px;border-radius:9px;background:#11161d;border:1px solid #30363d}
.timeline-node.current{border-color:#f0883e;box-shadow:0 0 0 2px #f0883e33}
.timeline-node .icon{font-size:28px}.timeline-node .date{font-size:11px;color:#8b949e}
.timeline-line{height:3px;min-width:24px;background:#39414b;border-radius:999px}
.cloud-status{padding:8px;border-radius:8px;background:#0d1117;border:1px solid #30363d;font-size:12px}
.battle-stage{
  display:grid;
  grid-template-columns:1fr 86px 1fr;
  align-items:center;
  gap:10px;
  margin:12px 0;
}
.fighter-card{
  background:#11161d;
  border:2px solid #30363d;
  border-radius:12px;
  padding:12px 8px;
  text-align:center;
  min-width:0;
}
.fighter-icon{
  height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:68px;
  line-height:1;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));
}
.fighter-name{
  font-size:14px;
  font-weight:900;
  margin-top:4px;
  color:#f0f6fc;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.power-number{
  font-size:30px;
  font-weight:1000;
  margin-top:6px;
  letter-spacing:1px;
}
.vs-center{
  text-align:center;
  min-width:0;
}
.cross-swords{
  position:relative;
  width:64px;height:64px;
  margin:auto;
}
.cross-swords:before,
.cross-swords:after{
  content:"";
  position:absolute;
  left:29px;top:4px;
  width:7px;height:54px;
  border-radius:3px;
  background:linear-gradient(#e9f1f7 0 72%,#b88635 72% 82%,#5f3b20 82% 100%);
  transform-origin:center;
  box-shadow:0 0 0 1px #0008;
}
.cross-swords:before{transform:rotate(45deg)}
.cross-swords:after{transform:rotate(-45deg)}
.vs-text{
  font-size:12px;
  font-weight:900;
  color:#8b949e;
  margin-top:2px;
}
.battle-message{
  text-align:center;
  font-size:22px;
  font-weight:1000;
  margin:10px 0 4px;
}
.big-battle-btn{
  width:100%;
  min-height:56px;
  font-size:20px;
  margin-top:12px;
}

<body>
<div class="app">
  <h1>⚔️ 小學勇者大冒險 V6</h1>

  <div id="heroSetup" class="card" style="display:none">
    <h2>建立勇者</h2>
    <label>勇者名稱</label>
    <input id="setupName" placeholder="例如：熙熙">
    <label>職業</label>
    <select id="setupClass">
      <option>戰士</option><option>法師</option><option>遊俠</option>
    </select>
    <button class="btn gold" onclick="createHero()">開始冒險</button>
  </div>

  <div id="mainUI" style="display:none">
    <div class="nav">
      <button class="tab active" onclick="switchTab('hero',this)">狀態</button>
      <button class="tab" onclick="switchTab('tasks',this)">任務</button>
      <button class="tab" onclick="switchTab('dungeon',this)">副本</button>
      <button class="tab" onclick="switchTab('shop',this)">商店</button>
      <button class="tab" onclick="switchTab('lottery',this)">抽獎</button>
      <button class="tab" onclick="switchTab('bag',this)">背包</button>
      <button class="tab" onclick="switchTab('gm',this)">家長後台</button>
    </div>

    <section id="panel-hero" class="panel active"></section>
    <section id="panel-tasks" class="panel"></section>
    <section id="panel-dungeon" class="panel"></section>
    <section id="panel-shop" class="panel"></section>
    <section id="panel-lottery" class="panel"></section>
    <section id="panel-bag" class="panel"></section>
    <section id="panel-gm" class="panel"></section>
  </div>
</div>

async function sha256Text(s){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function daysBetween(a,b){
  const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');
  return Math.max(0,Math.ceil((B-A)/86400000));
}

}
function taskDailyPotential(t){
  const limit=Math.max(1,Number(t.dailyLimit)||1);
  const stat = t.taskType==='timer'
    ? Math.max(0,...(t.statRules||[]).map(r=>Number(r.value)||0))
    : Number(t.fixedStatValue)||0;
  return {
    exp:(Number(t.expReward)||0)*limit,
    gold:(Number(t.goldReward)||0)*limit,
    stat:stat*limit
  };
}
function dailyPotential(){
  return (gameData.tasks||[]).filter(t=>t.active).reduce((a,t)=>{
    const p=taskDailyPotential(t);
    a.exp+=p.exp;a.gold+=p.gold;a.stat+=p.stat;return a;
  },{exp:0,gold:0,stat:0});
}
function estimatePowerAt(date,rate=BALANCE_CONFIG.expectedCompletion){
  const days=daysBetween(today(),date);
  const active=(gameData.tasks||[]).filter(t=>t.active);
  let power=combatPower();
  active.forEach(t=>{
    const limit=Math.max(1,Number(t.dailyLimit)||1);
    let statKey='vit',statVal=0;
    if((t.taskType||'timer')==='timer'){
      const rules=[...(t.statRules||[])].sort((a,b)=>(Number(a.maxMinutes)||0)-(Number(b.maxMinutes)||0));
      const r=rules[Math.min(1,rules.length-1)]||rules[0];
      if(r){statKey=r.stat;statVal=Number(r.value)||0;}
    }else{
      statKey=t.fixedStat||'vit';statVal=Number(t.fixedStatValue)||0;
    }
    const weight=BALANCE_CONFIG.combatWeights[statKey]||1.5;
    power += days*rate*limit*statVal*weight;
  });
  return Math.round(power);
}
function balanceLevel(value,greenMax,yellowMax){
  value=Number(value)||0;
  if(value<=greenMax)return {cls:'balance-good',icon:'🟢',text:'合理'};
  if(value<=yellowMax)return {cls:'balance-warn',icon:'🟡',text:'偏高'};
  return {cls:'balance-bad',icon:'🔴',text:'可能破壞平衡'};
}
function taskBalanceReport(exp,gold,stat){
  const e=balanceLevel(exp,BALANCE_CONFIG.taskExp.greenMax,BALANCE_CONFIG.taskExp.yellowMax);
  const g=balanceLevel(gold,BALANCE_CONFIG.taskGold.greenMax,BALANCE_CONFIG.taskGold.yellowMax);
  const s=balanceLevel(stat,BALANCE_CONFIG.taskStat.greenMax,BALANCE_CONFIG.taskStat.yellowMax);
  const worst=[e,g,s].sort((a,b)=>['balance-good','balance-warn','balance-bad'].indexOf(b.cls)-['balance-good','balance-warn','balance-bad'].indexOf(a.cls))[0];
  return {worst,e,g,s};
}

  while(gameData.hero.exp>=gameData.hero.maxExp){
    gameData.hero.exp-=gameData.hero.maxExp;
    gameData.hero.level++;
    gameData.hero.maxExp=Math.floor(gameData.hero.maxExp*1.2);
    Object.keys(gameData.hero.stats).forEach(k=>gameData.hero.stats[k]+=1);

  const t=gameData.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(completedCount(taskId)>=t.dailyLimit){alert('今天已達完成上限');return;}
  gameData.activeTasks[taskId]=Date.now();
  saveGame();renderTasks();startLiveTimer();

function finishTask(taskId){
  const start=gameData.activeTasks[taskId];
  if(!start){alert('請先開始任務');return;}
  const t=gameData.tasks.find(x=>x.id===taskId);
  const minutes=(Date.now()-start)/60000;
  delete gameData.activeTasks[taskId];

  let statGain=null;
  for(const r of [...t.statRules].sort((a,b)=>a.maxMinutes-b.maxMinutes)){
    if(minutes<=r.maxMinutes){statGain=r;break;}
  }
  gameData.hero.gold+=Number(t.goldReward)||0;
  addExp(Number(t.expReward)||0);
  if(statGain){
    gameData.hero.stats[statGain.stat]+=Number(statGain.value)||0;
    gameData.hero.lastStatGains={[statGain.stat]:Number(statGain.value)||0};
  }else{
    gameData.hero.lastStatGains={};
  }

  const record={
    id:uid(),taskId:t.id,date:today(),status:'completed',
    startedAt:new Date(start).toISOString(),completedAt:new Date().toISOString(),
    durationMinutes:minutes,rewards:{gold:t.goldReward,exp:t.expReward,statGain}
  };

  if(t.subject||t.progressType||t.progressValue){
    gameData.learningProgress.push({
      id:uid(),date:today(),
      subject:t.subject||'',
      item:t.progressType||t.name,
      progress:t.progressValue||'完成'
    });
  }

  alert(`完成【${t.name}】\n耗時 ${minutes.toFixed(1)} 分鐘\n金幣 +${t.goldReward}\nEXP +${t.expReward}`+(statGain?`\n${statName(statGain.stat)} +${statGain.value}`:''));

function buyItem(itemId){
  const item=gameData.shopItems.find(x=>x.id===itemId);
  if(!item)return;
  const bought=gameData.inventory.filter(x=>x.itemId===itemId&&x.boughtDate===today()).length;
  if(bought>=item.dailyLimit){alert('今天已達購買上限');return;}
  if(gameData.hero.gold<item.price){alert('金幣不足');return;}
  if(!confirm(`花費 ${item.price} G 購買【${item.name}】？`))return;
  gameData.hero.gold-=item.price;
  gameData.inventory.push({id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'shop'});
  saveGame();renderAll();

function approveCoupon(reqId,approved){

function getTodayEvent(){
  return gameData.events.find(e=>e.date===today()&&e.active!==false)||null;
}
function ensureDailyDungeon(){
  if(gameData.dailyDungeon.date===today())return;
  const evt=getTodayEvent();
  if(evt){
    gameData.dailyDungeon={date:today(),monsterId:'',challenged:false,result:'',drop:null,eventId:evt.id};
  }else{
    const list=gameData.monsters.filter(x=>x.active);
    if(!list.length){
      gameData.dailyDungeon={date:today(),monsterId:'',challenged:false,result:'',drop:null,eventId:''};
    }else{
      const idx=Math.floor(new Date(today()).getTime()/86400000)%list.length;
      gameData.dailyDungeon={date:today(),monsterId:list[idx].id,challenged:false,result:'',drop:null,eventId:''};
    }
  }
  saveGame();
}
function weightedPick(items){
  const total=items.reduce((s,x)=>s+Math.max(0,Number(x.weight)||0),0);
  if(total<=0)return null;
  let r=Math.random()*total;
  for(const item of items){
    r-=Math.max(0,Number(item.weight)||0);
    if(r<=0)return item;
  }
  return items[items.length-1];
}
function rollDungeonDrop(){
  const choices=[
    {type:'gold',weight:60},
    {type:'coupon',weight:25},
    {type:'lottery',weight:15}
  ];
  const p=weightedPick(choices);
  if(!p)return null;
  if(p.type==='gold'){
    const amount=10+Math.floor(Math.random()*21);
    gameData.hero.gold+=amount;
    return {type:'gold',label:`金幣 +${amount} G`,value:amount};
  }
  if(p.type==='coupon'){
    const available=gameData.shopItems.filter(x=>x.active);
    if(!available.length){
      gameData.hero.gold+=20;
      return {type:'gold',label:'金幣 +20 G',value:20};
    }
    const item=available[Math.floor(Math.random()*available.length)];
    gameData.inventory.push({id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'dungeon'});
    return {type:'coupon',label:item.name,value:item.id};
  }
  gameData.hero.lotteryCoins+=1;
  return {type:'lottery',label:'抽獎金幣 ×1',value:1};
}
function challengeDungeon(){
  ensureDailyDungeon();
  if(gameData.dailyDungeon.challenged){alert('今天已挑戰過副本');return;}

  const evt=gameData.dailyDungeon.eventId?gameData.events.find(e=>e.id===gameData.dailyDungeon.eventId):null;
  const monster=evt?null:gameData.monsters.find(x=>x.id===gameData.dailyDungeon.monsterId);
  const enemyPower=evt?Number(evt.power):Number(monster?.power||0);
  const enemyName=evt?evt.name:monster?.name;
  if(!enemyName){alert('今天沒有敵人');return;}

  const cp=combatPower();
  const win=cp>=enemyPower;
  gameData.dailyDungeon.challenged=true;
  gameData.dailyDungeon.result=win?'win':'lose';

  let baseGold=evt?Number(evt.rewardGold||0):Number(monster.rewardGold||0);
  let baseExp=evt?Number(evt.rewardExp||0):Number(monster.rewardExp||0);
  let drop=null;

  if(win){
    gameData.hero.gold+=baseGold;
    addExp(baseExp);
    drop=rollDungeonDrop();
    gameData.dailyDungeon.drop=drop;
  }

  gameData.battleRecords.push({
    id:uid(),date:today(),enemyName,power:cp,enemyPower,result:win?'win':'lose',eventType:evt?.type||'daily',drop
  });

  saveGame();
  alert(win
    ? `⚔️ 勝利！\n基礎獎勵：${baseGold} G、${baseExp} EXP\n🎁 隨機掉落：${drop?.label||'無'}`
    : `💀 戰敗！\n你的戰鬥力 ${cp}\n敵方戰鬥力 ${enemyPower}`
  );
  renderAll();
}
function drawLottery(){
  if(gameData.hero.lotteryCoins<1){alert('沒有抽獎金幣');return;}
  const item=weightedPick(gameData.lotteryPool);
  if(!item){alert('抽獎池尚未設定');return;}
  gameData.hero.lotteryCoins--;

  let result='';
  if(item.type==='gold'){
    const amount=Number(item.value)||0;
    gameData.hero.gold+=amount;
    result=item.label;
  }else if(item.type==='shop'){
    const available=gameData.shopItems.filter(x=>x.active);
    if(available.length){
      const shop=available[Math.floor(Math.random()*available.length)];
      gameData.inventory.push({id:uid(),itemId:shop.id,name:shop.name,status:'unused',boughtDate:today(),source:'lottery'});
      result=shop.name;
    }else{
      gameData.hero.gold+=50;
      result='商店沒有商品，改獲得金幣 +50 G';
    }
  }
  saveGame();renderAll();
  alert('🎰 抽獎結果：'+result);
}
function exportLearningCSV(){
  if(!gameData.learningProgress.length){alert('目前沒有學習進度紀錄');return;}
  const rows=[['日期','科目','項目','進度']];
  gameData.learningProgress.forEach(r=>rows.push([r.date,r.subject,r.item,r.progress]));
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const csv='\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`學習進度_${today()}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
}

setTimeout(refreshTaskBalancePreview,0);

function saveCloudConfig(){
  const c=gameData.settings.cloud||{};
  c.apiKey=document.getElementById('fbApiKey').value.trim();
  c.authDomain=document.getElementById('fbAuthDomain').value.trim();
  c.projectId=document.getElementById('fbProjectId').value.trim();
  c.storageBucket=document.getElementById('fbStorageBucket').value.trim();
  c.messagingSenderId=document.getElementById('fbSenderId').value.trim();
  c.appId=document.getElementById('fbAppId').value.trim();
  c.email=document.getElementById('fbEmail').value.trim();
  c.enabled=!!(c.apiKey&&c.authDomain&&c.projectId&&c.appId);
  gameData.settings.cloud=c;saveGame();alert('雲端設定已儲存');renderGM();
}
function gmAddTask(){
  const name=document.getElementById('gmTaskName').value.trim();
  if(!name){alert('請輸入任務名稱');return;}
  const taskType=document.getElementById('gmTaskType').value;
  let rules=[];
  if(taskType==='timer'){
    rules=[
      {maxMinutes:Number(document.getElementById('gmRule1Min').value),stat:document.getElementById('gmRule1Stat').value,value:Number(document.getElementById('gmRule1Val').value)},
      {maxMinutes:Number(document.getElementById('gmRule2Min').value),stat:document.getElementById('gmRule2Stat').value,value:Number(document.getElementById('gmRule2Val').value)}
    ].filter(r=>r.maxMinutes>0&&r.value!==0);
  }

  const previewExp=Number(document.getElementById('gmTaskExp').value)||0;
  const previewGold=Number(document.getElementById('gmTaskGold').value)||0;
  const previewStat=taskType==='timer'
    ?Math.max(0,...rules.map(r=>Number(r.value)||0))
    :(Number(document.getElementById('gmFixedStatValue')?.value)||0);
  const br=taskBalanceReport(previewExp,previewGold,previewStat);
  if(br.worst.cls==='balance-bad' && !confirm('🔴 這組任務獎勵可能破壞目前的數值平衡。\n仍要建立嗎？')) return;

  gameData.tasks.push({
    id:uid(),name,taskType,
    description:document.getElementById('gmTaskDesc').value.trim(),
    subject:document.getElementById('gmSubject').value.trim(),
    progressType:document.getElementById('gmProgressType').value.trim(),
    progressValue:document.getElementById('gmProgressValue').value.trim(),
    goldReward:Number(document.getElementById('gmTaskGold').value)||0,
    expReward:Number(document.getElementById('gmTaskExp').value)||0,
    dailyLimit:Math.max(1,Number(document.getElementById('gmTaskLimit').value)||1),
    active:true,statRules:rules,
    fixedStat:document.getElementById('gmFixedStat')?.value||'vit',
    fixedStatValue:Number(document.getElementById('gmFixedStatValue')?.value)||0,
    quantityTarget:Math.max(1,Number(document.getElementById('gmQuantityTarget')?.value)||1),
    quantityUnit:(document.getElementById('gmQuantityUnit')?.value||'次').trim()
  });
  saveGame();renderAll();
}
function deleteTask(id){if(confirm('刪除此任務？')){gameData.tasks=gameData.tasks.filter(x=>x.id!==id);saveGame();renderAll();}}
function gmAddShopItem(){
  const name=document.getElementById('gmShopName').value.trim();
  if(!name){alert('請輸入商品名稱');return;}
  gameData.shopItems.push({
    id:uid(),name,description:document.getElementById('gmShopDesc').value.trim(),
    price:Number(document.getElementById('gmShopPrice').value)||0,
    dailyLimit:Math.max(1,Number(document.getElementById('gmShopLimit').value)||1),
    active:true
  });
  saveGame();renderAll();
}
function deleteShopItem(id){if(confirm('刪除此商品？')){gameData.shopItems=gameData.shopItems.filter(x=>x.id!==id);saveGame();renderAll();}}
function gmAddMonster(){
  const name=document.getElementById('gmMonName').value.trim();
  if(!name){alert('請輸入怪物名稱');return;}
  gameData.monsters.push({
    id:uid(),name,power:Number(document.getElementById('gmMonPower').value)||1,
    rewardGold:Number(document.getElementById('gmMonGold').value)||0,
    rewardExp:Number(document.getElementById('gmMonExp').value)||0,active:true
  });
  saveGame();renderAll();
}
function gmAddEvent(){
  const date=document.getElementById('gmEventDate').value;
  const type=document.getElementById('gmEventType').value;
  let name=document.getElementById('gmEventName').value.trim();
  if(!date){alert('請選日期');return;}
  if(!name)name=type==='final'?'學期終焉之龍':'期中大魔王';
  gameData.events.push({
    id:uid(),date,type,name,
    power:Number(document.getElementById('gmEventPower').value)||100,
    rewardGold:Number(document.getElementById('gmEventGold').value)||0,
    rewardExp:Number(document.getElementById('gmEventExp').value)||0,
    active:true
  });
  if(date===today())gameData.dailyDungeon={date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''};
  saveGame();renderAll();
}
function deleteEvent(id){
  if(confirm('刪除此考試事件？')){
    gameData.events=gameData.events.filter(x=>x.id!==id);
    if(gameData.dailyDungeon.eventId===id)gameData.dailyDungeon={date:'',monsterId:'',challenged:false,result:'',drop:null,eventId:''};
    saveGame();renderAll();
  }
}
function gmAddGold(n){gameData.hero.gold+=n;saveGame();renderAll();}
function gmAddLotteryCoin(n){gameData.hero.lotteryCoins+=n;saveGame();renderAll();}
function resetAll(){
  if(confirm('確定清除全部資料？此動作無法復原。')){
    localStorage.removeItem(STORAGE_KEY);location.reload();
  }
}
function renderAll(){renderHero();renderTasks();renderDungeon();renderShop();renderLottery();renderBag();renderGM();startLiveTimer();startStatusClock();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTasks();startLiveTimer();}});
function boot(){
  if(!gameData.hero.name){
    document.getElementById('heroSetup').style.display='block';
    document.getElementById('mainUI').style.display='none';
  }else{
    document.getElementById('heroSetup').style.display='none';
    document.getElementById('mainUI').style.display='block';
    ensureDailyDungeon();renderAll();
  }
}
boot();
</script>

<script type="module">
let fb=null,auth=null,db=null,currentUser=null,saving=false;

async function initFirebase(){
  const c=gameData.settings?.cloud;
  if(!c?.enabled)return false;
  try{
    const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const fsMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    fb={appMod,authMod,fsMod};
    const app=appMod.initializeApp({
      apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,
      storageBucket:c.storageBucket,messagingSenderId:c.messagingSenderId,appId:c.appId
    });
    auth=authMod.getAuth(app); db=fsMod.getFirestore(app);
    authMod.onAuthStateChanged(auth,async user=>{
      currentUser=user;
      if(user){
        const s=document.getElementById('cloudStatus');
        if(s)s.textContent='☁️ 已登入：'+user.email;
        await pullCloud();
      }
    });
    return true;
  }catch(e){console.error(e);alert('Firebase 初始化失敗：'+e.message);return false;}
}
async function pullCloud(){
  if(!currentUser||!db)return;
  const {doc,getDoc}=fb.fsMod;
  const ref=doc(db,'users',currentUser.uid,'game','main');
  const snap=await getDoc(ref);
  if(snap.exists()){
    const cloud=snap.data()?.gameData;
    if(cloud){
      const localCfg=gameData.settings?.cloud;
      gameData=cloud;
      if(!gameData.settings)gameData.settings={parentPinHash:'',cloud:{}};
      gameData.settings.cloud=localCfg||gameData.settings.cloud||{};
      localStorage.setItem(STORAGE_KEY,JSON.stringify(gameData));
      renderAll();
    }
  }else await pushCloud();
}
async function pushCloud(){
  if(!currentUser||!db||saving)return;
  saving=true;
  try{
    const {doc,setDoc,serverTimestamp}=fb.fsMod;
    const clone=JSON.parse(JSON.stringify(gameData));
    await setDoc(doc(db,'users',currentUser.uid,'game','main'),{gameData:clone,updatedAt:serverTimestamp()},{merge:true});
  }catch(e){console.error(e);}
  finally{saving=false;}
}
window.cloudSaveGame=()=>{if(currentUser)pushCloud();};
window.firebaseLogin=async()=>{
  if(!fb){const ok=await initFirebase();if(!ok)return;}
  const email=document.getElementById('fbEmail')?.value.trim()||gameData.settings.cloud.email;
  const password=document.getElementById('fbPassword')?.value||'';
  if(!email||!password){alert('請輸入 Firebase Email 與密碼');return;}
  try{
    await fb.authMod.signInWithEmailAndPassword(auth,email,password);
    gameData.settings.cloud.email=email;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(gameData));
    alert('雲端登入成功');
  }catch(e){alert('登入失敗：'+e.message);}
};
if(gameData.settings?.cloud?.enabled)initFirebase();
</script>
