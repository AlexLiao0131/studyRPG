<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyRPG Skill / Affix Editor</title><style>
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;margin:0;padding:16px}.app{max-width:1100px;margin:auto}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button,input,select,textarea{background:#0d1117;color:#f0f6fc;border:1px solid #30363d;border-radius:8px;padding:9px}button{cursor:pointer;font-weight:700}textarea{width:100%;min-height:310px;font-family:ui-monospace,monospace;box-sizing:border-box}.tabs button.active{background:#238636}.small{font-size:12px;color:#8b949e}.good{color:#3fb950}.bad{color:#ff7b72}.item{padding:8px;border-bottom:1px solid #30363d;cursor:pointer}.item:hover{background:#21262d}.grid{display:grid;grid-template-columns:280px 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><h1>StudyRPG 技能 / 詞綴資料編輯器</h1><div class="card"><b>安全模式：</b>只編輯資料庫 JS，不讀寫 familyData / gameData / Firebase。匯出後需經 Runtime 驗證才接入正式主程式。<div class="small">支援 skill-database.js 與 affix-database.js；匯入檔案只在本機瀏覽器解析。</div></div>
<div class="row tabs"><button id="tabSkill" class="active" onclick="setMode('skill')">技能資料庫</button><button id="tabAffix" onclick="setMode('affix')">詞綴資料庫</button></div>
<div class="card"><div class="row"><div><label>匯入目前資料庫 JS</label><input id="file" type="file" accept=".js,text/javascript"></div><div><label>快速搜尋</label><input id="q" placeholder="ID / 名稱" oninput="renderList()"></div></div><div class="row"><button onclick="addEntry()">＋新增</button><button onclick="duplicateEntry()">複製目前項目</button><button onclick="removeEntry()">刪除目前項目</button><button onclick="exportDb()">匯出正式 JS</button></div><div id="msg" class="small"></div></div>
<div class="grid"><div class="card"><b id="listTitle">技能</b><div id="list"></div></div><div class="card"><div class="row"><div><label>ID</label><input id="id" oninput="syncId()"></div><div><label>類別</label><select id="group" onchange="selectGroup()"></select></div></div><label>資料 JSON</label><textarea id="json" oninput="validateJson()"></textarea><div id="valid" class="small"></div><button onclick="saveEntry()">儲存目前項目</button></div></div></div>
<script>
let mode='skill',db=null,currentId='',currentGroup='';
const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));
function defaultSkill(){return {schemaVersion:1,databaseVersion:'skill-db-v1',beginner:[],jobs:{},monsterSkills:{},monsterAI:{},jobPassives:{},ultimates:{}}}
function defaultAffix(){return {schemaVersion:1,databaseVersion:'affix-db-v1',affixes:{}}}
function setMode(m){mode=m;db=m==='skill'?defaultSkill():defaultAffix();currentId='';$('tabSkill').classList.toggle('active',m==='skill');$('tabAffix').classList.toggle('active',m==='affix');renderGroups();renderList();$('json').value='';$('id').value='';}
function groups(){return mode==='skill'?['beginner','jobs','monsterSkills','monsterAI','jobPassives','ultimates']:['affixes']}
function renderGroups(){ $('group').innerHTML=groups().map(g=>`<option>${g}</option>`).join(''); currentGroup=$('group').value; $('listTitle').textContent=mode==='skill'?'技能 / AI / 被動':'裝備詞綴';}
function selectGroup(){currentGroup=$('group').value;currentId='';renderList();$('json').value='';$('id').value='';}
function entries(){const g=db?.[currentGroup]; if(Array.isArray(g)) return g.map((x,i)=>[x.id||String(i),x]); return Object.entries(g||{});}
function renderList(){const q=$('q').value.toLowerCase();$('list').innerHTML=entries().filter(([id,v])=>(id+' '+(v?.name||v||'')).toLowerCase().includes(q)).map(([id,v])=>`<div class="item" onclick='pick(${JSON.stringify(id)})'><b>${id}</b><div class="small">${typeof v==='object'?(v.name||''):String(v)}</div></div>`).join('')||'<div class="small">沒有資料</div>';}
function pick(id){const pair=entries().find(x=>x[0]===id);if(!pair)return;currentId=id;$('id').value=id;$('json').value=JSON.stringify(pair[1],null,2);validateJson();}
function validateJson(){try{JSON.parse($('json').value);$('valid').textContent='✓ JSON 正常';$('valid').className='small good';return true}catch(e){$('valid').textContent='✗ '+e.message;$('valid').className='small bad';return false}}
function syncId(){}
function saveEntry(){if(!validateJson())return;const id=$('id').value.trim();if(!id)return alert('請輸入 ID');const val=JSON.parse($('json').value),g=db[currentGroup];if(Array.isArray(g)){const i=g.findIndex(x=>x.id===currentId);val.id=id;if(i>=0)g[i]=val;else g.push(val)}else{if(currentId&&currentId!==id)delete g[currentId];g[id]=val}currentId=id;renderList();$('msg').textContent='已更新編輯器記憶體；尚未改動正式遊戲。';}
function addEntry(){currentId='';$('id').value='new_id';$('json').value=JSON.stringify(mode==='affix'?{id:'new_id',name:'新詞綴',slots:['weapon'],kind:'stat',stat:'attack',min:1,max:1}:{id:'new_id',name:'新技能'},null,2);validateJson()}
function duplicateEntry(){if(!currentId)return;const v=JSON.parse($('json').value);currentId='';$('id').value=(v.id||'item')+'_copy';if(v&&typeof v==='object')v.id=$('id').value;$('json').value=JSON.stringify(v,null,2)}
function removeEntry(){if(!currentId||!confirm('刪除目前項目？只影響編輯器記憶體。'))return;const g=db[currentGroup];if(Array.isArray(g)){const i=g.findIndex(x=>x.id===currentId);if(i>=0)g.splice(i,1)}else delete g[currentId];currentId='';$('id').value='';$('json').value='';renderList()}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();try{const fake={};const fn=new Function('window',txt+';return window;');fn(fake);const got=mode==='skill'?(fake.STUDYRPG_SKILL_DATABASE_V2||fake.STUDYRPG_SKILL_DATABASE):fake.STUDYRPG_AFFIX_DATABASE;if(!got)throw Error('找不到對應 STUDYRPG 資料庫');db=clone(got);renderGroups();renderList();$('msg').textContent='✓ '+f.name+' 載入成功';}catch(err){$('msg').textContent='✗ '+err.message}});
function exportDb(){if(!db)return;const name=mode==='skill'?'skill-database.js':'affix-database.js',globalName=mode==='skill'?'STUDYRPG_SKILL_DATABASE_V2':'STUDYRPG_AFFIX_DATABASE';const text=`/* StudyRPG ${mode==='skill'?'Skill':'Affix'} Database - exported by editor */\nwindow.${globalName}=${JSON.stringify(db,null,2)};\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
setMode('skill');
</script></body></html>
