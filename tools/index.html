<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyRPG Visual Database Editor V2</title><style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0d1117;color:#eee;margin:0;padding:12px}.app{max-width:1100px;margin:auto}.bar,.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}select,input,button{background:#0d1117;color:#fff;border:1px solid #59616d;border-radius:8px;padding:9px}button{cursor:pointer;background:#238636;font-weight:800}.preview-wrap{overflow:auto;padding:8px;background:#090d13;border-radius:10px}.stage{position:relative;background:#1c2733;overflow:hidden;border:2px solid #59616d;border-radius:10px;margin:auto;max-width:none;flex:none}.ground{position:absolute;left:0;right:0;border-top:2px dashed #ffd33d;z-index:10}.unit{position:absolute;translate:-50% -100%;transform-origin:center bottom;display:grid;place-items:center;border:1px dashed #58a6ff;background:#58a6ff22;touch-action:none;user-select:none}.unit.enemy{border-color:#ff7b72;background:#ff7b7222}.handle{position:absolute;right:4px;top:4px;font-size:11px;background:#0009;padding:2px 4px}.small{font-size:12px;color:#9da7b3}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><h2>StudyRPG Visual Database Editor V2</h2><div class="small">Tool 與正式版共用 ground + foot anchor 算法。預覽尺寸依正式 .app 寬度與場景高度計算，不再固定假平板 720px。</div>
<div class="bar row"><input id="file" type="file" accept=".js"><select id="dev"><option value="desktop">電腦</option><option value="tablet">平板</option><option value="mobile">手機</option></select><select id="viewport"></select><select id="scene"><option value="status">狀態</option><option value="dungeonEntry">副本入口</option><option value="battle">戰鬥</option></select><input id="week" type="number" min="1" value="1" title="週次"><button id="export">輸出 visual-database.js</button></div>
<div class="card"><div class="small" id="dims"></div><div class="preview-wrap"><div id="stage" class="stage"><div id="ground" class="ground"></div><div id="hero" class="unit">勇者<span class="handle">腳底</span></div><div id="enemy" class="unit enemy">怪物<span class="handle">腳底</span></div></div></div></div>
<div class="card grid"><label>地板 Y %<input id="groundY" type="number" step="0.1"></label><label>勇者 X %<input id="heroX" type="number" step="0.1"></label><label>勇者腳底偏移 %<input id="heroOff" type="number" step="0.1"></label><label>勇者尺寸 px<input id="heroSize" type="number"></label><label>怪物 X %<input id="enemyX" type="number" step="0.1"></label><label>怪物腳底偏移 %<input id="enemyOff" type="number" step="0.1"></label><label>怪物尺寸 px<input id="enemySize" type="number"></label></div><div class="small" id="msg">先載入正式 visual-database.js。</div></div><script>
let DB=null;const $=id=>document.getElementById(id);
const VIEW={desktop:[1440,1280,1024],tablet:[1366,1194,1024,834,768],mobile:[430,390,375]};
function d(){return $('dev').value}function s(){return $('scene').value}function w(){return Math.max(1,Number($('week').value)||1)}
function syncViewport(){const old=Number($('viewport').value),arr=VIEW[d()];$('viewport').innerHTML=arr.map(x=>`<option value="${x}">${x}px viewport</option>`).join('');$('viewport').value=arr.includes(old)?old:arr[0]}
function formalDims(){const vw=Number($('viewport').value)||VIEW[d()][0];const outer=Math.min(920,Math.max(0,vw-24));const content=Math.max(120,outer-34);let width=content,height=260;if(s()==='battle')height=d()==='mobile'?270:310;else if(s()==='status')height=260;else{height=d()==='mobile'?165:210;width=Math.max(90,(content-10)/2-24)}return{vw,width:Math.round(width),height}}
function cell(){return DB?.devices?.[d()]?.[s()]}
function groundValue(){const key=s()==='battle'?'dungeon':s();for(let n=w();n>=1;n--){const c=DB?.groundByWeek?.[String(n)]?.[d()];if(c&&typeof c==='object'&&Number.isFinite(Number(c[key])))return Number(c[key]);if(Number.isFinite(Number(c)))return Number(c)}return Number(cell()?.groundY)||50}
function setGround(v){const key=s()==='battle'?'dungeon':s();DB.groundByWeek=DB.groundByWeek||{};DB.groundByWeek[String(w())]=DB.groundByWeek[String(w())]||{};let c=DB.groundByWeek[String(w())][d()];if(!c||typeof c!=='object')c={};c[key]=Number(v);DB.groundByWeek[String(w())][d()]=c}
function render(){if(!DB)return;const c=cell();if(!c)return;const dm=formalDims(),st=$('stage');st.style.width=dm.width+'px';st.style.height=dm.height+'px';$('dims').textContent=`正式幾何預覽：viewport ${dm.vw}px → scene ${dm.width} × ${dm.height}px`;const gy=groundValue();$('groundY').value=gy;$('ground').style.top=gy+'%';const h=c.hero||{},e=c.enemy||{};$('heroX').value=h.x??50;$('heroOff').value=h.footOffsetY??0;$('heroSize').value=c.heroSize||150;$('hero').style.left=(h.x??50)+'%';$('hero').style.top=(gy+Number(h.footOffsetY||0))+'%';$('hero').style.width=$('hero').style.height=(c.heroSize||150)+'px';const show=!!c.enemy;$('enemy').style.display=show?'grid':'none';if(show){$('enemyX').value=e.x??50;$('enemyOff').value=e.footOffsetY??0;$('enemySize').value=c.enemySize||150;$('enemy').style.left=(e.x??50)+'%';$('enemy').style.top=(gy+Number(e.footOffsetY||0))+'%';$('enemy').style.width=$('enemy').style.height=(c.enemySize||150)+'px'}$('msg').textContent=`${d()} / ${s()} / 第${w()}週：ground=${gy}%`}
function bindInputs(){for(const id of ['groundY','heroX','heroOff','heroSize','enemyX','enemyOff','enemySize'])$(id).oninput=()=>{if(!DB)return;const c=cell();if(id==='groundY')setGround($('groundY').value);if(id==='heroX')c.hero.x=Number($('heroX').value);if(id==='heroOff')c.hero.footOffsetY=Number($('heroOff').value);if(id==='heroSize')c.heroSize=Number($('heroSize').value);if(c.enemy){if(id==='enemyX')c.enemy.x=Number($('enemyX').value);if(id==='enemyOff')c.enemy.footOffsetY=Number($('enemyOff').value);if(id==='enemySize')c.enemySize=Number($('enemySize').value)}render()}}
function drag(el,key){el.onpointerdown=ev=>{if(!DB)return;el.setPointerCapture(ev.pointerId);el.onpointermove=e=>{const r=$('stage').getBoundingClientRect(),c=cell(),a=c[key];a.x=Math.round(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))*10)/10;const foot=Math.round(Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))*10)/10;a.footOffsetY=Math.round((foot-groundValue())*10)/10;render()};el.onpointerup=()=>el.onpointermove=null}}
$('file').onchange=async e=>{const t=await e.target.files[0].text();try{const json=t.replace(/^.*?window\.STUDYRPG_VISUAL_DATABASE\s*=\s*/s,'').replace(/;\s*$/,'');DB=JSON.parse(json);render()}catch(err){$('msg').textContent='讀取失敗：'+err.message}};
$('dev').onchange=()=>{syncViewport();render()};for(const id of ['viewport','scene','week'])$(id).onchange=render;$('export').onclick=()=>{if(!DB)return;const text='/* StudyRPG Visual Database v1 */\nwindow.STUDYRPG_VISUAL_DATABASE='+JSON.stringify(DB,null,2)+';\n',b=new Blob([text],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='visual-database.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};syncViewport();bindInputs();drag($('hero'),'hero');drag($('enemy'),'enemy');
</script></body></html>
